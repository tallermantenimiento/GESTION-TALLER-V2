name: Nesting - regresion de formatos y retales
on:
  push:
    branches: [main]
    paths:
      - 'modulos/nesting_chapas.html'
      - 'modulos/nesting_engine/**'
      - 'modulos/nesting_chapas_olaso_seed.json'
      - 'tests/nesting_v98_test.mjs'
      - '.github/workflows/nesting-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nesting-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium y motor WASM real, sin acceso a Firestore
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install chromium --with-deps
          python3 -m http.server 8876 --bind 127.0.0.1 >/tmp/nesting-regression-server.log 2>&1 &
          node tests/nesting_v98_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nesting-regression-resultados
          path: |
            tests/nesting_v98_result.json
            tests/nesting_v98_*.png
          if-no-files-found: warn
