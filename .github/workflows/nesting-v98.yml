name: Nesting V9.8 - diagnostico y regresion
on:
  push:
    branches: ['fix/nesting-regresion-formatos-v98-20261116']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar candidata cuando exista
        run: |
          if test -f tests/nesting_v98_patch.py; then python3 tests/nesting_v98_patch.py; fi
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('tests/nesting_v98_test.mjs') != '' }}
        with:
          node-version: '22'
      - name: Probar navegador aislado
        if: ${{ hashFiles('tests/nesting_v98_test.mjs') != '' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install chromium --with-deps
          python3 -m http.server 8876 --bind 127.0.0.1 >/tmp/nesting-v98-server.log 2>&1 &
          node tests/nesting_v98_test.mjs
      - name: Conservar candidata en esta rama
        if: ${{ success() && hashFiles('tests/nesting_v98_test.mjs') != '' }}
        run: |
          git config user.name 'Nesting regression'
          git config user.email 'nesting-regression@users.noreply.github.com'
          if ! git diff --quiet -- modulos/nesting_chapas.html; then
            git add modulos/nesting_chapas.html
            git commit -m 'Nesting V9.8: candidata probada en Chromium'
            git push origin HEAD:fix/nesting-regresion-formatos-v98-20261116
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nesting-v98-inspeccion
          path: |
            modulos/nesting_chapas.html
            modulos/nesting_chapas_olaso_seed.json
            modulos/nesting_engine/
            tests/nesting_v98_result.json
            tests/nesting_v98_*.png
          if-no-files-found: error
