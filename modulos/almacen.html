<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Almacén · Gestión Taller</title>
  <style>
    :root{
      --bg:#08111f;--panel:#101b31;--panel2:#0b1324;--line:#263750;--text:#f8fafc;
      --muted:#93a4bb;--cyan:#22d3ee;--blue:#0ea5e9;--green:#10b981;--orange:#f59e0b;--red:#ef4444;
      --radius:16px;--shadow:0 16px 40px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,Arial,sans-serif}
    body{font-size:14px}
    .topbar{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#071020;border-bottom:1px solid var(--line)}
    .topbar strong{font-size:15px}.spacer{flex:1}
    .btn{border:1px solid rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(14,165,233,.23),rgba(14,165,233,.11));color:#bff3ff;border-radius:10px;font-weight:800;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);font-size:13px}
    .btn:hover{filter:brightness(1.15)}.btn.small{padding:7px 10px;font-size:12px;border-radius:8px}
    .btn.green{border-color:rgba(16,185,129,.4);background:linear-gradient(180deg,rgba(16,185,129,.28),rgba(16,185,129,.12));color:#caffea}
    .btn.orange{border-color:rgba(245,158,11,.45);background:linear-gradient(180deg,rgba(245,158,11,.28),rgba(245,158,11,.12));color:#ffe7b0}
    .btn.red{border-color:rgba(239,68,68,.45);background:linear-gradient(180deg,rgba(239,68,68,.28),rgba(239,68,68,.12));color:#ffd1d1}
    .wrap{padding:28px 18px 60px}
    .hero{width:min(650px,100%);border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(16,27,49,.98),rgba(12,22,40,.98));box-shadow:var(--shadow);padding:22px 24px;margin:0 0 34px}
    h1{margin:0;display:flex;align-items:center;gap:13px;font-size:28px;letter-spacing:-.03em}
    .head-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--cyan);border:1px solid rgba(34,211,238,.28);background:rgba(34,211,238,.08)}
    .hero p{margin:9px 0 0;color:#9bdcff;font-weight:600}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .search{flex:1;min-width:260px;background:#050b19;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    select{background:#050b19;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:700}
    .status{color:#9bdcff;font-weight:800;font-size:12px;border:1px solid rgba(34,211,238,.22);border-radius:999px;padding:8px 10px;background:rgba(34,211,238,.06)}
    .card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(16,27,49,.96),rgba(10,19,36,.96));box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
    .section-title{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
    .company{border:1px solid rgba(148,163,184,.22);border-radius:14px;margin:14px 0;background:rgba(6,12,24,.42);overflow:hidden}
    .company-head{display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(15,23,42,.72);border-bottom:1px solid rgba(148,163,184,.18);cursor:pointer;user-select:none}
    .company-name{font-size:16px;font-weight:900;letter-spacing:.02em}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}
    .b-blue{background:rgba(14,165,233,.18);color:#7dd3fc;border:1px solid rgba(14,165,233,.28)}
    .b-green{background:rgba(16,185,129,.18);color:#86efac;border:1px solid rgba(16,185,129,.28)}
    .b-orange{background:rgba(245,158,11,.18);color:#fed7aa;border:1px solid rgba(245,158,11,.3)}
    .b-red{background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(239,68,68,.3)}
    table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid rgba(148,163,184,.15);vertical-align:middle;text-align:left}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd;background:rgba(15,23,42,.5)}
    tr:hover td{background:rgba(34,211,238,.04)}
    .ref{font-weight:900;color:#fff}.concept{font-size:12px;color:#a7f3d0;margin-top:3px}.muted{color:var(--muted);font-size:12px}
    .flow{display:flex;gap:6px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .empty{text-align:center;color:var(--muted);padding:40px 14px;border:1px dashed rgba(148,163,184,.25);border-radius:14px;background:rgba(15,23,42,.35)}
    .toast{position:fixed;right:16px;bottom:16px;background:#042f2e;border:1px solid rgba(16,185,129,.45);color:#d1fae5;border-radius:12px;padding:12px 14px;font-weight:900;box-shadow:var(--shadow);display:none;z-index:50}
    @media(max-width:900px){.wrap{padding:18px 10px 40px}table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-bottom:1px solid rgba(148,163,184,.2);padding:10px}td{border:0;padding:6px 0}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn" href="../index.html">← Menú</a>
    <strong>Almacén</strong>
    <span class="spacer"></span>
    <a class="btn small" href="fabricacion.html">← Fabricación</a>
    <button class="btn small" onclick="App.reload()">Actualizar</button>
  </div>

  <main class="wrap">
    <section class="hero">
      <h1><span class="head-icon" aria-hidden="true">🏭</span>Almacén</h1>
      <p>Pedidos en almacén, pendientes de entrega.</p>
    </section>

    <div class="toolbar">
      <input id="q" class="search" placeholder="Buscar referencia, concepto o empresa..." oninput="App.render()">
      <select id="companyFilter" onchange="App.render()"><option value="">Todas las empresas</option></select>
      <span id="status" class="status">Cargando...</span>
    </div>

    <section class="card">
      <h2 class="section-title">📦 Pedidos en almacén</h2>
      <div id="list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

<script>
(function(){
  const KEY = "ldh_db";

  function getStore(k){
    try{ const v = localStorage.getItem(k); if(v !== null && v !== undefined) return v; }catch(e){}
    try{ const v = sessionStorage.getItem(k); if(v !== null && v !== undefined) return v; }catch(e){}
    return null;
  }
  function setStore(k, v){
    try{ localStorage.setItem(k, v); return true; }catch(e1){
      try{
        const stock = localStorage.getItem("ldh_v2_company_stock_v1");
        if(stock){ try{ sessionStorage.setItem("ldh_v2_company_stock_v1", stock); }catch(e){} localStorage.removeItem("ldh_v2_company_stock_v1"); }
        localStorage.setItem(k, v); return true;
      }catch(e2){}
      try{ sessionStorage.setItem(k, v); return true; }catch(e3){}
    }
    return false;
  }
  function parse(raw, fallback){ try{ return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
  function n(v){ const x = Number(String(v ?? 0).replace(",", ".")); return Number.isFinite(x) ? x : 0; }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
  function fmtDate(v){
    if(!v) return "";
    const s = String(v);
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[3]}/${m[2]}/${m[1]}`;
    return s;
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function uid(p){ return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }

  window.App = {
    state:{ deliveries:[], deliveryCompanies:[] },

    init(){
      this.load();
      this.mergePrepMeta();
      this.loadCompanies();
      this.render();
      window.addEventListener("storage", () => { this.reload(false); });
      setInterval(() => this.reload(false), 12000);
    },

    reload(show=true){
      this.load();
      this.mergePrepMeta();
      this.loadCompanies();
      this.render();
      if(show) this.toast("Almacén actualizado");
    },

    load(){
      const raw = getStore(KEY);
      const db = parse(raw, null);
      if(db && typeof db === "object"){
        this.state = {
          ...db,
          deliveries: Array.isArray(db.deliveries) ? db.deliveries : [],
          deliveryCompanies: Array.isArray(db.deliveryCompanies) ? db.deliveryCompanies : []
        };
      }else{
        this.state = { deliveries:[], deliveryCompanies:[] };
      }
    },

    save(){
      this.state.updatedAt = new Date().toISOString();
      const ok = setStore(KEY, JSON.stringify(this.state));
      if(!ok) alert("No se pudo guardar Almacén porque el almacenamiento del navegador está lleno.");
      return ok;
    },

    loadCompanies(){
      const names = new Set();
      const push = (v) => {
        const name = String(v && (v.name || v.nombre || v.company || v.empresa || v.id || v) || "").trim();
        if(name) names.add(name);
      };

      (this.state.deliveryCompanies || []).forEach(push);
      (this.state.deliveries || []).forEach(x => push(x.company || x.empresa || x.empresaReceptora));

      ["ldh_v2_company_stock_v1","taller_stock_v3_data","ldh_company_master_v1","ldh_empresas_centralizadas_v1"].forEach(k=>{
        const d = parse(getStore(k), null);
        if(!d) return;
        if(Array.isArray(d)) d.forEach(push);
        if(Array.isArray(d.companies)) d.companies.forEach(push);
        if(Array.isArray(d.empresas)) d.empresas.forEach(push);
        if(d.stock && typeof d.stock === "object") Object.keys(d.stock).forEach(push);
      });

      const sel = document.getElementById("companyFilter");
      const current = sel.value;
      const arr = Array.from(names).sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
      sel.innerHTML = '<option value="">Todas las empresas</option>' + arr.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
      if(arr.includes(current)) sel.value = current;
    },

    mergePrepMeta(){
      let changed = false;
      const keys = [];
      try{
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf("prep_meta_") === 0) keys.push(k);
        }
      }catch(e){}
      try{
        for(let i=0;i<sessionStorage.length;i++){
          const k = sessionStorage.key(i);
          if(k && k.indexOf("prep_meta_") === 0 && !keys.includes(k)) keys.push(k);
        }
      }catch(e){}

      keys.forEach(k=>{
        const ref = k.replace(/^prep_meta_/,"").trim();
        const meta = parse(getStore(k), null);
        if(!ref || !meta) return;
        const fase = norm(meta.fase || meta.estado || meta.status);
        const isAlm = !!(meta.en_almacen || meta.almacen_ts || fase.includes("almacen"));
        const isEnt = !!(meta.entregado || meta.en_entregado || meta.entregado_ts || fase.includes("entreg"));
        if(!isAlm || isEnt) return;

        const units = n(meta.unidades || meta.uds || meta.total || meta.cantidad || 1) || 1;
        const company = String(meta.empresa || meta.company || meta.empresaReceptora || meta.empresa_receptora || "").trim();
        const concept = String(meta.concepto || meta.concept || "Sin concepto").trim();

        const rec = {
          id: meta.pedido_uid || ("ALM-" + ref),
          ref, referencia: ref,
          concept, concepto: concept,
          company, empresa: company, empresaReceptora: company,
          total: units,
          delivered: 0,
          status:"pendiente",
          estado:"pendiente",
          fase:"almacen",
          tipo:"almacen",
          keepInFab:false,
          hideFromFab:false,
          archived:false,
          datePed: meta.fecha_pedido || meta.datePed || meta.createdAt || todayISO(),
          datePrev: meta.fecha_entrega || meta.datePrev || todayISO(),
          flow:{ fab:0, fabricacion:0, pintura:0, almacen:units, entregado:0 },
          history: Array.isArray(meta.history) ? meta.history : []
        };
        changed = this.upsertDelivery(rec) || changed;
      });

      if(changed) this.save();
    },

    upsertDelivery(rec){
      const arr = this.state.deliveries || (this.state.deliveries = []);
      const ref = String(rec.ref || rec.referencia || "").trim();
      if(!ref) return false;
      const idx = arr.findIndex(x => x && String(x.ref || x.referencia || "").trim() === ref);
      if(idx >= 0){
        const old = arr[idx] || {};
        const flow = { ...(old.flow || {}), ...(rec.flow || {}) };
        arr[idx] = { ...old, ...rec, flow };
      }else{
        arr.push(rec);
      }
      return true;
    },

    itemAlmacen(item){ const f = item.flow || {}; return n(f.almacen ?? f.alm ?? item.almacen ?? item.enAlmacen ?? 0); },
    itemEntregado(item){ const f = item.flow || {}; return n(f.entregado ?? item.delivered ?? item.entregado ?? 0); },
    visibleItems(){
      const q = norm(document.getElementById("q").value);
      const companyFilter = document.getElementById("companyFilter").value;
      return (this.state.deliveries || [])
        .filter(item => this.itemAlmacen(item) > 0)
        .filter(item => !companyFilter || String(item.company || item.empresa || item.empresaReceptora || "") === companyFilter)
        .filter(item => {
          if(!q) return true;
          const hay = [item.ref, item.referencia, item.concept, item.concepto, item.company, item.empresa, item.empresaReceptora].join(" ");
          return norm(hay).includes(q);
        });
    },

    render(){
      const items = this.visibleItems();
      const list = document.getElementById("list");
      const status = document.getElementById("status");
      const totalUnits = items.reduce((a,it)=>a+this.itemAlmacen(it),0);
      status.textContent = `${items.length} pedidos · ${totalUnits} uds en almacén`;

      if(!items.length){
        list.innerHTML = `<div class="empty">No hay pedidos actualmente en almacén.</div>`;
        return;
      }

      const groups = new Map();
      items.forEach(it=>{
        const c = String(it.company || it.empresa || it.empresaReceptora || "Sin empresa").trim() || "Sin empresa";
        if(!groups.has(c)) groups.set(c, []);
        groups.get(c).push(it);
      });

      list.innerHTML = Array.from(groups.entries())
        .sort((a,b)=>a[0].localeCompare(b[0],"es",{sensitivity:"base"}))
        .map(([company, arr]) => this.companyHTML(company, arr))
        .join("");
    },

    companyHTML(company, arr){
      const units = arr.reduce((a,it)=>a+this.itemAlmacen(it),0);
      const rows = arr
        .sort((a,b)=>String(a.ref||a.referencia||"").localeCompare(String(b.ref||b.referencia||""),"es",{sensitivity:"base"}))
        .map(it => this.rowHTML(it))
        .join("");
      return `
        <div class="company">
          <div class="company-head" onclick="const b=this.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none';">
            <span>▾</span>
            <span class="company-name">${esc(company)}</span>
            <span class="badge b-blue">${arr.length} pedidos</span>
            <span class="badge b-orange">${units} uds en almacén</span>
          </div>
          <div class="company-body">
            <table>
              <thead><tr><th>Referencia / concepto</th><th>Fechas</th><th>Flujo</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    },

    rowHTML(item){
      const idx = (this.state.deliveries || []).indexOf(item);
      const f = item.flow || {};
      const alm = this.itemAlmacen(item);
      const ent = this.itemEntregado(item);
      const fab = n(f.fab ?? f.fabricacion ?? 0);
      const pint = n(f.pintura ?? 0);
      const company = String(item.company || item.empresa || item.empresaReceptora || "Sin empresa");
      return `
        <tr>
          <td><div class="ref">${esc(item.ref || item.referencia || "")}</div><div class="concept">${esc(item.concept || item.concepto || "Sin concepto")}</div><div class="muted">${esc(company)}</div></td>
          <td><div class="muted">Pedido: ${esc(fmtDate(item.datePed || item.fechaPedido || ""))}</div><div class="muted">Prev.: ${esc(fmtDate(item.datePrev || item.fechaPrevista || ""))}</div></td>
          <td><div class="flow"><span class="badge b-blue">Fab: ${fab}</span><span class="badge b-orange">Pint: ${pint}</span><span class="badge b-green">Alm: ${alm}</span><span class="badge b-blue">Ent: ${ent}</span></div></td>
          <td><span class="badge b-green">En almacén</span><div class="muted">Total: ${esc(item.total || alm || 0)}</div></td>
          <td><div class="actions"><button class="btn small green" onclick="App.entregar(${idx})">📦 Entregar</button><button class="btn small orange" onclick="App.devolverFabricacion(${idx})">↩ Fabricación</button><button class="btn small" onclick="App.ver(${idx})">Ver</button></div></td>
        </tr>`;
    },

    askQty(title, max){
      const raw = prompt(`${title}\nCantidad máxima: ${max}`, String(max));
      if(raw === null) return null;
      const qty = n(raw);
      if(qty <= 0){ alert("Cantidad no válida."); return null; }
      if(qty > max){ alert("No puedes mover más unidades de las que hay en almacén."); return null; }
      return qty;
    },

    entregar(idx){
      const item = this.state.deliveries[idx];
      if(!item) return;
      const max = this.itemAlmacen(item);
      const qty = this.askQty("Cantidad a entregar", max);
      if(qty === null) return;

      item.flow = item.flow || {};
      item.flow.almacen = max - qty;
      item.flow.entregado = this.itemEntregado(item) + qty;
      item.delivered = item.flow.entregado;
      item.fase = item.flow.almacen > 0 ? "almacen" : "entregado";
      item.estado = item.fase;
      if(item.flow.almacen <= 0) item.status = "entregado";
      item.history = Array.isArray(item.history) ? item.history : [];
      item.history.push({ id:uid("hist"), type:"entrega", qty, date:new Date().toISOString(), note:"Entregado desde Almacén" });

      this.updatePrepMeta(item);
      this.save();
      this.render();
      this.toast("Entrega registrada");
    },

    devolverFabricacion(idx){
      const item = this.state.deliveries[idx];
      if(!item) return;
      const max = this.itemAlmacen(item);
      const qty = this.askQty("Cantidad a devolver a Fabricación", max);
      if(qty === null) return;

      item.flow = item.flow || {};
      item.flow.almacen = max - qty;
      item.flow.fab = n(item.flow.fab ?? item.flow.fabricacion ?? 0) + qty;
      item.flow.fabricacion = item.flow.fab;
      item.fase = "fabricacion";
      item.estado = "fabricacion";
      item.status = "pendiente";
      item.history = Array.isArray(item.history) ? item.history : [];
      item.history.push({ id:uid("hist"), type:"devolver_fabricacion", qty, date:new Date().toISOString(), note:"Devuelto desde Almacén" });

      this.updatePrepMeta(item);
      this.save();
      this.render();
      this.toast("Devuelto a Fabricación");
    },

    updatePrepMeta(item){
      const ref = String(item.ref || item.referencia || "").trim();
      if(!ref) return;
      const key = "prep_meta_" + ref;
      const meta = parse(getStore(key), {}) || {};
      const alm = this.itemAlmacen(item);
      const ent = this.itemEntregado(item);
      meta.empresa = item.company || item.empresa || item.empresaReceptora || meta.empresa;
      meta.concepto = item.concept || item.concepto || meta.concepto;
      meta.unidades = item.total || meta.unidades || 1;
      meta.lastUpdate = new Date().toISOString();

      delete meta.en_fabricacion;
      delete meta.fabricacion_ts;
      delete meta.en_pintura;
      delete meta.pintura_ts;

      if(alm > 0){
        meta.en_almacen = true;
        meta.almacen_ts = meta.almacen_ts || new Date().toISOString();
        meta.fase = "almacen";
        meta.estado = "almacen";
        delete meta.entregado;
        delete meta.en_entregado;
        delete meta.entregado_ts;
      }else if(ent > 0){
        meta.entregado = true;
        meta.en_entregado = true;
        meta.entregado_ts = new Date().toISOString();
        meta.fase = "entregado";
        meta.estado = "entregado";
        delete meta.en_almacen;
        delete meta.almacen_ts;
      }
      const v = JSON.stringify(meta);
      try{ localStorage.setItem(key, v); }catch(e){}
      try{ sessionStorage.setItem(key, v); }catch(e){}
    },

    ver(idx){
      const item = this.state.deliveries[idx];
      if(!item) return;
      const f = item.flow || {};
      alert(
        "Referencia: " + (item.ref || item.referencia || "") + "\n" +
        "Concepto: " + (item.concept || item.concepto || "") + "\n" +
        "Empresa: " + (item.company || item.empresa || item.empresaReceptora || "") + "\n\n" +
        "Fabricación: " + n(f.fab ?? f.fabricacion ?? 0) + "\n" +
        "Pintura: " + n(f.pintura ?? 0) + "\n" +
        "Almacén: " + this.itemAlmacen(item) + "\n" +
        "Entregado: " + this.itemEntregado(item)
      );
    },

    toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(()=>{ el.style.display = "none"; }, 2600);
    }
  };

  document.addEventListener("DOMContentLoaded", () => App.init());
})();
</script>
</body>
</html>
