<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fabricación · Gestión Taller</title>
  <style>
    :root{
      --bg:#08111f;--panel:#101b31;--panel2:#0b1324;--line:#263750;--text:#f8fafc;
      --muted:#93a4bb;--cyan:#22d3ee;--blue:#0ea5e9;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--violet:#7c3aed;
      --radius:16px;--shadow:0 16px 40px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,Arial,sans-serif}
    body{font-size:14px}
    .topbar{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#071020;border-bottom:1px solid var(--line)}
    .topbar strong{font-size:15px}.spacer{flex:1}
    .btn{border:1px solid rgba(34,211,238,.35);background:linear-gradient(180deg,rgba(14,165,233,.23),rgba(14,165,233,.11));color:#bff3ff;border-radius:10px;font-weight:800;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);font-size:13px}
    .btn:hover{filter:brightness(1.15)}.btn.small{padding:7px 10px;font-size:12px;border-radius:8px}
    .btn.green{border-color:rgba(16,185,129,.4);background:linear-gradient(180deg,rgba(16,185,129,.28),rgba(16,185,129,.12));color:#caffea}
    .btn.orange{border-color:rgba(245,158,11,.45);background:linear-gradient(180deg,rgba(245,158,11,.28),rgba(245,158,11,.12));color:#ffe7b0}
    .btn.red{border-color:rgba(239,68,68,.45);background:linear-gradient(180deg,rgba(239,68,68,.28),rgba(239,68,68,.12));color:#ffd1d1}
    .btn.violet{border-color:rgba(124,58,237,.45);background:linear-gradient(180deg,rgba(124,58,237,.28),rgba(124,58,237,.12));color:#ddd6fe}
    .wrap{padding:28px 18px 60px}
    .hero{width:min(650px,100%);border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(16,27,49,.98),rgba(12,22,40,.98));box-shadow:var(--shadow);padding:22px 24px;margin:0 0 28px}
    h1{margin:0;display:flex;align-items:center;gap:13px;font-size:28px;letter-spacing:-.03em}
    .head-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--cyan);border:1px solid rgba(34,211,238,.28);background:rgba(34,211,238,.08)}
    .hero p{margin:9px 0 0;color:#9bdcff;font-weight:600}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .search{flex:1;min-width:260px;background:#050b19;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    select,input,textarea{background:#050b19;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:700}
    .status{color:#9bdcff;font-weight:800;font-size:12px;border:1px solid rgba(34,211,238,.22);border-radius:999px;padding:8px 10px;background:rgba(34,211,238,.06)}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:0 0 18px}
    .kpi{border:1px solid var(--line);border-radius:14px;padding:13px;background:rgba(15,23,42,.55)}
    .kpi span{color:#93c5fd;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
    .kpi b{display:block;font-size:22px;margin-top:5px}
    .card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(16,27,49,.96),rgba(10,19,36,.96));box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
    .section-title{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
    details.company{border:1px solid rgba(148,163,184,.22);border-radius:14px;margin:14px 0;background:rgba(6,12,24,.42);overflow:hidden}
    details.company summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;background:rgba(15,23,42,.72);border-bottom:1px solid rgba(148,163,184,.18);cursor:pointer;user-select:none}
    details.company summary::-webkit-details-marker{display:none}
    .fold::before{content:"▸";display:inline-block;width:18px}
    details[open] .fold::before{content:"▾"}
    .company-name{font-size:16px;font-weight:900;letter-spacing:.02em}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}
    .b-blue{background:rgba(14,165,233,.18);color:#7dd3fc;border:1px solid rgba(14,165,233,.28)}
    .b-green{background:rgba(16,185,129,.18);color:#86efac;border:1px solid rgba(16,185,129,.28)}
    .b-orange{background:rgba(245,158,11,.18);color:#fed7aa;border:1px solid rgba(245,158,11,.3)}
    .b-red{background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(239,68,68,.3)}
    .b-violet{background:rgba(124,58,237,.18);color:#ddd6fe;border:1px solid rgba(124,58,237,.3)}
    table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid rgba(148,163,184,.15);vertical-align:middle;text-align:left}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#93c5fd;background:rgba(15,23,42,.5)}
    tr:hover td{background:rgba(34,211,238,.04)}
    .ref{font-weight:900;color:#fff}.concept{font-size:12px;color:#a7f3d0;margin-top:3px}.muted{color:var(--muted);font-size:12px}
    .flow{display:flex;gap:6px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .empty{text-align:center;color:var(--muted);padding:40px 14px;border:1px dashed rgba(148,163,184,.25);border-radius:14px;background:rgba(15,23,42,.35)}
    .toast{position:fixed;right:16px;bottom:16px;background:#042f2e;border:1px solid rgba(16,185,129,.45);color:#d1fae5;border-radius:12px;padding:12px 14px;font-weight:900;box-shadow:var(--shadow);display:none;z-index:50}
    @media(max-width:1000px){.summary{grid-template-columns:1fr 1fr}table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-bottom:1px solid rgba(148,163,184,.2);padding:10px}td{border:0;padding:6px 0}.actions{justify-content:flex-start}}
    @media(max-width:620px){.summary{grid-template-columns:1fr}.wrap{padding:18px 10px 40px}}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn" href="../index.html">← Menú</a>
    <strong>Fabricación</strong>
    <span class="spacer"></span>
    <a class="btn small" href="preparacion_pedidos.html">← Preparación</a>
    <a class="btn small" href="almacen.html">Almacén →</a>
    <button class="btn small" onclick="App.reload()">Actualizar</button><button class="btn small" onclick="window.LDH_fabricacionPublishNow && window.LDH_fabricacionPublishNow()">Publicar nube</button><button class="btn small" onclick="window.LDH_fabricacionRestoreCloudNow && window.LDH_fabricacionRestoreCloudNow()">Restaurar nube</button>
  </div>

  <main class="wrap">
    <section class="hero">
      <h1><span class="head-icon" aria-hidden="true">🏭</span>Agenda de Fabricación</h1>
      <p>Trabajos en fabricación y pintura. Grupos cerrados por defecto. <b>Build movimiento persistente · entrega sincronizada V3</b>.</p>
    </section>

    <div class="toolbar">
      <input id="q" class="search" placeholder="Buscar referencia, concepto o empresa..." oninput="App.render()">
      <select id="companyFilter" onchange="App.render()"><option value="">Todas las empresas</option></select>
      <select id="stageFilter" onchange="App.render()">
        <option value="">Fabricación y pintura</option>
        <option value="fab">Solo fabricación</option>
        <option value="pintura">Solo pintura</option>
        <option value="almacen">También almacén</option>
      </select>
      <span id="status" class="status">Cargando...</span><span id="cloudStatus" class="status">Nube: esperando...</span>
    </div>

    <section class="summary">
      <div class="kpi"><span>En fabricación</span><b id="kFab">0</b></div>
      <div class="kpi"><span>En pintura</span><b id="kPint">0</b></div>
      <div class="kpi"><span>En almacén</span><b id="kAlm">0</b></div>
      <div class="kpi"><span>Entregado</span><b id="kEnt">0</b></div>
    </section>

    <section class="card">
      <h2 class="section-title">📋 Trabajos activos</h2>
      <div id="list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

<script>
(function(){
  const DB_KEY = "ldh_db";
  const INBOX_KEY = "ldh_fabricacion_inbox_v1";
  const OVERRIDE_KEY = "ldh_fabricacion_flow_overrides_v1";

  function dbStoreInfo(raw){
    const info = {valid:false, jobs:0, updatedAt:0};
    if(raw === null || raw === undefined || raw === "") return info;
    try{
      const db = JSON.parse(raw);
      if(!db || typeof db !== "object" || Array.isArray(db)) return info;
      info.valid = true;
      info.jobs = ["deliveries","fabricacion","fab","trabajos"].reduce((sum, key)=>
        sum + (Array.isArray(db[key]) ? db[key].length : 0), 0
      );
      const stamp = Date.parse(db.updatedAt || db.lastUpdate || db.updatedAtISO || "");
      info.updatedAt = Number.isFinite(stamp) ? stamp : 0;
    }catch(e){}
    return info;
  }
  function chooseDbStore(localValue, sessionValue){
    const localInfo = dbStoreInfo(localValue);
    const sessionInfo = dbStoreInfo(sessionValue);

    if(!localInfo.valid && sessionInfo.valid) return sessionValue;
    if(localInfo.valid && !sessionInfo.valid) return localValue;
    if(!localInfo.valid && !sessionInfo.valid) return localValue ?? sessionValue;

    // Blindaje conservador: una copia local vacía o incompleta no puede tapar
    // una copia de sesión con trabajos, salvo que la copia vacía sea más reciente.
    if(localInfo.jobs === 0 && sessionInfo.jobs > 0){
      if(localInfo.updatedAt && localInfo.updatedAt >= sessionInfo.updatedAt) return localValue;
      return sessionValue;
    }
    return localValue;
  }
  function getStore(k){
    let localValue = null;
    let sessionValue = null;
    try{ localValue = localStorage.getItem(k); }catch(e){}
    try{ sessionValue = sessionStorage.getItem(k); }catch(e){}

    if(k === DB_KEY) return chooseDbStore(localValue, sessionValue);
    if(localValue !== null && localValue !== undefined) return localValue;
    if(sessionValue !== null && sessionValue !== undefined) return sessionValue;
    return null;
  }
  function setStore(k, v){
    try{
      localStorage.setItem(k, v);
      if(k === DB_KEY){ try{ sessionStorage.removeItem(k); }catch(e){} }
      return true;
    }catch(e1){
      try{ localStorage.removeItem(k); }catch(e){}
      try{ sessionStorage.setItem(k, v); return true; }catch(e2){ return false; }
    }
  }
  function parse(raw, fallback){ try{ return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
  function n(v){ const x = Number(String(v ?? 0).replace(",", ".")); return Number.isFinite(x) ? x : 0; }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
  function isCloudDeleted(refOrItem){
    const ref = String(refOrItem && typeof refOrItem === "object" ? (refOrItem.ref || refOrItem.referencia || "") : (refOrItem || "")).trim();
    try{ return !!(ref && window.LDH_isFabricacionDeletedRef && window.LDH_isFabricacionDeletedRef(ref)); }catch(e){ return false; }
  }
  function fmtDate(v){ if(!v) return ""; const s = String(v); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : s; }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function uid(p){ return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }

  window.App = {
    state:{ deliveries:[], fabricacion:[], fab:[], trabajos:[], deliveryCompanies:[] },
    openCompanies:new Set(),

    init(){
      this.load();
      this.mergeInbox();
      this.mergePrepMeta();
      this.save(false);
      this.loadCompanies();
      this.render();
      window.addEventListener("storage", ev=>{
        if(!ev || ev.key === DB_KEY || ev.key === INBOX_KEY || String(ev.key||"").startsWith("prep_meta_")) this.reload(false);
      });
      setInterval(()=>this.reload(false), 15000);
    },

    reload(show=true){
      this.load();
      this.mergeInbox();
      this.mergePrepMeta();
      // Una recarga automática solo recompone la vista local. No debe publicar
      // una copia antigua sobre un movimiento recién confirmado por Almacén.
      this.save(false, false);
      this.loadCompanies();
      this.render();
      if(show) this.toast("Fabricación actualizada");
    },

    load(){
      const db = parse(getStore(DB_KEY), {}) || {};
      this.state = db;
      ["deliveries","fabricacion","fab","trabajos","deliveryCompanies"].forEach(k=>{
        if(!Array.isArray(this.state[k])) this.state[k] = [];
      });
    },

    save(showError=true){
      this.state.updatedAt = new Date().toISOString();
      const ok = setStore(DB_KEY, JSON.stringify(this.state));
      if(!ok && showError) alert("No se pudo guardar Fabricación porque el almacenamiento del navegador está lleno.");
      return ok;
    },

    mergeInbox(){
      const inbox = parse(getStore(INBOX_KEY), []) || [];
      if(!Array.isArray(inbox) || !inbox.length) return;
      inbox.forEach(rec => this.upsertEveryPool(this.normalizeItem(rec)));
    },

    mergePrepMeta(){
      const keys = [];
      try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith("prep_meta_")) keys.push(k); } }catch(e){}
      try{ for(let i=0;i<sessionStorage.length;i++){ const k=sessionStorage.key(i); if(k && k.startsWith("prep_meta_") && !keys.includes(k)) keys.push(k); } }catch(e){}

      keys.forEach(k=>{
        const ref = k.replace(/^prep_meta_/,"").trim();
        const meta = parse(getStore(k), null);
        if(!ref || !meta) return;
        if(meta.deleted || meta.eliminado || meta.archived || meta.eliminado_modulos) return;
        // La fase/estado actual es autoritativa. Los *_ts son solo historico y
        // nunca deben resucitar un trabajo que ya avanzo a otra fase.
        const fase = norm(meta.fase || meta.estado || meta.status);
        const hasCurrentPhase = !!fase;
        const isEnt = hasCurrentPhase
          ? fase.includes("entreg")
          : !!(meta.entregado || meta.en_entregado);
        const enAlm = !isEnt && (hasCurrentPhase
          ? fase.includes("almacen")
          : !!meta.en_almacen);
        const enPint = !isEnt && !enAlm && (hasCurrentPhase
          ? fase.includes("pint")
          : !!meta.en_pintura);
        const enFab = !isEnt && !enAlm && !enPint && (hasCurrentPhase
          ? fase.includes("fabric")
          : !!meta.en_fabricacion);
        if((!enFab && !enPint && !enAlm) || isEnt) return;

        const units = Math.max(1, n(meta.unidades || meta.uds || meta.total || meta.cantidad || 1) || 1);
        const item = {
          id: meta.pedido_uid || meta.pedido_id || ("FAB-" + ref),
          agendaOrderId: String(meta.agenda_order_id || meta.orderId || "").trim(),
          orderId: String(meta.agenda_order_id || meta.orderId || "").trim(),
          ref,
          referencia: ref,
          concept: meta.concepto || meta.concept || "Sin concepto",
          concepto: meta.concepto || meta.concept || "Sin concepto",
          company: meta.empresa || meta.company || "",
          empresa: meta.empresa || meta.company || "",
          total: units,
          unidades: units,
          delivered: 0,
          status:"pendiente",
          estado: enPint ? "pintura" : (enAlm ? "almacen" : "fabricacion"),
          fase: enPint ? "pintura" : (enAlm ? "almacen" : "fabricacion"),
          tipo:"fabricacion",
          keepInFab:true,
          hideFromFab:false,
          archived:false,
          datePed: meta.fecha_pedido || meta.datePed || meta.createdAt || todayISO(),
          datePrev: meta.fecha_entrega || meta.datePrev || todayISO(),
          flow:{
            fab: enPint || enAlm ? 0 : units,
            fabricacion: enPint || enAlm ? 0 : units,
            pintura: enPint ? units : 0,
            almacen: enAlm ? units : 0,
            entregado: 0
          },
          unassignedBorrow: meta.unassignedBorrow || meta.unassigned_borrow || null,
          notes:"Importado desde Preparación"
        };

        const old = this.findByRef(ref);
        if(!old){
          this.upsertEveryPool(item);
        }
      });
    },

    overrides(){
      return parse(getStore(OVERRIDE_KEY), {}) || {};
    },

    saveOverrides(map){
      return setStore(OVERRIDE_KEY, JSON.stringify(map || {}));
    },

    applyOverride(item){
      if(!item || !item.ref) return item;
      const ref = String(item.ref).trim();
      const ov = this.overrides()[ref];
      if(!ov) return item;

      // Un borrado solo es válido mientras exista su documento en la subcolección deleted.
      // Si ese documento se elimina para recuperar un trabajo, se ignora el marcador local antiguo.
      if(ov.deleted && !isCloudDeleted(ref)) return item;
      if(ov.deleted){
        item.deleted = true;
        item.archived = true;
        item.fase = "eliminado";
        item.estado = "eliminado";
      }
      item.flow = {...(item.flow || {}), ...(ov.flow || {})};
      if(item.flow.fabricacion === undefined) item.flow.fabricacion = item.flow.fab;
      if(item.flow.fab === undefined) item.flow.fab = item.flow.fabricacion;
      ["fase","estado","status","keepInFab","hideFromFab","archived"].forEach(k=>{
        if(ov[k] !== undefined) item[k] = ov[k];
      });
      if(ov.updatedAt) item.localFlowUpdatedAt = ov.updatedAt;
      return item;
    },

    writeOverride(item){
      item = this.normalizeItem(item);
      const f = this.ensureFlow(item);
      const ref = String(item.ref || item.referencia || "").trim();
      if(!ref) return false;
      const map = this.overrides();
      map[ref] = {
        flow:{
          fab:n(f.fab),
          fabricacion:n(f.fab),
          pintura:n(f.pintura),
          almacen:n(f.almacen),
          entregado:n(f.entregado)
        },
        fase:item.fase,
        estado:item.estado,
        status:item.status,
        keepInFab:item.keepInFab,
        hideFromFab:item.hideFromFab,
        archived:item.archived,
        updatedAt:new Date().toISOString()
      };
      return this.saveOverrides(map);
    },

    updateInbox(item){
      try{
        const ref = String(item && (item.ref || item.referencia) || "").trim();
        if(!ref) return;
        let inbox = parse(getStore(INBOX_KEY), []) || [];
        if(!Array.isArray(inbox)) inbox = [];
        const idx = inbox.findIndex(x => String(x && (x.ref || x.referencia) || "").trim() === ref);
        const rec = this.normalizeItem(item);
        if(idx >= 0) inbox[idx] = rec; else inbox.push(rec);
        setStore(INBOX_KEY, JSON.stringify(inbox.slice(-200)));
      }catch(e){}
    },

    normalizeItem(item){
      item = item && typeof item === "object" ? {...item} : {};
      const ref = String(item.ref || item.referencia || "").trim();
      const total = Math.max(0, n(item.total || item.unidades || item.cantidad || item.uds || item.units || 0));
      item.ref = ref;
      item.referencia = ref;
      item.concept = item.concept || item.concepto || item.nombreConcepto || "Sin concepto";
      item.concepto = item.concepto || item.concept;
      item.company = item.company || item.empresa || item.empresaReceptora || "";
      item.empresa = item.empresa || item.company;
      item.total = total || Math.max(1, n(item.delivered || item.entregado || 1));
      item.unidades = item.total;
      item.flow = item.flow && typeof item.flow === "object" ? item.flow : {};
      this.ensureFlow(item);
      if(item.archived === undefined) item.archived = false;
      return item;
    },

    findByRef(ref){
      ref = String(ref||"").trim();
      const pools = ["deliveries","fabricacion","fab","trabajos"];
      for(const k of pools){
        const found = (this.state[k] || []).find(x => String(x && (x.ref || x.referencia) || "").trim() === ref);
        if(found) return this.applyOverride(this.normalizeItem(found));
      }
      return null;
    },

    upsertEveryPool(item){
      item = this.applyOverride(this.normalizeItem(item));
      if(!item.ref) return;
      ["deliveries","fabricacion","fab","trabajos"].forEach(k=>{
        if(!Array.isArray(this.state[k])) this.state[k] = [];
        const arr = this.state[k];
        const idx = arr.findIndex(x => String(x && (x.ref || x.referencia) || "").trim() === item.ref);
        if(idx >= 0){
          arr[idx] = this.mergeItem(arr[idx], item);
        }else{
          arr.push({...item});
        }
      });
    },

    mergeItem(old, incoming){
      old = old && typeof old === "object" ? old : {};
      incoming = incoming && typeof incoming === "object" ? incoming : {};
      const out = {...old, ...incoming};
      out.flow = {...(old.flow || {}), ...(incoming.flow || {})};
      return this.normalizeItem(out);
    },

    ensureFlow(item){
      const f = item.flow && typeof item.flow === "object" ? item.flow : (item.flow = {});
      const total = Math.max(0, n(item.total || item.unidades || item.cantidad || item.uds || 0));
      const entregado = n(f.entregado ?? item.delivered ?? item.entregado ?? 0);
      let fab = n(f.fab ?? f.fabricacion ?? item.fab ?? item.enFabricacion ?? 0);
      let pintura = n(f.pintura ?? f.paint ?? item.pintura ?? item.enPintura ?? 0);
      let almacen = n(f.almacen ?? f.alm ?? item.almacen ?? item.enAlmacen ?? 0);

      if(fab + pintura + almacen + entregado === 0 && total > 0 && !item.archived){
        const fase = norm(item.fase || item.estado || item.status || item.tipo);
        if(fase.includes("pint")) pintura = total;
        else if(fase.includes("almacen")) almacen = total;
        else if(fase.includes("entreg")) {}
        else fab = total;
      }

      f.fab = fab;
      f.fabricacion = fab;
      f.pintura = pintura;
      f.almacen = almacen;
      f.entregado = entregado;
      item.delivered = entregado;

      if(total > 0 && entregado >= total && fab <= 0 && pintura <= 0 && almacen <= 0){
        item.archived = true;
        item.fase = "entregado";
        item.estado = "entregado";
      }
      return f;
    },

    loadCompanies(){
      const names = new Set();
      const push = v => {
        const name = String(v && (v.name || v.nombre || v.company || v.empresa || v.id || v) || "").trim();
        if(name) names.add(name);
      };

      (this.state.deliveryCompanies || []).forEach(push);
      (this.state.deliveries || []).forEach(x => push(x.company || x.empresa));
      try{
        const master = parse(getStore("ldh_company_master_v1"), null);
        if(master && Array.isArray(master.companies)) master.companies.forEach(push);
      }catch(e){}

      const sel = document.getElementById("companyFilter");
      const current = sel.value;
      const arr = Array.from(names).sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
      sel.innerHTML = '<option value="">Todas las empresas</option>' + arr.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
      if(arr.includes(current)) sel.value = current;
    },

    counters(items){
      const all = (items || this.allItems()).filter(x=>!x.archived && !x.deleted && !isCloudDeleted(x));
      return all.reduce((a,it)=>{
        const f=this.ensureFlow(it);
        a.fab += n(f.fab);
        a.pintura += n(f.pintura);
        a.almacen += n(f.almacen);
        a.entregado += n(f.entregado);
        return a;
      },{fab:0,pintura:0,almacen:0,entregado:0});
    },

    allItems(){
      const map = new Map();
      ["deliveries","fabricacion","fab","trabajos"].forEach(k=>{
        (this.state[k] || []).forEach(raw=>{
          const it = this.normalizeItem(raw);
          if(!it.ref) return;
          const old = map.get(it.ref);
          map.set(it.ref, old ? this.mergeItem(old,it) : it);
        });
      });
      return Array.from(map.values()).map(it => this.applyOverride(this.normalizeItem(it)));
    },

    visibleItems(){
      const q = norm(document.getElementById("q").value);
      const companyFilter = document.getElementById("companyFilter").value;
      const stage = document.getElementById("stageFilter").value;
      return this.allItems()
        .filter(it=>!it.archived && !it.deleted && !isCloudDeleted(it))
        .filter(it=>{
          const f=this.ensureFlow(it);
          if(stage === "fab") return n(f.fab) > 0;
          if(stage === "pintura") return n(f.pintura) > 0;
          if(stage === "almacen") return n(f.fab)+n(f.pintura)+n(f.almacen) > 0;

          // La vista principal es solo Fabricación y Pintura. Un pedido que ya
          // está íntegramente en Almacén o Entregado no puede reaparecer por un
          // keepInFab antiguo. hideFromFab es autoritativo cuando ya no quedan
          // unidades en Fabricación/Pintura.
          const activeWorkshop = n(f.fab) + n(f.pintura);
          if(!!it.hideFromFab && activeWorkshop <= 0) return false;
          return activeWorkshop > 0;
        })
        .filter(it => !companyFilter || String(it.company || it.empresa || "") === companyFilter)
        .filter(it => {
          if(!q) return true;
          const hay = [it.ref,it.referencia,it.concept,it.concepto,it.company,it.empresa,it.notes].join(" ");
          return norm(hay).includes(q);
        });
    },

    render(){
      const items = this.visibleItems();
      const all = this.allItems();
      const totals = this.counters(all);
      document.getElementById("kFab").textContent = totals.fab;
      document.getElementById("kPint").textContent = totals.pintura;
      document.getElementById("kAlm").textContent = totals.almacen;
      document.getElementById("kEnt").textContent = totals.entregado;
      document.getElementById("status").textContent = `${items.length} trabajos visibles`;

      const list = document.getElementById("list");
      list.querySelectorAll("details.company[data-company]").forEach(detail=>{
        const company = String(detail.dataset.company || "");
        if(!company) return;
        if(detail.open) this.openCompanies.add(company);
        else this.openCompanies.delete(company);
      });
      if(!items.length){
        list.innerHTML = `<div class="empty">No hay trabajos activos en Fabricación.</div>`;
        return;
      }

      const groups = new Map();
      items.forEach(it=>{
        const c = String(it.company || it.empresa || "Sin empresa").trim() || "Sin empresa";
        if(!groups.has(c)) groups.set(c, []);
        groups.get(c).push(it);
      });

      list.innerHTML = Array.from(groups.entries())
        .sort((a,b)=>a[0].localeCompare(b[0],"es",{sensitivity:"base"}))
        .map(([company, arr]) => this.companyHTML(company, arr))
        .join("");

      list.querySelectorAll("details.company[data-company]").forEach(detail=>{
        detail.addEventListener("toggle",()=>{
          const company = String(detail.dataset.company || "");
          if(!company) return;
          if(detail.open) this.openCompanies.add(company);
          else this.openCompanies.delete(company);
        });
      });
    },

    companyHTML(company, arr){
      const totals = this.counters(arr);
      const rows = arr
        .sort((a,b)=>String(a.ref||"").localeCompare(String(b.ref||""),"es",{sensitivity:"base"}))
        .map(it=>this.rowHTML(it))
        .join("");
      return `
        <details class="company" data-company="${esc(company)}"${this.openCompanies.has(company) ? " open" : ""}>
          <summary>
            <span class="fold"></span>
            <span class="company-name">${esc(company)}</span>
            <span class="badge b-orange">Fab: ${totals.fab}</span>
            <span class="badge b-violet">Pint: ${totals.pintura}</span>
            <span class="badge b-green">Alm: ${totals.almacen}</span>
            <span class="badge b-blue">Ent: ${totals.entregado}</span>
          </summary>
          <div class="company-body">
            <table>
              <thead><tr><th>Referencia / concepto</th><th>Fechas</th><th>Flujo</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </details>`;
    },

    rowHTML(item){
      const f = this.ensureFlow(item);
      const ua = this.unassignedSummary(item);
      const estado = n(f.pintura)>0 ? "En pintura" : (n(f.fab)>0 ? "En fabricación" : (n(f.almacen)>0 ? "En almacén" : "Sin fase activa"));
      const uaPill = ua.lines ? `<span class="badge b-red">No asignado: ${ua.lines}</span>` : "";
      const refEnc = encodeURIComponent(item.ref || item.referencia || "");
      return `
        <tr>
          <td>
            <div class="ref">${esc(item.ref || item.referencia || "")}</div>
            <div class="concept">${esc(item.concept || item.concepto || "Sin concepto")}</div>
            <div class="muted">${esc(item.company || item.empresa || "Sin empresa")} ${uaPill}</div>
          </td>
          <td>
            <div class="muted">Pedido: ${esc(fmtDate(item.datePed || item.fechaPedido || ""))}</div>
            <div class="muted">Prev.: ${esc(fmtDate(item.datePrev || item.fechaPrevista || ""))}</div>
          </td>
          <td>
            <div class="flow">
              <span class="badge b-orange">Fab: ${n(f.fab)}</span>
              <span class="badge b-violet">Pint: ${n(f.pintura)}</span>
              <span class="badge b-green">Alm: ${n(f.almacen)}</span>
              <span class="badge b-blue">Ent: ${n(f.entregado)}</span>
            </div>
          </td>
          <td>
            <span class="badge b-blue">${esc(estado)}</span>
            <div class="muted">Total: ${esc(item.total || 0)}</div>
          </td>
          <td>
            <div class="actions">
              <button class="btn small violet" onclick="App.move('${refEnc}', 'fab', 'pintura')">🎨 A pintura</button>
              <button class="btn small" onclick="App.move('${refEnc}', 'pintura', 'fab')">↩ Fab</button>
              <button class="btn small green" onclick="App.move('${refEnc}', 'pintura', 'almacen')">🏬 A almacén</button>
              <button class="btn small" onclick="App.openPrep('${refEnc}')">Preparación</button>
              <button class="btn small orange" onclick="App.ver('${refEnc}')">Ver</button>
              <button class="btn small red" onclick="App.eliminarPedidoRef('${refEnc}')">🗑 Eliminar</button>
            </div>
          </td>
        </tr>`;
    },

    itemByRef(refEnc){
      const ref = decodeURIComponent(refEnc || "");
      const item = this.allItems().find(x => String(x && (x.ref || x.referencia) || "").trim() === ref);
      return item ? this.applyOverride(this.normalizeItem(item)) : null;
    },

    askQty(label, max){
      max = n(max);
      if(max <= 0){ alert("No hay unidades disponibles para mover."); return null; }
      const raw = prompt(`${label}\nMáximo: ${max}\nCantidad:`, String(max));
      if(raw === null) return null;
      const qty = n(raw);
      if(qty <= 0){ alert("Cantidad no válida."); return null; }
      if(qty > max){ alert("No puedes mover más unidades de las disponibles."); return null; }
      return qty;
    },

    move(refEnc, from, to){
      const item = this.itemByRef(refEnc);
      if(!item){
        alert("No encuentro el trabajo para mover.");
        return;
      }

      const f = this.ensureFlow(item);
      const max = n(from === "fab" ? (f.fab ?? f.fabricacion) : f[from]);
      const labels = {fab:"Fabricación", pintura:"Pintura", almacen:"Almacén", entregado:"Entregado"};
      const qty = this.askQty(`${labels[from] || from} → ${labels[to] || to}`, max);
      if(qty === null) return;

      if(from === "fab"){
        f.fab = Math.max(0, n(f.fab ?? f.fabricacion) - qty);
        f.fabricacion = f.fab;
      }else{
        f[from] = Math.max(0, n(f[from]) - qty);
      }

      if(to === "fab"){
        f.fab = n(f.fab ?? f.fabricacion) + qty;
        f.fabricacion = f.fab;
      }else{
        f[to] = n(f[to]) + qty;
      }

      item.flow = f;
      item.fase = to === "almacen" ? "almacen" : (to === "pintura" ? "pintura" : "fabricacion");
      item.estado = item.fase;
      item.status = "pendiente";
      item.archived = false;
      item.keepInFab = true;
      if(to === "almacen" && n(f.fab) <= 0 && n(f.pintura) <= 0 && n(f.almacen) > 0) item.hideFromFab = true;
      if(to === "pintura" || to === "fab") item.hideFromFab = false;

      item.history = Array.isArray(item.history) ? item.history : [];
      item.history.push({id:uid("hist"), type:`move_${from}_to_${to}`, qty, date:new Date().toISOString(), note:`${labels[from]||from} → ${labels[to]||to}`});

      this.writeOverride(item);
      this.upsertEveryPool(item);
      this.updateInbox(item);
      this.updatePrepMeta(item);
      this.save(false);
      this.syncWorkflow(item,`fabricacion_${from}_a_${to}`,`${labels[from]||from} → ${labels[to]||to}: ${qty}`);
      this.render();
      this.toast("Movimiento guardado");
    },

    syncWorkflow(item,source,note,preserveState=false){
      try{
        if(!item || !window.LDH_WorkflowV2) return Promise.resolve(false);
        const f=this.ensureFlow(item);
        const flow={fabricacion:n(f.fab??f.fabricacion),pintura:n(f.pintura),almacen:n(f.almacen),entregado:n(f.entregado)};
        const state=flow.fabricacion>0?'fabrication':flow.pintura>0?'painting':(flow.almacen>0||flow.entregado>0)?'finished':'';
        return window.LDH_WorkflowV2.update({
          orderId:item.agendaOrderId||item.orderId||'',
          reference:item.ref||item.referencia||'',
          state,
          flow,
          preserveState:!!preserveState,
          source:source||'fabricacion',
          note:note||''
        }).catch(error=>{ console.warn('Workflow Fabricación',error); return false; });
      }catch(error){ console.warn('Workflow Fabricación',error); return Promise.resolve(false); }
    },

    async syncAllWorkflow(source='fabricacion_reconciliacion'){
      try{
        if(!window.LDH_WorkflowV2) return false;
        const items=this.allItems().filter(item=>{
          if(!item || item.deleted || item.archived) return false;
          const ref=String(item.ref||item.referencia||'').trim();
          if(!ref) return false;
          const f=this.ensureFlow(item);
          return n(f.fab??f.fabricacion)+n(f.pintura)+n(f.almacen)+n(f.entregado)>0;
        });
        for(const item of items){
          // La reconciliación de apertura solo actualiza las cantidades por fase.
          // Nunca debe cambiar el estado general elegido manualmente en Agenda.
          await this.syncWorkflow(item,source,'Sincronización de cantidades existentes por fase',true);
        }
        return true;
      }catch(error){
        console.warn('Workflow Fabricación reconciliación',error);
        return false;
      }
    },

    unassignedSummary(item){
      const ub = item && (item.unassignedBorrow || item.unassigned_borrow || item.noAsignado || item.materialNoAsignado);
      const items = ub && Array.isArray(ub.items) ? ub.items : [];
      const active = items.filter(x => n(x.qtyPending ?? x.pending ?? x.qty ?? x.cantidad) > 0);
      return {lines: active.length, qty: active.reduce((a,x)=>a+n(x.qtyPending ?? x.pending ?? x.qty ?? x.cantidad),0)};
    },

    updatePrepMeta(item){
      const ref = String(item.ref || item.referencia || "").trim();
      if(!ref) return;
      const key = "prep_meta_" + ref;
      const meta = parse(getStore(key), {}) || {};
      const f = this.ensureFlow(item);
      meta.empresa = item.company || item.empresa || meta.empresa;
      meta.company = item.company || item.empresa || meta.company;
      meta.concepto = item.concept || item.concepto || meta.concepto;
      meta.unidades = item.total || meta.unidades || 1;
      meta.uds = meta.unidades;
      meta.total = item.total || meta.total || meta.unidades;
      meta.en_fabricacion = n(f.fab) > 0 || n(f.pintura) > 0;
      meta.en_pintura = n(f.pintura) > 0;
      meta.en_almacen = n(f.almacen) > 0;
      meta.entregado = n(f.entregado) >= n(item.total) && n(item.total) > 0;
      if(meta.en_almacen){ meta.almacen_ts = meta.almacen_ts || new Date().toISOString(); }
      if(meta.en_pintura){ meta.pintura_ts = meta.pintura_ts || new Date().toISOString(); }
      if(meta.en_fabricacion){ meta.fabricacion_ts = meta.fabricacion_ts || new Date().toISOString(); }
      meta.fase = meta.en_almacen ? "almacen" : (meta.en_pintura ? "pintura" : (meta.en_fabricacion ? "fabricacion" : (meta.entregado ? "entregado" : "pendiente")));
      meta.estado = meta.fase;
      meta.lastUpdate = new Date().toISOString();
      const v = JSON.stringify(meta);
      try{ localStorage.setItem(key, v); }catch(e){}
      try{ sessionStorage.setItem(key, v); }catch(e){}
    },

    purgeDeletedRefs(refs){
      const deletedRefs = new Set(
        (Array.isArray(refs) ? refs : [refs])
          .map(ref=>String(ref || "").trim())
          .filter(Boolean)
      );
      if(!deletedRefs.size) return 0;

      ["deliveries","fabricacion","fab","trabajos"].forEach(k=>{
        if(Array.isArray(this.state[k])){
          this.state[k] = this.state[k].filter(item=>
            !deletedRefs.has(String(item && (item.ref || item.referencia) || "").trim())
          );
        }
      });

      const map = this.overrides();
      const deletedAt = new Date().toISOString();
      deletedRefs.forEach(ref=>{
        map[ref] = {
          ...(map[ref] || {}),
          deleted:true,
          archived:true,
          flow:{fab:0,fabricacion:0,pintura:0,almacen:0,entregado:0},
          fase:"eliminado",
          estado:"eliminado",
          updatedAt:deletedAt
        };
        this.markPrepDeleted(ref);
      });
      this.saveOverrides(map);

      let inbox = parse(getStore(INBOX_KEY), []) || [];
      if(Array.isArray(inbox)){
        inbox = inbox.filter(item=>
          !deletedRefs.has(String(item && (item.ref || item.referencia) || "").trim())
        );
        setStore(INBOX_KEY, JSON.stringify(inbox));
      }

      this.save(false);
      this.render();
      return deletedRefs.size;
    },

    async eliminarPedidoRef(refEnc){
      const ref = decodeURIComponent(refEnc || "");
      if(!ref){
        alert("No se encuentra la referencia del pedido.");
        return;
      }
      const ok = confirm("¿Eliminar definitivamente este pedido de Fabricación?\n\nReferencia: " + ref + "\n\nSe eliminará de Fabricación y no volverá a importarse desde Preparación.");
      if(!ok) return;

      if(typeof window.LDH_fabricacionDeleteRef !== "function"){
        alert("La sincronización todavía no está preparada. Espera a que aparezca “Nube conectada” y vuelve a intentarlo para que el pedido no reaparezca.");
        return;
      }

      try{
        await window.LDH_fabricacionDeleteRef(ref);
        this.toast("Pedido eliminado definitivamente");
      }catch(error){
        console.error("No se pudo eliminar el pedido en la nube", error);
        alert("No se ha eliminado el pedido. Comprueba que aparezca “Nube conectada” y vuelve a intentarlo.");
      }
    },

    markPrepDeleted(ref){
      if(!ref) return;
      const key = "prep_meta_" + ref;
      const meta = parse(getStore(key), {}) || {};
      meta.deleted = true;
      meta.eliminado = true;
      meta.eliminado_modulos = true;
      meta.fase = "eliminado";
      meta.estado = "eliminado";
      meta.lastUpdate = new Date().toISOString();
      delete meta.en_fabricacion;
      delete meta.fabricacion_ts;
      delete meta.en_pintura;
      delete meta.pintura_ts;
      delete meta.en_almacen;
      delete meta.almacen_ts;
      delete meta.entregado;
      delete meta.en_entregado;
      delete meta.entregado_ts;
      const raw = JSON.stringify(meta);
      try{ localStorage.setItem(key, raw); }catch(e){}
      try{ sessionStorage.setItem(key, raw); }catch(e){}
    },

    openPrep(refEnc){
      const ref = decodeURIComponent(refEnc || "");
      try{ localStorage.setItem("prep_focus_ref", ref); }catch(e){}
      location.href = "preparacion_pedidos.html?openRef=" + encodeURIComponent(ref);
    },

    ver(refEnc){
      const item = this.itemByRef(refEnc);
      if(!item) return;
      const f = this.ensureFlow(item);
      alert(
        "Referencia: " + (item.ref || "") + "\n" +
        "Concepto: " + (item.concept || item.concepto || "") + "\n" +
        "Empresa: " + (item.company || item.empresa || "") + "\n\n" +
        "Fabricación: " + n(f.fab) + "\n" +
        "Pintura: " + n(f.pintura) + "\n" +
        "Almacén: " + n(f.almacen) + "\n" +
        "Entregado: " + n(f.entregado)
      );
    },

    toast(msg){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(()=>{ el.style.display="none"; }, 2500);
    }
  };

  document.addEventListener("DOMContentLoaded", () => App.init());
})();
</script>

<script type="module" id="LDH_FABRICACION_FIRESTORE_SYNC_2107">
(async function(){
try{
  const initialCloudEl = document.getElementById("cloudStatus");
  if(initialCloudEl){
    initialCloudEl.textContent = "Nube: conectando...";
    initialCloudEl.classList.remove("ok","bad");
    initialCloudEl.classList.add("warn");
  }
const firebaseConfig = {
  apiKey: "AIzaSyDXKRAam6e8dlHFajtzMNueIo2hUMW-Gkg",
  authDomain: "gestion-taller-v2.firebaseapp.com",
  projectId: "gestion-taller-v2",
  storageBucket: "gestion-taller-v2.firebasestorage.app",
  messagingSenderId: "888590823508",
  appId: "1:888590823508:web:6dfd420a3e7ac17d647dc1"
};

const {initializeApp,getApps} = await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js");
const {getFirestore,collection,doc,getDoc,getDocs,setDoc,onSnapshot,serverTimestamp} = await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js");

// V4: este proyecto ya no depende de Auth anonimo. La Informativa lee este
// mismo documento sin login; Fabricacion usa el mismo acceso directo y deja
// de quedarse bloqueada esperando una sesion anonima que ya no existe.
const apps = getApps();
let app = apps.find(candidate => candidate.options && candidate.options.projectId === firebaseConfig.projectId);
if(!app){
  const defaultApp = apps.find(candidate => candidate.name === '[DEFAULT]');
  app = defaultApp ? initializeApp(firebaseConfig, 'ldh-fabricacion-cloud-v4') : initializeApp(firebaseConfig);
}
const db = getFirestore(app);

const DOC_REF = doc(db, "taller_data", "fabricacion");
const DELETED_COL = collection(db, "taller_data", "fabricacion", "deleted");
const DB_KEY = "ldh_db";
const INBOX_KEY = "ldh_fabricacion_inbox_v1";
const OVERRIDE_KEY = "ldh_fabricacion_flow_overrides_v1";

let authReady = false;
let ignorePublish = false;
let publishTimer = null;
let lastRemoteUpdated = "";
const deletedRefs = new Set();
window.LDH_isFabricacionDeletedRef = ref => deletedRefs.has(String(ref || "").trim());
let deleteSyncReady = false;
let deletedListenerStarted = false;

function status(txt, cls){
  const el = document.getElementById("cloudStatus");
  if(!el) return;
  el.textContent = txt;
  el.classList.remove("ok","warn","bad");
  if(cls) el.classList.add(cls);
}
function parse(raw, fb){ try{ return raw ? JSON.parse(raw) : fb; }catch(e){ return fb; } }
function dbStoreInfo(raw){
  const info = {valid:false, jobs:0, updatedAt:0};
  if(raw === null || raw === undefined || raw === "") return info;
  try{
    const db = JSON.parse(raw);
    if(!db || typeof db !== "object" || Array.isArray(db)) return info;
    info.valid = true;
    info.jobs = ["deliveries","fabricacion","fab","trabajos"].reduce((sum, key)=>
      sum + (Array.isArray(db[key]) ? db[key].length : 0), 0
    );
    const stamp = Date.parse(db.updatedAt || db.lastUpdate || db.updatedAtISO || "");
    info.updatedAt = Number.isFinite(stamp) ? stamp : 0;
  }catch(e){}
  return info;
}
function chooseDbStore(localValue, sessionValue){
  const localInfo = dbStoreInfo(localValue);
  const sessionInfo = dbStoreInfo(sessionValue);

  if(!localInfo.valid && sessionInfo.valid) return sessionValue;
  if(localInfo.valid && !sessionInfo.valid) return localValue;
  if(!localInfo.valid && !sessionInfo.valid) return localValue ?? sessionValue ?? "";

  if(localInfo.jobs === 0 && sessionInfo.jobs > 0){
    if(localInfo.updatedAt && localInfo.updatedAt >= sessionInfo.updatedAt) return localValue;
    return sessionValue;
  }
  return localValue;
}
function getStore(k){
  let localValue = null;
  let sessionValue = null;
  try{ localValue = localStorage.getItem(k); }catch(e){}

      // una entrega o reapertura recién publicada con la copia anterior de Fabricación.
      const snap = await getDoc(DOC_REF);
      if(snap.exists()){
        const remote = withoutDeletedRefs(snap.data() || {});
