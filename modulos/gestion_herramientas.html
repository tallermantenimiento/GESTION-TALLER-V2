<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gestión de Herramientas y Maquinaria</title>
<style>
  :root{--bg:#0b1220;--card:#111b2e;--card2:#0f172a;--txt:#e5e7eb;--mut:#94a3b8;--pri:#22c55e;--warn:#f59e0b;--dang:#ef4444;--line:#26324a;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(1200px 800px at 20% 0%,#142040 0%,var(--bg) 55%);color:var(--txt)}
  header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:14px 16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* === CSS GENERAL === */
  .icon-img {width: 48px; height: 48px; object-fit: contain; vertical-align: middle;}
  .emojiBtn .icon-img {width: 32px; height: 32px;}

  /* Upload & Slider Styles */
  .drop-zone {border: 2px dashed var(--line); background: rgba(15,23,42,0.5); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; color: var(--mut); margin-bottom: 10px;}
  .drop-zone:hover, .drop-zone.dragover {border-color: var(--pri); background: rgba(34,197,94,0.1); color: var(--txt);}
  .slider-container {background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--line);}
  input[type=range] {width: 100%; cursor: pointer; accent-color: var(--pri);}

  /* === DRAG AND DROP STYLES === */
  .tool[draggable="true"] {cursor: grab;}
  .tool[draggable="true"]:active {cursor: grabbing;}
  .tool.dragging {opacity: 0.4; border: 2px dashed var(--mut); background: rgba(0,0,0,0.2);}
  .tool.drag-over {border: 2px solid var(--pri); transform: scale(1.02); box-shadow: 0 0 15px rgba(34,197,94,0.2); z-index: 10;}

  .fam-wrap[draggable="true"] .fam-head { cursor: grab; }
  .fam-wrap[draggable="true"] .fam-head:active { cursor: grabbing; }
  .fam-wrap.dragging { opacity: 0.3; }
  .fam-wrap.drag-over { border: 2px dashed var(--pri) !important; background: rgba(34,197,94,0.05) !important; }

  /* === CATALOG MANAGER STYLES === */
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px;
    margin: 15px 0 8px 0; font-size: 13px; font-weight: 700; color: #f8fafc;
    border: 1px solid transparent; transition: 0.2s;
  }
  .cat-header.drag-target { border-color: var(--pri); background: rgba(34,197,94,0.15); }

  .cat-actions { display:flex; gap:5px; opacity:0.6; transition:0.2s; }
  .cat-header:hover .cat-actions { opacity:1; }
  .icon-btn { padding:4px; background:transparent; border:none; color:var(--mut); cursor:pointer; border-radius:4px; }
  .icon-btn:hover { background:rgba(255,255,255,0.1); color:var(--txt); }
  .icon-btn.del:hover { background:rgba(239,68,68,0.2); color:#fca5a5; }

  .emojiBtn[draggable="true"] { cursor: grab; }
  .emojiBtn.dragging-icon { opacity: 0.3; transform: scale(0.8); }
  .emojiBtn.drag-over-icon { transform: scale(1.1); border-color: var(--pri); background: rgba(34,197,94,0.2); }

  h1{font-size:16px;margin:0;color:#f1f5f9;letter-spacing:.2px; display: flex; align-items: center; gap: 8px;}
  .btn{border:1px solid var(--line);background:linear-gradient(180deg,#16233f,#0f172a);color:var(--txt);padding:9px 11px;border-radius:10px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.primary{border-color:rgba(34,197,94,.35);box-shadow:0 0 0 1px rgba(34,197,94,.15) inset}
  .btn.danger{border-color:rgba(239,68,68,.35);box-shadow:0 0 0 1px rgba(239,68,68,.15) inset}
  .btn.ghost{background:transparent}
  .spacer{flex:1}
  .pill{font-size:12px;color:var(--mut);border:1px solid var(--line);padding:6px 10px;border-radius:999px;background:rgba(15,23,42,.7)}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,rgba(17,27,46,.95),rgba(15,23,42,.95));border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .card h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);color:#f8fafc;letter-spacing:.2px}
  .card .content{padding:12px 14px}
  .tools{display:block;}

  .tool{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#101a32,#0b1220);padding:10px;cursor:pointer; transition: transform 0.2s, border-color 0.2s; margin-bottom: 8px;}
  .tool.selected{outline:2px solid rgba(34,197,94,.55);box-shadow:0 0 0 2px rgba(34,197,94,.15)}
  .tool .name{font-weight:650;margin:0 0 6px 0;font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .tool .name svg{display:block;}
  .tool .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12px}

  .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:rgba(2,6,23,.35)}
  .badge.ok{border-color:rgba(34,197,94,.35)}
  .badge.maint{border-color:rgba(245,158,11,.45); color:#fbbf24; background:rgba(245,158,11,.1)}
  .bar{height:7px;border-radius:999px;background:#0b1326;border:1px solid var(--line);overflow:hidden;margin-top:8px}
  .bar > div, .bar > i{height:100%;display:block;background:linear-gradient(90deg,#22c55e,#16a34a)}
  .bar.low > div, .bar.low > i{background:linear-gradient(90deg,#f59e0b,#d97706)}
  .bar.crit > div, .bar.crit > i{background:linear-gradient(90deg,#ef4444,#b91c1c)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .small{font-size:12px;color:var(--mut)}
  .desktop-only-menu-btn{display:block}
  @media (hover: none) and (pointer: coarse){
    .desktop-only-menu-btn{display:none !important}
  }

  .loan{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#101a32,#0b1220);padding:10px;margin-bottom:10px}
  .loan .top{display:flex;gap:10px;align-items:flex-start}
  .loan .top .sp{flex:1}
  .loan .title{margin:0;font-weight:700;font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .loan .sub{margin:2px 0 0 0;color:var(--mut);font-size:12px}
  .loan.warn{border-color:rgba(245,158,11,.55)}
  .loan.dang{border-color:rgba(239,68,68,.6)}

  #floating{position:fixed;left:16px;top:auto;right:auto;bottom:16px;z-index:30;display:none}
  #floating .inner{max-width:1180px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.4);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #floating input{background:#0b1326;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);min-width:220px}

  #floating.dragging { user-select:none; }
  #fbDragHandle{display:inline-flex;align-items:center;gap:6px;cursor:move;user-select:none}
  #fbDragHandle:hover{filter:brightness(1.08)}
  #fbDragHandle .grip{font-size:14px;color:var(--mut)}

  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
  .modal.aux{z-index:60;} 
  .modal.show{display:flex}
  .modal .panel{width:min(860px,92vw);max-height:86vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#101a32,#0b1220);box-shadow:0 22px 60px rgba(0,0,0,.55)}
  .modal .head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .modal .head h3{margin:0;font-size:14px}
  .modal .body{padding:12px 14px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:820px){.form{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px}
  input,select,textarea{width:100%;background:#0b1326;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--txt);outline:none}
  textarea{min-height:80px;resize:vertical}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line)}

  table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:14px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}
  th{color:#e2e8f0;text-align:left;background:rgba(2,6,23,.35)}
  tr:last-child td{border-bottom:none}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace}

  .emojiGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:50vh;overflow:auto;padding:6px}
  .emojiBtn{font-size:26px;padding:8px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer; transition: transform 0.1s; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .emojiBtn:active{transform:scale(0.9)}
  .emojiBtn:hover{background:rgba(255,255,255,.12)}

  .check{display:flex; align-items:center; gap:8px; padding:6px; border-radius:6px; cursor:pointer;}
  .check:hover{background:rgba(255,255,255,0.05)}
  .check input{width:auto;}
  .maint-stat{display:flex; gap:12px; margin-bottom:12px; padding:10px; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); border-radius:10px; color:#fbbf24; font-size:13px;}

  .audit-note{padding:10px 12px;border:1px solid rgba(56,189,248,.28);background:rgba(14,116,144,.12);border-radius:10px;color:#cdeffc;font-size:12px;margin:10px 0}
  .repair-case{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.06);border-radius:12px;padding:10px;margin-top:8px}
  .repair-case.closed{border-color:rgba(100,116,139,.28);background:rgba(51,65,85,.12)}
  .repair-case .case-title{font-weight:800;margin-bottom:4px}
  .kpi-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi-card{border:1px solid var(--line);background:rgba(15,23,42,.78);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--txt)}
  .kpi-card b{display:block;font-size:24px;line-height:1;margin-top:4px}.kpi-card small{color:var(--mut);font-size:11px}
  .kpi-card.active{outline:2px solid rgba(34,197,94,.45)}
  @media(max-width:900px){.kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* ===== MODO TABLET / TACTIL (NO AFECTA A PC) ===== */
  @media (hover: none) and (pointer: coarse) {
    body { -webkit-tap-highlight-color: transparent; }
    header .wrap, main, .wrap { padding-left: 12px; padding-right: 12px; }
    .btn,
    input,
    select,
    textarea {
      min-height: 46px;
      font-size: 16px;
    }
    .icon-btn {
      min-width: 38px;
      min-height: 38px;
    }
    .pill {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }
    .row {
      gap: 12px;
    }
    header .row {
      align-items: stretch;
    }
    header .btn {
      flex: 0 0 auto;
    }
    .tool {
      padding: 12px;
      margin-bottom: 10px;
    }
    .tool .row:last-child,
    .loan .top {
      flex-wrap: wrap;
    }
    .tool .row:last-child .btn,
    .loan .top .btn {
      flex: 1 1 140px;
      min-height: 44px;
    }
    .tool .ico,
    .loan .title img,
    .loan .title svg {
      pointer-events: none;
    }
    #floating .inner {
      width: min(96vw, 760px);
      padding: 12px;
    }
    #floating input {
      min-width: 100%;
      flex: 1 1 100%;
    }
    #floating .btn {
      flex: 1 1 160px;
    }
    #fbDragHandle {
      cursor: default;
    }
    .modal .panel {
      width: min(96vw, 860px);
      max-height: 90vh;
    }
    .modal .foot {
      flex-wrap: wrap;
    }
    .modal .foot .btn {
      flex: 1 1 140px;
    }
    th, td {
      font-size: 13px;
    }
    .cat-actions {
      opacity: 1;
    }
  }

  @media (max-width: 900px) and (hover: none) and (pointer: coarse) {
    .tool .row:first-child {
      align-items: flex-start;
    }
    .tool .row:first-child > div:last-child {
      width: 100%;
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .loan .top > div:last-child {
      width: 100%;
    }
    .emojiGrid {
      grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    }
  }
</style>

<script type="module" src="cloud_sync.js"></script>

<body>
<div class="desktop-only-menu-btn" style="position:sticky;top:0;z-index:50;padding:10px;background:#111;color:#fff;"><button class="btn" onclick="window.location.href='../index.html'">Volver al menú</button></div>

<header>
  <div class="wrap">
    <div class="row">
      <h1>🛠️ Gestión de Préstamos</h1><span class="pill">V15 · trazabilidad de compras, averías y bajas</span>

      <div class="spacer"></div>

      <button class="btn" id="btnOps">👥 Operarios</button>

      <button class="btn" id="btnHistorial">📜 Historial</button>
      <button class="btn" id="btnArchivadas">🗄️ Archivadas</button>
      <button class="btn" id="btnConfig">⚙️ Config</button>
      <button class="btn" id="btnExport">⬇ Exportar</button>
      <button class="btn" id="btnImport">⬆ Importar</button>
      <button class="btn" id="btnCloudSave">☁️ Guardar nube</button>

<main>
  <div class="kpi-strip" id="kpiStrip">

    <button class="kpi-card" data-kpi="inuse"><small>En uso</small><b id="kpiUse">0</b></button>

          <select id="sortInv" style="max-width:200px">

<div id="floating">
  <div class="inner">
    <span id="fbDragHandle" class="pill" title="Arrastra para mover. Doble click para reset."><span class="grip">⠿</span> Selección: <b id="selCount">0</b></span>
    <input id="fbOperario" list="dlOps" placeholder="Para (operario destino) *" autocomplete="off"/>

<div class="modal" id="modal">

    <div class="head">
      <h3 id="mTitle">Modal</h3>
      <button class="btn ghost" id="mClose">Cerrar</button>

    <div class="body" id="mBody"></div>
    <div class="foot" id="mFoot"></div>

</div>

<div class="modal aux" id="auxModal">
  <div class="panel">
    <div class="head">
      <h3 id="aTitle">Seleccionar</h3>
      <button class="btn ghost" id="aClose">Cerrar</button>
    </div>
    <div class="body" id="aBody"></div>
    <div class="foot" id="aFoot"></div>
  </div>
</div>

<script>
const IS_TOUCH = window.matchMedia("(hover: none) and (pointer: coarse)").matches;

/* ========= Persistencia ========= */
const DB_KEY = "tool_loans_db_v14_lib"; 
const CFG_KEY = "tool_loans_cfg_v14_lib";

window.DB_KEY = DB_KEY;
window.CFG_KEY = CFG_KEY;

const nowIso = () => new Date().toISOString();
const uid = () => Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,8);
const clampInt = (v, min, max) => {
  const n = Number.parseInt(String(v||"").replace(",", "."), 10);
  if (Number.isNaN(n)) return null;
  return Math.max(min, Math.min(max, n));
};
const normName = (s) => String(s||"").trim().replace(/\s+/g," ");
const normOp = (s) => {
  const t = normName(s);
  if(!t) return "";
  return t.split(" ").map(w=>w ? (w[0].toUpperCase()+w.slice(1).toLowerCase()) : "").join(" ");
};
const esc = (s) => String(s||"").replace(/[&<>"']/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const renderIcon = (s) => {
  if(!s) return "🧰";
  if(String(s).startsWith("data:image")) return `<img src="${s}" class="icon-img" alt="icon"/>`;
  if(String(s).includes("</svg>")) return s; 
  return esc(s);
};

function processImage(file, callback) {
  if(!file.type.startsWith("image/")) return alert("No es una imagen");
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_SIZE = 64; 
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } }
      else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/png'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let db = { schemaVersion:15, tools: [], history: [], library: null, familyOrder: [], operators: [] };
let cfg = { warnDays: 7, dangerDays: 30, familyOpen: {}, floatingPos: null, inventoryFilter:"all", historyHiddenBefore:"" };
let selected = new Set();
let dragSrcIndex = null; 
let draggedIcon = null;  
let dragType = null;
let dragSrcId = null;

const $ = (id)=>document.getElementById(id);
const invTools = $("invTools");
const useList = $("useList");
const floating = $("floating");
const fbOperario = $("fbOperario");
const fbRecoge = $("fbRecoge");
const dlOps = $("dlOps");
const statusPill = $("statusPill");

function applyFloatingPos(){
  const el = $("floating");
  if(!el) return;
  if(cfg && cfg.floatingPos && typeof cfg.floatingPos.x==="number" && typeof cfg.floatingPos.y==="number" && !IS_TOUCH){
    el.style.left = cfg.floatingPos.x + "px";
    el.style.top = cfg.floatingPos.y + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
  } else {
    el.style.left = "16px";
    el.style.top = "auto";
    el.style.right = "auto";
    el.style.bottom = "16px";
  }
}

function setupFloatingDrag(){
  const el = $("floating");
  const handle = $("fbDragHandle");
  if(!el || !handle) return;

  applyFloatingPos();
  if(IS_TOUCH) return;

  let dragging = false;
  let sx=0, sy=0, ox=0, oy=0;

  const onMove = (e) => {
    if(!dragging) return;
    e.preventDefault();
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    let nx = ox + dx;
    let ny = oy + dy;
    const rect = el.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    nx = Math.max(6, Math.min(vw - rect.width - 6, nx));
    ny = Math.max(6, Math.min(vh - rect.height - 6, ny));
    el.style.left = nx + "px";
    el.style.top = ny + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
  };

  const onUp = () => {
    if(!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    document.removeEventListener("pointermove", onMove, true);
    document.removeEventListener("pointerup", onUp, true);
    const left = parseFloat(el.style.left);
    const top = parseFloat(el.style.top);
    if(!Number.isNaN(left) && !Number.isNaN(top)){
      cfg.floatingPos = {x: left, y: top};
      saveAll();
    }
  };

  handle.addEventListener("pointerdown", (e)=>{
    if(el.style.display === "none") return;
    dragging = true;
    el.classList.add("dragging");
    sx = e.clientX;
    sy = e.clientY;
    const r = el.getBoundingClientRect();
    ox = r.left;
    oy = r.top;
    el.style.left = ox + "px";
    el.style.top = oy + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
    document.addEventListener("pointermove", onMove, true);
    document.addEventListener("pointerup", onUp, true);
  });

  handle.addEventListener("dblclick", ()=>{
    cfg.floatingPos = null;
    saveAll();
    applyFloatingPos();
  });

  window.addEventListener("resize", ()=>{ applyFloatingPos(); });
}

function dateMs(v){ const n=Date.parse(v||""); return Number.isFinite(n)?n:0; }
function activeLoansOf(t){ return (t.loans||[]).filter(l=>String(l.status||"active")!=="closed" && Number(l.qty||0)>0); }
function isLoanOverdue(l){
  if(!l) return false;
  if(l.dueAt){ const due=new Date(String(l.dueAt).slice(0,10)+"T23:59:59"); return Date.now()>due.getTime(); }
  return daysSince(l.outAt) >= cfg.dangerDays;
}
function ensureOperatorName(name){
  const n=normOp(name); if(!n) return "";
  if(!Array.isArray(db.operators)) db.operators=[];
  if(!db.operators.some(o=>normOp(o.name)===n)) db.operators.push({id:uid(),name:n,phone:"",dept:"",updatedAt:nowIso()});
  return n;
}
function inferFamilyByIcon(icon){
  const key=String(icon||"").trim();
  if(!key) return "Sin familia";
  for(const [fam,arr] of Object.entries(db.library||{})) if(Array.isArray(arr)&&arr.includes(key)) return fam;
  return "Sin familia";
}
function recalcMaintenance(t){
  const open=(t.repairCases||[]).filter(c=>String(c.status||"open")!=="closed" && Number(c.qty||((c.serials||[]).length)||0)>0);
  if(t.mode==="serial"){
    const set=new Set(); open.forEach(c=>(c.serials||[]).forEach(x=>set.add(x)));
    t.maintSerials=[...set]; t.maintQty=0;
  }else{
    t.maintQty=open.reduce((a,c)=>a+Number(c.qty||0),0); t.maintSerials=[];
  }
}
function familyOptionsHtml(selected){
  const fams=[...new Set([...(db.familyOrder||[]),...Object.keys(db.library||{}),"Sin familia"])];
  return fams.map(f=>`<option value="${esc(f)}" ${f===selected?'selected':''}>${esc(f)}</option>`).join('');
}
function eventAt(h){ return h?.inAt||h?.at||h?.outAt||h?.createdAt||""; }
function historyTypeLabel(type){
  return ({OUT:"Préstamo",IN:"Devolución",XFER:"Traspaso",REPAIR_IN:"A reparación",REPAIR_OUT:"Reparada",WRITE_OFF:"Baja / no reparable",STOCK_IN:"Entrada Compras",STOCK_ADJUST:"Ajuste stock",CREATE:"Alta",ARCHIVE:"Archivada",RESTORE:"Restaurada"})[type]||type||"Movimiento";
}

function loadAll(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw) db = JSON.parse(raw); }catch(_){ db = {schemaVersion:15,tools:[],history:[],library:null,familyOrder:[],operators:[]}; }
  if(!db || !Array.isArray(db.tools)) db = {schemaVersion:15,tools:[],history:[],library:null,familyOrder:[],operators:[]};
  if(!Array.isArray(db.history)) db.history=[];
  if(!db.library) db.library = JSON.parse(JSON.stringify(DEFAULT_LIB));
  if(!db.library["Mis Iconos"]) db.library["Mis Iconos"] = [];
  if(!Array.isArray(db.familyOrder)) db.familyOrder = [];
  if(!Array.isArray(db.operators)) db.operators=[];

  for(const t of db.tools){
    if(!Array.isArray(t.loans)) t.loans=[];
    if(!Array.isArray(t.serials)) t.serials=[];
    if(!Array.isArray(t.maintSerials)) t.maintSerials=[];
    if(!Array.isArray(t.repairCases)) t.repairCases=[];
    if(typeof t.maintQty!=="number") t.maintQty=0;
    if(typeof t.stock!=="number") t.stock=0;
    if(typeof t.archived!=="boolean") t.archived=false;
    if(!t.family) t.family=inferFamilyByIcon(t.icon);
    if(!t.kind) t.kind="reparable";
    const ts=t.updatedAt||t.createdAt||nowIso();
    if(!t.createdAt) t.createdAt=ts;
    if(!t.metaUpdatedAt) t.metaUpdatedAt=ts;
    if(!t.stockUpdatedAt) t.stockUpdatedAt=ts;
    for(const l of t.loans){
      if(!l.operator) l.operator="";
      if(!l.pickupBy) l.pickupBy=l.operator;
      if(!l.status) l.status=Number(l.qty||0)>0?"active":"closed";
      if(typeof l.originalQty!=="number") l.originalQty=Number(l.qty||0);
      if(!Array.isArray(l.originalSerials)) l.originalSerials=(l.serials||[]).slice();
      if(!l.updatedAt) l.updatedAt=l.closedAt||l.outAt||ts;
    }
    if(t.repairCases.length===0){
      const legacyQty=t.mode==="serial"?(t.maintSerials||[]).length:Number(t.maintQty||0);
      if(legacyQty>0){
        t.repairCases.push({id:"legacy_"+t.id,qty:legacyQty,serials:(t.maintSerials||[]).slice(),returnedBy:"",reason:"Reparación existente antes de la trazabilidad V15",openedAt:ts,updatedAt:ts,status:"open",legacy:true});
      }
    }
    t.repairCases.forEach(c=>{ if(!c.status) c.status="open"; if(!c.updatedAt) c.updatedAt=c.closedAt||c.openedAt||ts; if(typeof c.qty!=="number") c.qty=(c.serials||[]).length; });
    recalcMaintenance(t);
  }

  if(db.operators.length===0){
    const tempSet=new Set();
    [...db.history,...db.tools.flatMap(t=>t.loans)].forEach(item=>{ [item.operator,item.pickupBy,item.returnedBy,item.toOperator,item.fromOperator,item.receivedBy,item.deliveredBy].forEach(n=>{ const x=normOp(n); if(x) tempSet.add(x); }); });
    tempSet.forEach(name=>db.operators.push({id:uid(),name,phone:"",dept:"",updatedAt:nowIso()}));
  }
  db.schemaVersion=15;
  syncFamilyOrder();
  try{ const rawC=localStorage.getItem(CFG_KEY); if(rawC) cfg={...cfg,...JSON.parse(rawC)}; }catch(_){}
  if(cfg.warnHours){ cfg.warnDays=7; delete cfg.warnHours; }
  if(cfg.dangerHours){ cfg.dangerDays=30; delete cfg.dangerHours; }
  if(!cfg.inventoryFilter) cfg.inventoryFilter="all";
  if(!cfg.historyHiddenBefore) cfg.historyHiddenBefore="";
}

function syncFamilyOrder(){
  const currentKeys=Object.keys(db.library||{});
  currentKeys.forEach(k=>{ if(!db.familyOrder.includes(k)) db.familyOrder.push(k); });
  db.familyOrder=db.familyOrder.filter(k=>currentKeys.includes(k)||k==="Sin familia");
}

function saveAll(){
  db.schemaVersion=15;
  db.updatedAt=nowIso();
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
}

function toolsInUseCount(t){ return activeLoansOf(t).reduce((a,l)=>a+Number(l.qty||0),0); }
function toolsInMaintCount(t){ recalcMaintenance(t); return t.mode==="serial"?(t.maintSerials||[]).length:Number(t.maintQty||0); }
function toolsFreeQty(t){ return Math.max(0,Number(t.stock||0)-toolsInUseCount(t)-toolsInMaintCount(t)); }
function isCritical(t){ const free=toolsFreeQty(t); return free<=0||free<=Math.max(1,Math.floor((t.stock||0)*0.20)); }
function daysSince(iso){ const diffMs=Date.now()-new Date(iso).getTime(); const days=diffMs/(1000*60*60*24); return Math.max(0,Number.isFinite(days)?days:0); }

function hydrateOperators(){
  dlOps.innerHTML = "";

      }
      dlOps.appendChild(opt);
  });
}

function activeTools(){ return (db.tools||[]).filter(t=>!t.archived); }
function archivedTools(){ return (db.tools||[]).filter(t=>t.archived); }

function updateStatus(){
  const total=activeTools().length;
  const archivadas=archivedTools().length;
  const activeLoans=activeTools().reduce((a,t)=>a+activeLoansOf(t).length,0);
  const inMaint=activeTools().reduce((a,t)=>a+toolsInMaintCount(t),0);
  const overdue=activeTools().reduce((a,t)=>a+activeLoansOf(t).filter(isLoanOverdue).length,0);
  const empty=activeTools().filter(t=>toolsFreeQty(t)<=0).length;
  statusPill.textContent=`Items: ${total} · Activos: ${activeLoans} · Retrasados: ${overdue} · Reparación: ${inMaint}${archivadas?' · Archivadas: '+archivadas:''}`;
  const map={kpiAll:total,kpiUse:activeLoans,kpiOverdue:overdue,kpiRepair:inMaint,kpiEmpty:empty};
  Object.entries(map).forEach(([id,v])=>{const el=$(id); if(el) el.textContent=String(v);});
  document.querySelectorAll('[data-kpi]').forEach(b=>b.classList.toggle('active',b.dataset.kpi===cfg.inventoryFilter));
}
function familyOfTool(t){
  const fam=normName(t&&t.family);
  if(fam && (fam==="Sin familia" || Object.prototype.hasOwnProperty.call(db.library||{},fam))) return fam;
  return inferFamilyByIcon(t&&t.icon);
}

  let list = [];
  if (sort === "manual") {
      list = activeTools().map((t, idx) => ({ ...t, originalIndex: idx }));
  } else {
      list = [...activeTools()];
      if(sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
      if(sort==="free") list.sort((a,b)=>toolsFreeQty(b)-toolsFreeQty(a));
      if(sort==="crit") list.sort((a,b)=>{
        const ac = isCritical(a)?1:0, bc = isCritical(b)?1:0;
        if(ac!==bc) return bc-ac;
        return a.name.localeCompare(b.name);
      });

  if(search) list=list.filter(t=>t.name.toLowerCase().includes(search));

    wrap.appendChild(head);
    wrap.appendChild(body);
    useList.appendChild(wrap);
  }

  const repListEl = document.getElementById("repList");
  const repEmptyEl = document.getElementById("repEmpty");
  if(repListEl && repEmptyEl){
    repListEl.innerHTML = "";
    const repBuckets = {};
    let repCount = 0;
    for(const tool of activeTools()){
      const m = toolsInMaintCount(tool);
      if(m>0){
        const fam = familyOfTool(tool);
        if(!repBuckets[fam]) repBuckets[fam] = [];
        repBuckets[fam].push({tool, m});
        repCount += m;
      }
    }
    repEmptyEl.style.display = repCount ? "none" : "block";

    const fams = Object.keys(repBuckets).sort((a,b)=>a.localeCompare(b));
    for(const fam of fams){
      const wrap = document.createElement("div");
      wrap.style.border="1px solid var(--line)";
      wrap.style.borderRadius="14px";
      wrap.style.marginBottom="10px";
      wrap.style.overflow="hidden";
      wrap.style.background="rgba(255,255,255,0.03)";

      const head = document.createElement("div");
      head.className = "fam-head";
      head.style.display="flex";
      head.style.justifyContent="space-between";
      head.style.alignItems="center";
      head.style.padding="10px 12px";
      head.style.background="rgba(245,158,11,0.08)";
      head.style.cursor="pointer";
      head.innerHTML = `<div><b>${esc(fam)}</b> <span style="color:var(--mut);font-size:12px">(${repBuckets[fam].length})</span></div><div style="color:var(--mut);font-size:12px">▼</div>`;

      const body = document.createElement("div");
      body.style.padding="10px";
      const openKey = 'rep_' + fam;
      const isOpen = cfg.familyOpen && cfg.familyOpen[openKey] === true;
      body.style.display = isOpen ? "block" : "none";
      head.addEventListener("click", ()=>{
        const isHidden = body.style.display === "none";
        body.style.display = isHidden ? "block" : "none";
        if(!cfg.familyOpen) cfg.familyOpen = {};
        cfg.familyOpen[openKey] = isHidden;
      });

      repBuckets[fam].sort((a,b)=>a.tool.name.localeCompare(b.tool.name));

      for(const {tool, m} of repBuckets[fam]){
        const row = document.createElement("div");
        row.className = "loan warn";
        const serialLine = (tool.mode==="serial" && (tool.maintSerials||[]).length) ? `<p class="sub mono">Series: ${(tool.maintSerials||[]).join(", ")}</p>` : "";
        row.innerHTML = `
          <div class="top">
            <div class="sp">
              <div class="title">${renderIcon(tool.icon)} ${esc(tool.name)} · <span class="mono">${tool.mode==="serial" ? ("x"+(tool.maintSerials||[]).length) : ("x"+(tool.maintQty||0))}</span></div>
              <p class="sub">En reparación: <b>${m}</b> · Libres: <b>${toolsFreeQty(tool)}</b> · Stock: <b>${tool.stock||0}</b></p>
              ${serialLine}
            </div>
            <div><button class="btn" data-act="mng">Gestionar</button></div>
          </div>
        `;
        row.querySelector('[data-act="mng"]').addEventListener("click", ()=>openMaintManager(tool.id));
        body.appendChild(row);
      }

      wrap.appendChild(head);
      wrap.appendChild(body);
      repListEl.appendChild(wrap);
    }
  }

  $("selCount").textContent = String(selected.size);
  $("selHint").textContent = selected.size ? "Listo para prestar." : "";
  applyFloatingPos();
  floating.style.display = selected.size ? "block" : "none";
}

function toggleSelect(id){

function handleFamDragStart(e, famName){
    if(IS_TOUCH) return;
    if(e.target.closest('.tool')) return;
    dragType = 'family';
    dragSrcId = famName;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
}
function handleFamDragOver(e){
    if(IS_TOUCH || dragType !== 'family') return;
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}
function handleFamDragLeave(e){
    e.currentTarget.classList.remove('drag-over');
}
function handleFamDrop(e, targetFam){
    if(IS_TOUCH || dragType !== 'family') return;
    e.preventDefault();
    e.stopPropagation();
    const wrap = e.currentTarget;
    if(wrap) wrap.classList.remove('drag-over');

    const srcFam = dragSrcId;
    if(srcFam !== targetFam){
        const srcIdx = db.familyOrder.indexOf(srcFam);
        const tgtIdx = db.familyOrder.indexOf(targetFam);
        if(srcIdx > -1 && tgtIdx > -1){
             db.familyOrder.splice(srcIdx, 1);
             db.familyOrder.splice(tgtIdx, 0, srcFam);
             saveAll();
             render();
        }
    }
}

function handleToolDragStart(e, toolId){
    if(IS_TOUCH) return;
    dragType = 'tool';
    dragSrcId = toolId;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
    e.stopPropagation();
}
function handleToolDragOver(e){
    if(IS_TOUCH || dragType !== 'tool') return;
    e.preventDefault();
    const t = e.currentTarget.closest('.tool') || e.currentTarget;
    if(t) t.classList.add('drag-over');
}
function handleToolDragLeave(e){
    const t = e.currentTarget.closest('.tool') || e.currentTarget;
    if(t) t.classList.remove('drag-over');
}
function handleToolDrop(e, targetId){
    if(IS_TOUCH || dragType !== 'tool') return;
    e.preventDefault();
    e.stopPropagation();

    const sortSelect = $("sortInv");
    if(sortSelect.value !== "manual"){
        sortSelect.value = "manual";
    }

    const srcId = dragSrcId;
    if(srcId !== targetId){
        const srcIdx = db.tools.findIndex(t => t.id === srcId);
        const tgtIdx = db.tools.findIndex(t => t.id === targetId);

        if(srcIdx > -1 && tgtIdx > -1){
            const [item] = db.tools.splice(srcIdx, 1);
            const targetTool = db.tools[Math.max(0, Math.min(tgtIdx, db.tools.length-1))];
            if(targetTool && targetTool.family && item.family !== targetTool.family){ item.family = targetTool.family; item.metaUpdatedAt = nowIso(); item.updatedAt = item.metaUpdatedAt; }
            db.tools.splice(tgtIdx, 0, item);
            saveAll();
            render();
        }
    }
}

function toolHistory(toolId){
  const t = db.tools.find(x=>x.id===toolId);
  if(!t) return [];
  return (db.history||[]).filter(h => String(h.toolId||'') === String(toolId) || String(h.toolName||'') === String(t.name||''));
}

function deleteTool(id){
  const t = db.tools.find(x=>x.id===id);
  if(!t) return;
  if(toolsInUseCount(t)>0) return alert("Tiene préstamos activos. Devuélvelos primero.");
  if(toolsInMaintCount(t)>0) return alert("Tiene unidades en reparación. Sácalas de reparación antes de archivar.");
  const hist = toolHistory(id).length;
  if(confirm(`¿Archivar ${t.name}?

Desaparecerá del inventario activo, pero se conservará su historial${hist ? ' ('+hist+' movimientos)' : ''}.`)){
    t.archived = true;
    t.archivedAt = nowIso();
    selected.delete(id);
    db.history.push({id:uid(), type:"ARCHIVE", toolId:t.id, toolName:t.name, at:nowIso(), notes:"Herramienta archivada"});
    saveAll(); render();
  }
}

function restoreTool(id){
  const t = db.tools.find(x=>x.id===id);
  if(!t) return;
  if(confirm(`¿Restaurar ${t.name} al inventario activo?`)){
    t.archived = false;
    t.restoredAt = nowIso();
    db.history.push({id:uid(), type:"RESTORE", toolId:t.id, toolName:t.name, at:nowIso(), notes:"Herramienta restaurada desde archivo"});
    saveAll(); closeModal(); render(); openArchivedTools();
  }
}

function hardDeleteArchivedTool(id){
  const t = db.tools.find(x=>x.id===id);
  if(!t || !t.archived) return;
  if(toolHistory(id).length>0) return alert("Tiene historial. Por seguridad no se borra definitivamente; queda archivada.");
  if(confirm(`¿Borrar definitivamente ${t.name}?`)){
    db.tools = db.tools.filter(x=>x.id!==id);
    saveAll(); closeModal(); render(); openArchivedTools();
  }
}

function applyWriteOff(t,{qty=0,serials=[],returnedBy="",reason="",notes="",source="manual",repairCaseId=""}={}){
  const at=nowIso(); qty=Number(qty||serials.length||0); if(qty<=0) return false;
  const before=Number(t.stock||0);
  if(t.mode==="serial"){ const set=new Set(serials||[]); t.serials=(t.serials||[]).filter(x=>!set.has(x)); t.stock=t.serials.length; }
  else t.stock=Math.max(toolsInUseCount(t)+toolsInMaintCount(t), before-qty);
  t.stockUpdatedAt=at; t.updatedAt=at;
  db.history.push({id:uid(),type:"WRITE_OFF",repairCaseId,toolId:t.id,toolName:t.name,operator:ensureOperatorName(returnedBy),returnedBy:ensureOperatorName(returnedBy),qty,serials:(serials||[]).slice(),at,source,stockBefore:before,stockAfter:t.stock,notes:[normName(reason),normName(notes)].filter(Boolean).join(" · ")});
  return true;
}

function doSendMaint(t){
  const free=toolsFreeQty(t); if(free<=0) return alert("No hay unidades libres para registrar esta avería.");
  const serialMode=t.mode==="serial"; const used=new Set(activeLoansOf(t).flatMap(l=>l.serials||[])); const maint=new Set(t.maintSerials||[]); const available=(t.serials||[]).filter(s=>!used.has(s)&&!maint.has(s));

window.resolveRepairCase=function(toolId,caseId,outcome){
  const t=db.tools.find(x=>x.id===toolId); const c=t&&(t.repairCases||[]).find(x=>x.id===caseId); if(!t||!c||c.status==="closed") return;
  const serialMode=t.mode==="serial"; const max=Number(c.qty||0);
  showAuxModal(outcome==="repaired"?"Cerrar reparación: reparada":"Cerrar reparación: no reparable", `
    <div class="form">
      ${serialMode?`<div style="grid-column:1/-1"><label>Series</label><div class="checks" id="rcChecks">${(c.serials||[]).map(s=>`<label class="check"><input type="checkbox" value="${esc(s)}" checked/> ${esc(s)}</label>`).join('')}</div></div>`:`<div><label>Cantidad (máx ${max})</label><input id="rcQty" type="number" min="1" max="${max}" value="${max}"/></div>`}
      <div><label>Confirmado / recibido por</label><input id="rcBy" list="dlOps" placeholder="Operario"/></div>
      <div><label>Coste reparación (€)</label><input id="rcCost" inputmode="decimal" placeholder="Opcional"/></div>

      let serials=[],qty=0; if(serialMode){ serials=[...document.querySelectorAll('#rcChecks input:checked')].map(i=>i.value); qty=serials.length; } else qty=clampInt($("rcQty").value,1,max)||0; if(!qty) return alert("Indica cantidad");
      const by=ensureOperatorName($("rcBy").value); const note=normName($("rcNote").value); const cost=Number(String($("rcCost").value||"").replace(',','.'))||0; const at=nowIso();
      if(serialMode){ const set=new Set(serials); c.serials=(c.serials||[]).filter(x=>!set.has(x)); c.qty=c.serials.length; } else c.qty=Math.max(0,Number(c.qty||0)-qty);
      c.updatedAt=at; c.lastOutcome=outcome; if(c.qty<=0){ c.status="closed"; c.closedAt=at; c.outcome=outcome; }

      else applyWriteOff(t,{qty,serials,returnedBy:by,reason:"No reparable tras reparación",notes:note,source:"reparacion",repairCaseId:c.id});

function openBatchLoan(){
  const para = normOp(fbOperario.value);
  const recoge0 = normOp((fbRecoge && fbRecoge.value) || "");
  const recoge = recoge0 || para;
  if(!para) {
      if(selected.size > 0) alert("Escribe 'Para' (operario destino) en la barra flotante");
      return;
  }
  const list = activeTools().filter(t=>selected.has(t.id));
  if(!list.length) return alert("Selecciona herramientas");
  const rows = list.map(t=>{
    const free = toolsFreeQty(t);
    const usedS = new Set(activeLoansOf(t).flatMap(l=>l.serials||[]));
    const maintS = new Set(t.maintSerials);
    const availS = (t.serials||[]).filter(s => !usedS.has(s) && !maintS.has(s));
    let inputHtml = "";
    if(t.mode==="serial"){
       const opts = availS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
       inputHtml = `<select multiple data-id="${t.id}" data-type="serial" size="${Math.min(5,availS.length||1)}" style="min-width:150px">${opts}</select>`;
    } else {
       inputHtml = `<input type="number" data-id="${t.id}" data-type="qty" min="0" max="${free}" placeholder="0"/>`;
    }
    return `<tr><td>${renderIcon(t.icon)} ${t.name}</td><td>${free}</td><td><input data-id="${t.id}" data-type="variant" placeholder="Ej: 13, Pared 12..." style="font-size:12px"/></td><td>${inputHtml}</td></tr>`;
  }).join("");
  showModal("Confirmar Préstamo", `
    <div class="form">
      <div><label>Para (operario destino)</label><input id="lPara" value="${esc(para)}"/></div>
      <div><label>Recoge (quién lo retira)</label><input id="lRecoge" value="${esc(recoge)}" placeholder="Si lo recoge el mismo, deja igual"/></div>
      <div><label>Zona / Obra</label><input id="lZone"/></div><div><label>Devolución prevista</label><input id="lDue" type="date"/></div>
      <div style="grid-column:1/-1"><label>Notas generales</label><textarea id="lNotes"></textarea></div>
    </div>
    <table style="margin-top:10px"><thead><tr><th>Item</th><th>Libre</th><th>Detalle/Medida</th><th>Selección</th></tr></thead><tbody>${rows}</tbody></table>
  `, [
    {text:"Cancelar", className:"btn", onClick: closeModal},
    {text:"Prestar", className:"btn primary", onClick: ()=>{
      const para2 = normOp($("lPara").value);
      if(!para2) return alert("Falta 'Para' (operario destino)");
      const recoge2 = normOp($("lRecoge").value) || para2;
      const zone = normName($("lZone").value);
      const notes = normName($("lNotes").value);
      const dueAt = $("lDue").value || "";
      const items = [];
      document.querySelectorAll('tbody tr').forEach(tr => {
          const qtyInput = tr.querySelector('[data-type="qty"], [data-type="serial"]');
          const varInput = tr.querySelector('[data-type="variant"]');
          const tid = qtyInput.getAttribute("data-id");
          const type = qtyInput.getAttribute("data-type");
          const t = db.tools.find(x=>x.id===tid);
          const variant = normName(varInput.value);
          if(type==="qty"){
            const q = parseInt(qtyInput.value);
            if(q>0) items.push({t, qty:q, serials:[], mode:'qty', variant});
          } else {
            const s = [...qtyInput.selectedOptions].map(o=>o.value);
            if(s.length) items.push({t, qty:s.length, serials:s, mode:'serial', variant});
          }
      });
      if(!items.length) return alert("No has seleccionado cantidades");
      const outAt = nowIso();
      items.forEach(({t, qty, serials, mode, variant}) => {
          const l = {id:uid(), operator:ensureOperatorName(para2), pickupBy:ensureOperatorName(recoge2), zone, qty, originalQty:qty, mode, serials, originalSerials:serials.slice(), outAt, dueAt, notes, variant, status:"active", updatedAt:outAt};
          t.loans.push(l);
          db.history.push({id:uid(), type:"OUT", toolId:t.id, toolName:t.name, operator:para2, pickupBy:recoge2, zone, qty, serials, outAt, dueAt, notes, variant});
      });
      fbOperario.value = ""; if(fbRecoge) fbRecoge.value = ""; selected.clear(); saveAll(); closeModal(); render();
    }}
  ]);
}

function openReturn(tid,lid){
  const t=db.tools.find(x=>x.id===tid); const l=t&&activeLoansOf(t).find(x=>x.id===lid); if(!t||!l) return;
  const serialMode=l.mode==="serial";
  showModal("Devolución", `
    <div class="form">
      <div><label>Herramienta</label><input value="${esc(t.name)} ${l.variant?`(${esc(l.variant)})`:''}" disabled/></div>
      <div><label>Asignada a</label><input value="${esc(l.operator)}" disabled/></div>
      ${serialMode?`<div style="grid-column:1/-1"><label>Series que devuelve</label><div class="checks" id="retChecks">${(l.serials||[]).map(s=>`<label class="check"><input type="checkbox" value="${esc(s)}" checked/> ${esc(s)}</label>`).join('')}</div></div>`:`<div><label>Cantidad a devolver (máx ${l.qty})</label><input id="rQty" type="number" value="${l.qty}" max="${l.qty}" min="1"/></div>`}
      <div><label>Quién la devuelve físicamente</label><input id="rReturnedBy" list="dlOps" value="${esc(l.operator||'')}"/></div>
      <div><label>Estado devuelto</label><select id="rSt"><option value="ok">OK · vuelve disponible</option><option value="repair">Averiada · enviar a reparación</option><option value="writeoff">No sirve · baja directa</option></select></div>
      <div style="grid-column:1/-1"><label>Motivo / notas</label><textarea id="rNote" placeholder="Obligatorio si vuelve averiada o se da de baja"></textarea></div>
    </div>`,[
    {text:"Cancelar",className:"btn",onClick:closeModal},
    {text:"Confirmar",className:"btn primary",onClick:()=>{
      let retSerials=[],q=0; if(serialMode){ retSerials=[...document.querySelectorAll('#retChecks input:checked')].map(i=>i.value); q=retSerials.length; } else q=clampInt($("rQty").value,1,l.qty)||0; if(!q) return alert("Indica lo que se devuelve");
      const status=$("rSt").value; const note=normName($("rNote").value); if(status!=="ok"&&!note) return alert("Indica el motivo de la avería o baja");
      const returnedBy=ensureOperatorName($("rReturnedBy").value)||ensureOperatorName(l.operator); const at=nowIso();
      if(serialMode){ const set=new Set(retSerials); l.serials=(l.serials||[]).filter(x=>!set.has(x)); l.qty=l.serials.length; } else l.qty=Math.max(0,Number(l.qty||0)-q);
      l.returnedQty=Number(l.returnedQty||0)+q; l.updatedAt=at; if(l.qty<=0){ l.status="closed"; l.closedAt=at; }
      db.history.push({id:uid(),type:"IN",toolId:t.id,toolName:t.name,operator:l.operator,returnedBy,qty:q,serials:retSerials,outAt:l.outAt,inAt:at,status,notes:note,variant:l.variant});
      if(status==="repair") registerRepairCase(t,{qty:q,serials:retSerials,returnedBy,reason:note,source:"devolucion"});
      if(status==="writeoff") applyWriteOff(t,{qty:q,serials:retSerials,returnedBy,reason:note,source:"devolucion"});
      t.updatedAt=at; saveAll(); closeModal(); render();
    }}
  ]);
}

function openTransfer(tid, lid){
  const t = db.tools.find(x=>x.id===tid);
  if(!t) return;
  const l = activeLoansOf(t).find(x=>x.id===lid);
  if(!l) return;

  const curPara = normOp(l.operator);
  const curRecoge = normOp(l.pickupBy || l.operator);

  const opNames = Array.from(new Set([
    ...((db.operators || []).map(o => normOp(o.name)).filter(Boolean)),
    curPara,
    curRecoge
  ].filter(Boolean))).sort((a,b)=>a.localeCompare(b));

  const optionHtml = (selectedName) => opNames.map(name => {
    const op = (db.operators || []).find(o => normOp(o.name) === name) || {};
    const extra = [op.dept, op.phone ? ('📞 ' + op.phone) : ''].filter(Boolean).join(' · ');
    return `<option value="${esc(name)}" ${name===selectedName?'selected':''}>${esc(name)}${extra ? ' · ' + esc(extra) : ''}</option>`;
  }).join('');

  showModal("Cambiar operario (traspaso)", `
    <div class="form">
      <div style="grid-column:1/-1"><label>Herramienta</label><input value="${esc(t.name)} ${l.variant?`(${esc(l.variant)})`:''}" disabled/></div>
      <div><label>Para (nuevo destinatario)</label><select id="xPara">${optionHtml(curPara)}</select></div>
      <div><label>Recoge (quién la entrega/retira)</label><select id="xRecoge">${optionHtml(curRecoge)}</select></div>
      <div style="grid-column:1/-1"><label>Nota (opcional)</label><input id="xNote" placeholder="Ej. Se la cede Juan a Pedro"/></div>
    </div>
    <div class="small" style="margin-top:8px;color:var(--mut)">No pasa por almacén: se mantiene el préstamo activo y solo cambia el operario asignado.</div>
  `, [
    {text:"Cancelar", className:"btn", onClick: closeModal},
    {text:"Guardar cambio", className:"btn primary", onClick: ()=>{
      const newPara = normOp($("xPara").value);
      if(!newPara) return alert("Falta 'Para'");
      const newRecoge = normOp($("xRecoge").value) || newPara;
      const note = normName($("xNote").value);

      const prevPara = l.operator;
      const prevRecoge = l.pickupBy || l.operator;

      l.operator = newPara;
      l.pickupBy = newRecoge;
      l.updatedAt = nowIso();

      db.history.push({
        id: uid(),
        type: "XFER",
        toolId: t.id,
        toolName: t.name,
        fromOperator: prevPara,
        toOperator: newPara,
        pickupBy: newRecoge,
        qty: l.qty,
        serials: (l.serials||[]).slice(),
        outAt: l.outAt,
        at: nowIso(),
        notes: note,
        variant: l.variant || ""
      });

      saveAll(); closeModal(); render();
    }}
  ]);
}

function openToolFicha(id){
  const t = db.tools.find(x=>x.id===id);
  if(!t) return;
  const free = toolsFreeQty(t);
  const used = toolsInUseCount(t);
  const maint = toolsInMaintCount(t);
  const hist = toolHistory(id).slice().reverse();
  const activeLoans = activeLoansOf(t).slice().sort((a,b)=>new Date(a.outAt)-new Date(b.outAt));

  const loanRows = activeLoans.length ? activeLoans.map(l=>{
    const d = daysSince(l.outAt);
    const oldCls = isLoanOverdue(l) ? 'danger' : (d >= cfg.warnDays ? 'warn' : '');
    return `<div class="loan ${isLoanOverdue(l)?'dang':(d>=cfg.warnDays?'warn':'')}"><div class="top"><div class="sp"><div class="title">${esc(l.operator||'—')} · x${esc(l.qty||0)} ${l.variant?`(${esc(l.variant)})`:''}</div><p class="sub">Salida: ${new Date(l.outAt).toLocaleDateString('es-ES')} · <span class="pill ${oldCls}">${d.toFixed(1)} días fuera</span>${l.dueAt?` · Prevista: ${new Date(String(l.dueAt).slice(0,10)+'T12:00:00').toLocaleDateString('es-ES')}`:''}</p>${l.notes?`<p class="sub">📝 ${esc(l.notes)}</p>`:''}</div><div class="row"><button class="btn small" onclick="openTransfer('${t.id}','${l.id}')">Cambiar operario</button><button class="btn small primary" onclick="openReturn('${t.id}','${l.id}')">Devolver</button></div></div></div>`;
  }).join('') : '<p class="small">Sin préstamos activos.</p>';

  const histRows = hist.length ? hist.slice(0,80).map(h=>{
    const date = new Date(h.type==='OUT' ? h.outAt : (h.inAt || h.at || Date.now())).toLocaleDateString();
    const op = h.operator || h.toOperator || h.fromOperator || '—';
    return `<tr><td class="mono small">${date}</td><td><span class="badge ${h.type==='OUT'?'warn':(h.type==='WRITE_OFF'?'maint':'ok')}">${esc(historyTypeLabel(h.type))}</span></td><td>${esc(op)}${h.returnedBy?` · Devuelve: ${esc(h.returnedBy)}`:''} · x${esc(h.qty||0)}</td><td>${esc(h.variant||'')}</td><td>${esc(h.notes||'')} ${h.status==='inc'?'🚨':''}</td></tr>`;
  }).join('') : '<tr><td colspan="5" class="small">Sin historial.</td></tr>';

  showModal(`Ficha: ${t.name}`, `
    <div class="grid">
      <div class="card"><div class="content"><div class="row"><div style="font-size:36px">${renderIcon(t.icon)}</div><div><b>${esc(t.name)}</b><div class="small">${t.archived ? 'Archivada' : 'Activa'} · Modo: ${esc(t.mode||'qty')}</div></div></div></div></div>
      <div class="card"><div class="content"><b>Resumen</b><div class="row" style="margin-top:8px"><span class="pill">Stock ${esc(t.stock||0)}</span><span class="pill ok">Libre ${free}</span><span class="pill warn">En uso ${used}</span><span class="pill danger">Reparación ${maint}</span></div></div></div>
    </div>
    <div class="section-title">Préstamos activos</div>
    ${loanRows}
    <div class="section-title">Historial de esta herramienta</div>
    <div style="max-height:40vh;overflow:auto"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Operario</th><th>Detalle</th><th>Nota</th></tr></thead><tbody>${histRows}</tbody></table></div>
  `, [
    {text:"Cerrar", className:"btn", onClick:closeModal},
    {text:"Historial completo", className:"btn", onClick:()=>openHistory(t.id)},
    ...(t.archived ? [{text:"Restaurar", className:"btn primary", onClick:()=>restoreTool(t.id)}] : [{text:"Editar", className:"btn primary", onClick:()=>openEdit(t.id)}])
  ]);
}

function openHistory(toolId=null){
  const t=toolId?db.tools.find(x=>x.id===toolId):null; const title=t?`Historial · ${t.name}`:"Historial / trazabilidad";
  const cleanup=toolId?"":`<div class="row" style="margin-top:8px"><label style="margin:0">Ocultar movimientos anteriores a</label><input id="hBefore" type="date" value="${esc(cfg.historyHiddenBefore||'')}" style="max-width:180px"/><button class="btn" id="hHideOld">Aplicar</button><button class="btn" id="hShowAll">Mostrar todo</button></div>`;
  showModal(title, `<div class="audit-note">El historial incluye préstamos, devoluciones, reparaciones, bajas y entradas de Compras. Los movimientos no se borran: al limpiar solo se ocultan los antiguos para conservar la trazabilidad.</div><div style="margin-bottom:10px;display:flex;gap:10px"><input id="hSearch" placeholder="Filtrar por herramienta, operario, tipo, referencia..." style="flex:1"/></div>${cleanup}<div style="max-height:60vh;overflow:auto;margin-top:10px"><table id="hTable"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Nota</th></tr></thead><tbody id="hBody"></tbody></table></div>`,[{text:"Cerrar",className:"btn",onClick:closeModal}]);
  const renderH=(filter)=>{
    const f=String(filter||"").toLowerCase(); const base=toolId?toolHistory(toolId):(db.history||[]); const hiddenMs=!toolId&&cfg.historyHiddenBefore?Date.parse(cfg.historyHiddenBefore+"T00:00:00"):0;
    const list=base.slice().sort((a,b)=>dateMs(eventAt(b))-dateMs(eventAt(a))).filter(h=>(!hiddenMs||dateMs(eventAt(h))>=hiddenMs)&&(!f||[h.operator,h.returnedBy,h.pickupBy,h.toOperator,h.fromOperator,h.receivedBy,h.deliveredBy,h.toolName,h.variant,h.notes,h.purchaseRef,historyTypeLabel(h.type)].join(' ').toLowerCase().includes(f)));
    $("hBody").innerHTML=list.map(h=>`<tr><td class="mono small">${eventAt(h)?new Date(eventAt(h)).toLocaleString('es-ES'):'—'}</td><td><span class="badge ${h.type==='OUT'?'warn':(h.type==='WRITE_OFF'?'maint':'ok')}">${esc(historyTypeLabel(h.type))}</span></td><td class="small"><b>${esc(h.toolName||'—')}</b>${h.variant?`<br>(${esc(h.variant)})`:''}<br>${esc(h.operator||h.toOperator||h.fromOperator||h.receivedBy||'—')}${h.returnedBy?` · Devuelve: <b>${esc(h.returnedBy)}</b>`:''}${h.deliveredBy?` · Entrega: ${esc(h.deliveredBy)}`:''} · x${esc(h.qty||0)}${h.purchaseRef?`<br>Ref: ${esc(h.purchaseRef)}`:''}</td><td class="small">${esc(h.notes||'')} ${h.status==='repair'?'🚨':''}</td></tr>`).join('')||'<tr><td colspan="4" class="small">Sin resultados.</td></tr>';
  };
  renderH(""); $("hSearch").oninput=e=>renderH(e.target.value);
  if(!toolId){ const hide=$("hHideOld"),show=$("hShowAll"); if(hide) hide.onclick=()=>{ cfg.historyHiddenBefore=$("hBefore").value||""; saveAll(); renderH($("hSearch").value); }; if(show) show.onclick=()=>{ cfg.historyHiddenBefore=""; $("hBefore").value=""; saveAll(); renderH($("hSearch").value); }; }
}

function openOperatorManager() {
    const renderOps = (searchVal = "") => {
        let rows = "";
        const filtered = db.operators.filter(op => 
            op.name.toLowerCase().includes(searchVal) || 
            (op.dept||"").toLowerCase().includes(searchVal)
        );
        filtered.sort((a,b)=>a.name.localeCompare(b.name));

        filtered.forEach(op => {
            rows += `
              <tr>
                <td><b>${esc(op.name)}</b></td>
                <td>${esc(op.phone||"-")}</td>
                <td>${esc(op.dept||"-")}</td>
                <td style="text-align:right">
                    <button class="icon-btn edit" onclick="editOp('${op.id}')">✏️</button>
                    <button class="icon-btn del" onclick="deleteOp('${op.id}')">🗑️</button>
                </td>
              </tr>
            `;
        });

        return `
          <div style="margin-bottom:10px; display:flex; gap:10px;">
            <input id="opSearch" placeholder="Buscar operario..." value="${esc(searchVal)}" style="flex:1">
            <button class="btn primary" id="btnAddOp">+ Nuevo</button>
          </div>
          <div style="max-height:50vh; overflow:auto">
            <table>
              <thead><tr><th>Nombre</th><th>Teléfono</th><th>Dpto</th><th></th></tr></thead>
              <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:var(--mut)">Sin operarios</td></tr>'}</tbody>
            </table>
          </div>
        `;
    };

    showModal("Gestión de Operarios", renderOps(), [{text:"Cerrar", className:"btn", onClick:closeModal}]);

    const bindEvents = () => {
        const inp = $("opSearch");
        if(inp) inp.oninput = (e) => {
            $("mBody").innerHTML = renderOps(e.target.value.toLowerCase());
            bindEvents();
            const newInp = $("opSearch");
            newInp.value = e.target.value;
            newInp.focus();
        };
        const btnAdd = $("btnAddOp");
        if(btnAdd) btnAdd.onclick = () => openOpForm();
    };
    bindEvents();
}

window.editOp = (id) => openOpForm(id);
window.deleteOp = (id) => {
    if(confirm("¿Eliminar operario? (No afecta al historial pasado)")){
        db.operators = db.operators.filter(o => o.id !== id);
        saveAll();
        openOperatorManager();
        render();
    }
};

function openOpForm(id = null){
    const op = id ? db.operators.find(o => o.id === id) : {name:"", phone:"", dept:""};

    showAuxModal(id ? "Editar Operario" : "Nuevo Operario", `
        <div class="form">
            <div style="grid-column:1/-1"><label>Nombre Completo</label><input id="fOpName" value="${esc(op.name)}" placeholder="Ej. Juan Pérez"></div>
            <div><label>Teléfono</label><input id="fOpPhone" value="${esc(op.phone)}" placeholder="Opcional"></div>
            <div><label>Departamento</label><input id="fOpDept" value="${esc(op.dept)}" placeholder="Ej. Soldadura"></div>
        </div>
    `, [
        {text:"Cancelar", className:"btn", onClick:closeAuxModal},
        {text:"Guardar", className:"btn primary", onClick:()=>{
            const name = normOp($("fOpName").value);
            if(!name) return alert("Nombre obligatorio");

            if(id){
                const target = db.operators.find(o => o.id === id);
                if(target) {
                    target.name = name;
                    target.phone = $("fOpPhone").value.trim();
                    target.dept = $("fOpDept").value.trim();
                    target.updatedAt = nowIso();
                }
            } else {
                db.operators.push({
                    id: uid(),
                    name: name,
                    phone: $("fOpPhone").value.trim(),
                    dept: $("fOpDept").value.trim(),
                    updatedAt: nowIso()
                });
            }
            saveAll();
            closeAuxModal();
            openOperatorManager();
            render();
        }}
    ]);
}

function openCatalogManager(isPickerMode = false, onSelect = null) {
  const renderManager = () => {
      let html = `
        <div style="display:flex; gap:10px; margin-bottom:15px; border-bottom:1px solid var(--line); padding-bottom:10px; flex-wrap:wrap;">
          <button class="btn primary" id="btnAddNewFamily">+ Familia</button>
          <button class="btn" id="btnUploadIcon">+ Icono/Imagen</button>
          <div class="spacer"></div>
          ${!isPickerMode && !IS_TOUCH ? `<span class="small" style="color:var(--mut)">Arrastra iconos para ordenar o mover entre familias.</span>` : ''}
          ${!isPickerMode && IS_TOUCH ? `<span class="small" style="color:var(--mut)">Modo tablet: gestión sin arrastre.</span>` : ''}
        </div>
        <div style="max-height:60vh; overflow-y:auto; padding-right:5px;">
      `;

      for(const [cat, list] of Object.entries(db.library)){
        html += `
          <div class="cat-header" data-cat="${cat}">
             <span>${cat} <span class="badge" style="margin-left:8px">${list.length}</span></span>
             <div class="cat-actions">
                <button class="icon-btn edit" title="Renombrar" onclick="renameFamily('${cat}')">✏️</button>
                <button class="icon-btn del" title="Borrar Familia" onclick="deleteFamily('${cat}')">🗑️</button>
             </div>
          </div>
          <div class="emojiGrid" data-cat="${cat}">
        `;
        html += list.map((e, idx) => `
            <button class="emojiBtn" 
              ${!IS_TOUCH ? `draggable="true"` : ''}
              data-cat="${cat}" 
              data-idx="${idx}"
              onclick="selectIcon('${cat}', ${idx})"
            >
              ${renderIcon(e)}
            </button>`
        ).join("");
        html += `</div>`;
      }
      html += `</div>`;

      if(isPickerMode) {
          $("aBody").innerHTML = html;
      } else {
          $("mBody").innerHTML = html;
      }

      attachCatalogEvents(isPickerMode, onSelect, renderManager);
  };

  if(isPickerMode){
      showAuxModal("Seleccionar Icono", "", [{text:"Cancelar", className:"btn", onClick:closeAuxModal}]);
  } else {
      showModal("Gestión de Catálogo", "", [{text:"Cerrar", className:"btn", onClick:closeModal}]);
  }

  renderManager();
}

window.renameFamily = (oldName) => {
    const newName = prompt("Nuevo nombre para la familia:", oldName);
    if(newName && newName !== oldName){
        if(db.library[newName]) return alert("Ese nombre ya existe");
        const entries = Object.entries(db.library);
        const newLib = {};
        for(const [k,v] of entries){
            if(k === oldName) newLib[newName] = v;
            else newLib[k] = v;
        }
        db.library = newLib;
        db.tools.forEach(t=>{ if(t.family===oldName){ t.family=newName; t.metaUpdatedAt=nowIso(); t.updatedAt=t.metaUpdatedAt; } });
        const idx = db.familyOrder.indexOf(oldName);
        if(idx > -1) db.familyOrder[idx] = newName;
        else db.familyOrder.push(newName);
        saveAll();
        const isAux = $("auxModal").classList.contains("show");
        openCatalogManager(isAux, isAux ? window.currentSelectCb : null);
        render();
    }
};

window.deleteFamily = (name) => {
    if(confirm(`¿Eliminar familia "${name}" y todos sus iconos?`)){
        delete db.library[name];
        db.tools.forEach(t=>{ if(t.family===name){ t.family="Sin familia"; t.metaUpdatedAt=nowIso(); t.updatedAt=t.metaUpdatedAt; } });
        db.familyOrder = db.familyOrder.filter(n => n !== name);
        saveAll();
        const isAux = $("auxModal").classList.contains("show");
        openCatalogManager(isAux, isAux ? window.currentSelectCb : null);
        render();
    }
};

window.selectIcon = (cat, idx) => {
    if(window.isPickerActive && window.currentSelectCb) {
        window.currentSelectCb(db.library[cat][idx], cat);
        closeAuxModal();
    } else {
        if(confirm("¿Eliminar este icono?")){
            db.library[cat].splice(idx, 1);
            saveAll();
            openCatalogManager(false);
        }
    }
}

function attachCatalogEvents(isPickerMode, onSelect, refreshCb) {
    window.isPickerActive = isPickerMode;
    window.currentSelectCb = onSelect;

    const btnAddFam = document.getElementById("btnAddNewFamily");
    const btnUpload = document.getElementById("btnUploadIcon");

    if(btnAddFam) btnAddFam.onclick = () => {
        const name = prompt("Nombre de la nueva familia:");
        if(name){
            if(db.library[name]) return alert("Ya existe");
            db.library[name] = [];
            db.familyOrder.push(name);
            saveAll();
            refreshCb();
            render();
        }
    };

    if(btnUpload) btnUpload.onclick = () => openUploadModal(refreshCb);

    if(IS_TOUCH) return;

    const icons = document.querySelectorAll('.emojiBtn');
    const headers = document.querySelectorAll('.cat-header');

    icons.forEach(icon => {
        icon.addEventListener('dragstart', (e) => {
            draggedIcon = {
                cat: icon.dataset.cat,
                idx: parseInt(icon.dataset.idx)
            };
            icon.classList.add('dragging-icon');
            e.dataTransfer.effectAllowed = 'move';
        });

        icon.addEventListener('dragend', () => {
            icon.classList.remove('dragging-icon');
            document.querySelectorAll('.emojiBtn').forEach(i => i.classList.remove('drag-over-icon'));
            document.querySelectorAll('.cat-header').forEach(h => h.classList.remove('drag-target'));
        });

        icon.addEventListener('dragover', (e) => { e.preventDefault(); icon.classList.add('drag-over-icon'); });
        icon.addEventListener('dragleave', () => icon.classList.remove('drag-over-icon'));
        icon.addEventListener('drop', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const targetCat = icon.dataset.cat;
            const targetIdx = parseInt(icon.dataset.idx);

            if(draggedIcon && (draggedIcon.cat !== targetCat || draggedIcon.idx !== targetIdx)){
                const item = db.library[draggedIcon.cat].splice(draggedIcon.idx, 1)[0];
                let finalIdx = targetIdx;
                db.library[targetCat].splice(finalIdx, 0, item);
                saveAll();
                refreshCb();
            }
        });
    });

    headers.forEach(header => {
        header.addEventListener('dragover', (e) => { e.preventDefault(); header.classList.add('drag-target'); });
        header.addEventListener('dragleave', () => header.classList.remove('drag-target'));
        header.addEventListener('drop', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const targetCat = header.dataset.cat;
            if(draggedIcon && draggedIcon.cat !== targetCat){
                const item = db.library[draggedIcon.cat].splice(draggedIcon.idx, 1)[0];
                db.library[targetCat].push(item);
                saveAll();
                refreshCb();
            }
        });
    });
}

function openUploadModal(parentRefreshCb) {
  let tempImgData = null; 
  let baseImg = null; 
  const isAux = $("auxModal").classList.contains("show");
  const uploadModalId = isAux ? "modal" : "auxModal";
  const uploadModalTitle = isAux ? "mTitle" : "aTitle";
  const uploadModalBody = isAux ? "mBody" : "aBody";
  const uploadModalFoot = isAux ? "mFoot" : "aFoot";
  const uploadModalEl = $(uploadModalId);

  const body = `
    <div style="text-align:center">
      <div class="drop-zone" id="dz_upload">
        <span style="font-size:24px">📂</span><br>Click, Arrastrar o Ctrl+V
      </div>
      <input type="file" id="fi_upload" accept="image/*" style="display:none"/>
      <div class="slider-container"><label>Tono de Color</label><input type="range" id="sl_hue" min="0" max="360" value="0"></div>
      <div id="pv_upload" style="margin:15px 0; height:60px; display:flex; align-items:center; justify-content:center;"></div>
      <div style="text-align:left"><label>Familia destino:</label><select id="sel_cat_up">${Object.keys(db.library).map(k=>`<option value="${k}">${k}</option>`).join("")}</select></div>
    </div>
  `;

  $(uploadModalTitle).textContent = "Subir Nuevo Icono";
  $(uploadModalBody).innerHTML = body;
  const foot = $(uploadModalFoot);
  foot.innerHTML = "";

  const btnCancel = document.createElement("button");
  btnCancel.className = "btn";
  btnCancel.textContent = "Volver";
  btnCancel.onclick = () => {
      uploadModalEl.classList.remove("show");
  };

  const btnSave = document.createElement("button");
  btnSave.className = "btn primary";
  btnSave.textContent = "Guardar";
  btnSave.onclick = () => {
       if(!tempImgData) return alert("Falta imagen");
       const cat = $("sel_cat_up").value;
       db.library[cat].push(tempImgData);
       saveAll();
       uploadModalEl.classList.remove("show");
       parentRefreshCb();
  };

  foot.appendChild(btnCancel);
  foot.appendChild(btnSave);
  uploadModalEl.classList.add("show");

  const dz = $("dz_upload");
  const fi = $("fi_upload");
  const pv = $("pv_upload");
  const slider = $("sl_hue");

  const updatePreview = () => {
      if(!baseImg) return;
      const hue = slider.value;
      const canvas = document.createElement('canvas');
      canvas.width = baseImg.width; canvas.height = baseImg.height;
      const ctx = canvas.getContext('2d');
      ctx.filter = `hue-rotate(${hue}deg)`;
      ctx.drawImage(baseImg, 0, 0);
      tempImgData = canvas.toDataURL('image/png');
      pv.innerHTML = `<img src="${tempImgData}" style="border:1px solid #fff; border-radius:4px; padding:4px; background:#333"/>`;
  };

  const handleFile = (f) => {
    processImage(f, (base64) => {
      const img = new Image();
      img.onload = () => { baseImg = img; slider.value = 0; updatePreview(); };
      img.src = base64;
    });
  };

  dz.onclick = () => fi.click();
  slider.oninput = updatePreview;
  fi.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("dragover"); };
  dz.ondragleave = () => dz.classList.remove("dragover");
  dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("dragover"); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  document.onpaste = (e) => {
    if(!uploadModalEl.classList.contains("show")) return; 
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (const item of items) { if (item.kind === 'file' && item.type.startsWith('image/')) handleFile(item.getAsFile()); }
  };
}

      [CFG_KEY]: localStorage.getItem(CFG_KEY) || "",
    };

    const ref = doc(db, "backups", "tools_loans_v14");
    await setDoc(ref, {
      createdAt: serverTimestamp(),
      byUid: user.uid,
      keys: Object.keys(payload),
      payload
    }, { merge: true });

    if (!user) {
      alert("⚠️ No estás logueado en la nube. Abre el INDEX, inicia sesión y vuelve aquí.");

    }

    const data = snap.data() || {};
    const payload = data.payload || {};
    const keys = Object.keys(payload);

    try {
      for (const k of keys) {
        if (typeof payload[k] === "string") localStorage.setItem(k, payload[k]);
      }
    } catch (e) {
      console.error("CloudLoad localStorage error:", e);
      alert("❌ No se pudo restaurar en localStorage (memoria llena). Limpia espacio del sitio y vuelve a intentar.");
