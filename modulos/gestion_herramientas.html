  function parseSafeJSON(raw, fallback){
    try{ return JSON.parse(raw || ""); }catch(e){ return fallback; }
  }

  function normKey(v){ return String(v || "").trim().toLowerCase(); }

  function mergeArrayByIdentity(remoteArr, localArr, keyFn){
    const out = [];
    const pos = new Map();
    function add(x){
      if(!x || typeof x !== "object") return;
      const k = keyFn(x) || ("idx_" + out.length + "_" + Math.random());
      if(pos.has(k)) out[pos.get(k)] = Object.assign({}, out[pos.get(k)], x);
      else { pos.set(k, out.length); out.push(x); }
    }
    (Array.isArray(remoteArr) ? remoteArr : []).forEach(add);
    (Array.isArray(localArr) ? localArr : []).forEach(add);
    return out;
  }

  function mergeStockPayload(remoteRaw, localRaw){
    const r = parseSafeJSON(remoteRaw, null);
    const l = parseSafeJSON(localRaw, null);
    if(!r && !l) return localRaw || remoteRaw || null;
    if(!r) return localRaw;
    if(!l) return remoteRaw;
    const m = Object.assign({}, r, l);
    m.companies = mergeArrayByIdentity(r.companies, l.companies, x => x.id || x.companyId || x.code || x.codigo || x.name || x.nombre);
    m.materials = mergeArrayByIdentity(r.materials, l.materials, x => x.id || x.materialId || (normKey(x.name || x.nombre) + "|" + normKey(x.type || x.tipo) + "|" + normKey(x.family || x.familia)));
    m.stock = mergeArrayByIdentity(r.stock, l.stock, x => x.id || ((x.companyId || x.empresaId || "") + "|" + (x.materialId || x.matId || "")));
    m.movements = mergeArrayByIdentity(r.movements, l.movements, x => x.id || [x.companyId,x.materialId,x.type,x.tipo,x.qty,x.cantidad,x.date,x.fecha,x.note,x.obs].map(v=>String(v||"")).join("|"));
    m.jobs = mergeArrayByIdentity(r.jobs, l.jobs, x => x.id || x.ref || x.reference || x.referencia);
    m.reservations = mergeArrayByIdentity(r.reservations, l.reservations, x => x.id || [x.companyId,x.materialId,x.jobId,x.qty,x.date].map(v=>String(v||"")).join("|"));
    m.assignments = mergeArrayByIdentity(r.assignments, l.assignments, x => x.id || [x.companyId,x.materialId,x.jobId,x.qty,x.date,x.source].map(v=>String(v||"")).join("|"));
    m.reservationDebts = mergeArrayByIdentity(r.reservationDebts, l.reservationDebts, x => x.id || [x.companyId,x.materialId,x.jobId,x.qty,x.date].map(v=>String(v||"")).join("|"));
    m.updatedAt = (l.updatedAt && r.updatedAt) ? (String(l.updatedAt) > String(r.updatedAt) ? l.updatedAt : r.updatedAt) : (l.updatedAt || r.updatedAt || new Date().toISOString());
    return JSON.stringify(m);
  }

  function chooseNewer(a,b,fields){
    if(!a) return b; if(!b) return a;
    const ta=Math.max(...fields.map(f=>Date.parse(a[f]||"")||0)); const tb=Math.max(...fields.map(f=>Date.parse(b[f]||"")||0));
    return tb>=ta?Object.assign({},a,b):Object.assign({},b,a);
  }
  function mergeToolRecord(r,l){
    if(!r) return l; if(!l) return r;
    const base=chooseNewer(r,l,["updatedAt","metaUpdatedAt","stockUpdatedAt","archiveUpdatedAt","createdAt"]);
    const out=Object.assign({},r,l,base);
    const meta=chooseNewer(r,l,["metaUpdatedAt","updatedAt","createdAt"]);
    ["name","icon","family","kind","notes"].forEach(k=>{ if(meta&&meta[k]!==undefined) out[k]=meta[k]; });
    const stock=chooseNewer(r,l,["stockUpdatedAt","updatedAt","createdAt"]);
    if(stock){ out.stock=stock.stock; out.serials=Array.isArray(stock.serials)?stock.serials.slice():[]; out.stockUpdatedAt=stock.stockUpdatedAt||stock.updatedAt||stock.createdAt; }
    const arch=chooseNewer(r,l,["archiveUpdatedAt","archivedAt","restoredAt","updatedAt"]); if(arch){ out.archived=!!arch.archived; out.archivedAt=arch.archivedAt||""; out.restoredAt=arch.restoredAt||""; }
    out.loans=mergeArrayByIdentity(r.loans,l.loans,x=>x.id).map(x=>x);
    const loanMap=new Map(); [...(r.loans||[]),...(l.loans||[])].forEach(x=>{ if(!x||!x.id)return; const prev=loanMap.get(x.id); loanMap.set(x.id,chooseNewer(prev,x,["updatedAt","closedAt","outAt"])); }); out.loans=[...loanMap.values()];
    const repMap=new Map(); [...(r.repairCases||[]),...(l.repairCases||[])].forEach(x=>{ if(!x||!x.id)return; const prev=repMap.get(x.id); repMap.set(x.id,chooseNewer(prev,x,["updatedAt","closedAt","openedAt"])); }); out.repairCases=[...repMap.values()];
    const open=out.repairCases.filter(c=>String(c.status||"open")!=="closed"&&Number(c.qty||((c.serials||[]).length)||0)>0);
    if(out.mode==="serial"){ const ss=new Set(); open.forEach(c=>(c.serials||[]).forEach(v=>ss.add(v))); out.maintSerials=[...ss]; out.maintQty=0; } else { out.maintQty=open.reduce((a,c)=>a+Number(c.qty||0),0); out.maintSerials=[]; }
    return out;
  }
  function mergeToolsPayload(remoteRaw,localRaw){
    const r=parseSafeJSON(remoteRaw,null), l=parseSafeJSON(localRaw,null); if(!r&&!l) return localRaw||remoteRaw||null; if(!r) return localRaw; if(!l) return remoteRaw;
    const m=Object.assign({},r,l); const map=new Map(); [...(r.tools||[]),...(l.tools||[])].forEach(t=>{ if(!t||!t.id)return; map.set(t.id,mergeToolRecord(map.get(t.id),t)); }); m.tools=[...map.values()];
    m.history=mergeArrayByIdentity(r.history,l.history,x=>x.id||[x.type,x.toolId,x.at,x.inAt,x.outAt,x.qty].join("|"));
    m.operators=mergeArrayByIdentity(r.operators,l.operators,x=>normKey(x.name)||x.id).map(x=>x);
    m.familyOrder=[...new Set([...(l.familyOrder||[]),...(r.familyOrder||[])])];
    m.library=Object.assign({},r.library||{},l.library||{}); m.schemaVersion=Math.max(Number(r.schemaVersion||0),Number(l.schemaVersion||0),15); m.updatedAt=(String(l.updatedAt||"")>String(r.updatedAt||""))?l.updatedAt:r.updatedAt;
    return JSON.stringify(m);
  }

  function mergeLocalIntoRemoteStorage(remoteAll, localAll){
    const merged = Object.assign({}, remoteAll || {}, localAll || {});
    const stockKeys=["ldh_v2_company_stock_v1","taller_stock_v3_data"];
    stockKeys.forEach(k=>{ if((remoteAll&&remoteAll[k])||(localAll&&localAll[k])) merged[k]=mergeStockPayload(remoteAll&&remoteAll[k],localAll&&localAll[k]); });
    const toolsKey="tool_loans_db_v14_lib";
    if((remoteAll&&remoteAll[toolsKey])||(localAll&&localAll[toolsKey])) merged[toolsKey]=mergeToolsPayload(remoteAll&&remoteAll[toolsKey],localAll&&localAll[toolsKey]);
    return merged;
  }

  async function readRemoteStorage(docId = DOC_ID){
    const metaSnap = await getDoc(doc(db, "backups", docId));
    if(!metaSnap.exists()) return null;
    const meta = metaSnap.data() || {};
    const total = meta.totalChunks || 0;
    if(!total) return null;
    let json = "";
    for(let i=0;i<total;i++){
      const cSnap = await getDoc(doc(db, "backups", docId, "chunks", String(i)));
      if(!cSnap.exists()) return null;
      json += cSnap.data().part || "";
    }
    return { meta, all: JSON.parse(json) };
  }

  function collectLocalStorage(){
    const all = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k) continue;
      if(k.indexOf("firebase:") === 0) continue;
      if(k.indexOf(IGNORE_PREFIX) === 0) continue;
      if(k === CLIENT_ID_KEY || k === LAST_REV_KEY) continue;
      all[k] = localStorage.getItem(k);
    }
    return all;
  }

  function fastHash(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return String(h >>> 0) + ":" + str.length;
  }

  function markLocalDirty(reason){
    if(restoring) return;
    localDirty = true;
    lastLocalDirtyAt = Date.now();
    try{ sessionStorage.setItem("__LDH_LIVE_DIRTY_AT", String(lastLocalDirtyAt)); }catch(e){}
    if(reason) console.log("🟡 LiveSync: cambio local", reason);
  }
  window.__ldhMarkLocalDirty = markLocalDirty;

  async function liveBackupToFirestore(docId = DOC_ID, force = false){
    if(typeof docId === "boolean"){ force = docId; docId = DOC_ID; }
    if(restoring && !force) return { skipped:true, reason:"restoring" };
    if(!auth.currentUser) return { skipped:true, reason:"no_user" };
    if(!hasUsefulLocalData()) return { skipped:true, reason:"empty_local" };

    if(saving){
      if(!force) return { skipped:true, reason:"busy" };
      let guard = 0;
      while(saving && guard < 60){ await sleep(100); guard++; }
      if(saving) return { skipped:true, reason:"busy_timeout" };
    }

    let all = collectLocalStorage();
    try{
      const remote = await readRemoteStorage(docId);
      if(remote && remote.all) all = mergeLocalIntoRemoteStorage(remote.all, all);
    }catch(e){ console.warn("⚠️ LiveSync: no se pudo fusionar con remoto antes de subir", e); }
    const json = JSON.stringify(all);
    const hash = fastHash(json);
    if(!force && hash === lastHash && !localDirty) return { skipped:true, reason:"no_changes" };

    saving = true;
    try{
      const total = Math.max(1, Math.ceil(json.length / CHUNK));
      const revision = Date.now().toString(36) + "_" + CLIENT_ID;
      for(let i=0;i<total;i++){
        const part = json.slice(i * CHUNK, (i + 1) * CHUNK);
        await setDoc(doc(db, "backups", docId, "chunks", String(i)), { i, part, revision });
      }
      await setDoc(doc(db, "backups", docId), {
        updatedAt: serverTimestamp(),
        createdAt: serverTimestamp(),
        revision,
        clientId: CLIENT_ID,
        totalChunks: total,
        totalBytes: json.length,
        totalKeys: Object.keys(all).length,
        mode: "GESTION_TALLER_V2_LIVE_SYNC_V5_MERGE_STOCK_Y_HERRAMIENTAS"
      }, { merge:false });
      lastHash = hash;
      localDirty = false;
      pendingRemoteRev = "";
      try{ sessionStorage.setItem(LAST_REV_KEY, revision); }catch(e){}
      console.log("✅ LiveSync: subido a Firestore", { totalChunks:total, totalKeys:Object.keys(all).length, totalBytes:json.length, revision });
      return { docId, totalChunks:total, totalBytes:json.length, totalKeys:Object.keys(all).length, revision };
    }finally{
      saving = false;
    }
  }

  async function liveRestoreFromFirestore(docId = DOC_ID){
    if(restoring) return { skipped:true, reason:"restoring" };
    restoring = true;
    try{
      const metaSnap = await getDoc(doc(db, "backups", docId));
      if(!metaSnap.exists()) throw new Error("No existe backup en Firestore: " + docId);
      const meta = metaSnap.data() || {};
      const total = meta.totalChunks || 0;
      if(!total) throw new Error("Backup sin chunks: " + docId);
      let json = "";
      for(let i=0;i<total;i++){
        const cSnap = await getDoc(doc(db, "backups", docId, "chunks", String(i)));
        if(!cSnap.exists()) throw new Error("Falta chunk " + i);
        json += cSnap.data().part || "";
      }
      let all = JSON.parse(json);
      try{
        const current = collectLocalStorage();
        all = mergeLocalIntoRemoteStorage(all, current);
      }catch(e){ console.warn("⚠️ LiveSync: no se pudo fusionar local al restaurar", e); }
      localStorage.clear();
      for(const [k,v] of Object.entries(all)) localStorage.setItem(k, v);
      try{ sessionStorage.setItem(LAST_REV_KEY, meta.revision || ""); }catch(e){}
      lastHash = fastHash(JSON.stringify(collectLocalStorage()));
      localDirty = false;
      console.log("✅ LiveSync: restaurado desde Firestore", { keys:Object.keys(all).length, revision:meta.revision });
      return { docId, keys:Object.keys(all).length, revision:meta.revision };
    }finally{
      restoring = false;
    }
  }

  function scheduleLiveBackup(reason){
    if(!started || restoring) return;
    markLocalDirty(reason);
    if(pendingRemoteRev){
      console.log("⏸️ LiveSync: remoto pendiente aplazado por cambio local", { reason, pendingRemoteRev });
      pendingRemoteRev = "";
      clearTimeout(pendingRemoteTimer);
      pendingRemoteTimer = null;
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>liveBackupToFirestore(DOC_ID, true).catch(e=>console.warn("❌ LiveSync backup ERROR", e)), 650);
  }

  if(!window.__LDH_LIVE_STORAGE_PATCHED){
    window.__LDH_LIVE_STORAGE_PATCHED = true;
    const p = Storage.prototype;
    const oldSet = p.setItem;
    const oldRemove = p.removeItem;
    const oldClear = p.clear;
    p.setItem = function(k,v){ const r = oldSet.apply(this, arguments); if(this === localStorage && String(k||"").indexOf(IGNORE_PREFIX)!==0) scheduleLiveBackup("setItem:" + k); return r; };
    p.removeItem = function(k){ const r = oldRemove.apply(this, arguments); if(this === localStorage && String(k||"").indexOf(IGNORE_PREFIX)!==0) scheduleLiveBackup("removeItem:" + k); return r; };
    p.clear = function(){ const r = oldClear.apply(this, arguments); if(this === localStorage) scheduleLiveBackup("clear"); return r; };
  }

  async function flushLiveBackupBeforeLeave(){
    try{
      clearTimeout(saveTimer);
      if(started && auth.currentUser && !restoring){
        await liveBackupToFirestore(DOC_ID, true);
      }
    }catch(e){ console.warn("⚠️ LiveSync: flush al salir no completado", e); }
  }
  try{
    window.addEventListener("pagehide", ()=>{ flushLiveBackupBeforeLeave(); });
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushLiveBackupBeforeLeave(); });
  }catch(e){}

  function markUserActivity(){ lastUserActivity = Date.now(); }
  ["focusin","input","keydown","pointerdown","touchstart"].forEach(ev=>{ try{ window.addEventListener(ev, markUserActivity, true); }catch(e){} });

  function elementVisible(el){
    try{
      const st = getComputedStyle(el);
      if(st.display === "none" || st.visibility === "hidden" || Number(st.opacity) === 0) return false;
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    }catch(e){ return false; }
  }

  function hasOpenModalOrEditor(){
    try{
      const selectors = ['[role="dialog"]', '.modal', '.dialog', '.popup', '.overlay', '.drawer', '#modal', '#dlg', '[id*="modal" i]', '[class*="modal" i]', '[class*="dialog" i]'];
      return selectors.some(sel => Array.from(document.querySelectorAll(sel)).some(elementVisible));
    }catch(e){ return false; }
  }

  function isUserEditing(){
    try{
      const ae = document.activeElement;
      const tag = ae && ae.tagName ? ae.tagName.toLowerCase() : "";
      if(ae && (tag === "input" || tag === "textarea" || tag === "select" || ae.isContentEditable)) return true;
      if(Date.now() - lastUserActivity < 12000) return true;
      if(hasOpenModalOrEditor()) return true;
      if(localDirty && Date.now() - lastLocalDirtyAt < 10000) return true;
    }catch(e){}
    return false;
  }

  async function applyRemoteChange(rev){
    if(!rev || restoring || saving) return;
    if(localDirty){
      console.log("⏸️ LiveSync: no aplico remoto porque hay cambio local pendiente; subo local primero", rev);
      await liveBackupToFirestore(DOC_ID, true);
      return;
    }
    if(isUserEditing()){
      pendingRemoteRev = rev;
      clearTimeout(pendingRemoteTimer);
      pendingRemoteTimer = setTimeout(()=>{
        if(pendingRemoteRev && !isUserEditing()){
          const r = pendingRemoteRev; pendingRemoteRev = "";
          applyRemoteChange(r).catch(e=>console.warn("❌ LiveSync apply delayed ERROR", e));
        }else if(pendingRemoteRev){
          pendingRemoteTimer = setTimeout(()=>applyRemoteChange(pendingRemoteRev).catch(e=>console.warn("❌ LiveSync apply delayed ERROR", e)), 6000);
        }
      }, 6000);
      console.log("⏸️ LiveSync: cambio remoto aplazado porque hay formulario/edición abierta", rev);
      return;
    }
    console.log("⬇️ LiveSync: cambio remoto detectado", rev);
    await liveRestoreFromFirestore(DOC_ID);
    setTimeout(()=>location.reload(), 350);
  }

  async function startLiveSync(){
    if(started) return;
    started = true;
    window.__CLOUD_SYNC_DISABLE_LEGACY = true;

    if(!hasUsefulLocalData()){
      try{
        await liveRestoreFromFirestore(DOC_ID);
        setTimeout(()=>location.reload(), 300);
        return;
      }catch(e){ console.warn("⚠️ LiveSync: no se pudo auto-restaurar", e); }
    }else{
      try{ await liveBackupToFirestore(DOC_ID, true); }
      catch(e){ console.warn("⚠️ LiveSync: no se pudo subir estado local inicial", e); }
    }

    if(unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(doc(db, "backups", DOC_ID), async (snap)=>{
      try{
        if(!snap.exists() || restoring || saving) return;
        const meta = snap.data() || {};
        const rev = meta.revision || "";
        const lastRev = sessionStorage.getItem(LAST_REV_KEY) || "";
        if(!rev || meta.clientId === CLIENT_ID || rev === lastRev) return;
        await applyRemoteChange(rev);
      }catch(e){ console.warn("❌ LiveSync snapshot ERROR", e); }
    });

    try{
      setInterval(()=>{ if(started && localDirty) liveBackupToFirestore(DOC_ID, true).catch(e=>console.warn("❌ LiveSync periodic ERROR", e)); }, 3000);
    }catch(e){}

    console.log("🔁 LiveSync v5 merge stock + herramientas: activo", firebaseConfig.projectId);
  }

  function stopLiveSync(){
    started = false;
    clearTimeout(saveTimer);
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  }

  onAuthStateChanged(auth, (user)=>{ if(user) startLiveSync(); else stopLiveSync(); });

  window.backupToFirestore = liveBackupToFirestore;
  window.restoreFromFirestore = liveRestoreFromFirestore;
  window.autoRestoreIfEmpty = liveRestoreFromFirestore;
  window.__ldhAutoRestoreAfterLogin = liveRestoreFromFirestore;
  window.__ldhLiveSyncNow = liveBackupToFirestore;
  window.__ldhLiveRestoreNow = liveRestoreFromFirestore;
})();
</script>
