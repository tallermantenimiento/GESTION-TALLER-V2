<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enlace OT Dirección · Gestión Taller</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eef3f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 338px;gap:8px;padding:0 8px 0 0}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
#coreFrame{min-width:0}
#aiFrame{border-left:1px solid rgba(14,165,233,.28);background:#041226}
.ldh-draft-layer{position:fixed;left:0;top:0;bottom:0;right:346px;z-index:50;display:none;place-items:center;padding:22px;background:rgba(15,23,42,.46);backdrop-filter:blur(3px)}
.ldh-draft-layer.open{display:grid}.ldh-draft-card{width:min(650px,96%);max-height:88vh;overflow:auto;border-radius:20px;background:#fff;color:#10243d;border:1px solid #cbd5e1;box-shadow:0 28px 85px rgba(15,23,42,.34)}
.ldh-draft-head{padding:18px 20px 13px;border-bottom:1px solid #e2e8f0}.ldh-draft-head h2{margin:0;font-size:20px}.ldh-draft-head p{margin:5px 0 0;color:#64748b;font-size:12px;line-height:1.4}.ldh-draft-body{padding:16px 20px}.ldh-draft-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}.ldh-draft-row{padding:9px 10px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px}.ldh-draft-row.wide{grid-column:1/-1}.ldh-draft-label{display:block;color:#64748b;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.ldh-draft-value{font-weight:850;white-space:pre-wrap}.ldh-draft-note{margin-top:12px;padding:9px 10px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:11px;line-height:1.45}.ldh-draft-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:0 20px 18px}.ldh-draft-btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.ldh-draft-btn.edit{background:#e2e8f0;color:#16304d}.ldh-draft-btn.create{background:#16a34a;color:#fff}.ldh-draft-btn.cancel{background:#fff;color:#b91c1c;border:1px solid #fecaca}.ldh-draft-btn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.shell #aiFrame{display:none}.ldh-draft-layer{right:0}.ldh-draft-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <iframe id="coreFrame" src="./stock_informativo_compras_core.html" title="Enlace OT Direccion"></iframe>
  <iframe id="aiFrame" src="./enlace_ot_ai.html" title="Asistente IA Enlace OT"></iframe>
</div>
<div class="ldh-draft-layer" id="ldhCreateDraftLayer" aria-hidden="true">
  <div class="ldh-draft-card" role="dialog" aria-modal="true" aria-labelledby="ldhCreateDraftTitle">
    <div class="ldh-draft-head"><h2 id="ldhCreateDraftTitle">Nueva orden propuesta</h2><p>Revisa los datos. Puedes corregirlos hablando con la IA o abrir el formulario antes de guardar.</p></div>
    <div class="ldh-draft-body"><div class="ldh-draft-grid" id="ldhCreateDraftSummary"></div><div class="ldh-draft-note">Todavía no se ha escrito nada en Firebase. La orden solo se crea al pulsar <b>Crear orden</b>.</div></div>
    <div class="ldh-draft-actions"><button class="ldh-draft-btn edit" id="ldhDraftEdit" type="button">✏ Editar antes de guardar</button><button class="ldh-draft-btn create" id="ldhDraftCreate" type="button">✓ Crear orden</button><button class="ldh-draft-btn cancel" id="ldhDraftCancel" type="button">Cancelar</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
const core=document.getElementById('coreFrame');
const ai=document.getElementById('aiFrame');
const draftLayer=document.getElementById('ldhCreateDraftLayer'),draftSummary=document.getElementById('ldhCreateDraftSummary'),draftEdit=document.getElementById('ldhDraftEdit'),draftCreate=document.getElementById('ldhDraftCreate'),draftCancel=document.getElementById('ldhDraftCancel');
let pendingCreateDraft=null;
const txt=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
const norm=v=>txt(v).toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o||{},k);
function localDateISO(offsetDays=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+Number(offsetDays||0));const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function companySearchKey(value){const key=norm(value),compact=key.replace(/\s+/g,'');if(['sklum','esclum','esplum','esplume','explom','skloom'].includes(compact))return 'sklum';return key}
function resolveDeliveryDate(value){
  const raw=txt(value);if(!raw)return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;
  const dm=raw.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(dm)return dm[3]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[1]).padStart(2,'0');
  const key=norm(raw);if(key==='hoy')return localDateISO(0);if(key==='manana')return localDateISO(1);if(key==='pasado manana')return localDateISO(2);
  const rel=key.match(/^(?:dentro de|en)\s+(\d{1,3})\s+dias?$/);if(rel)return localDateISO(Number(rel[1]));
  return '';
}
function firstDoc(){try{return core.contentDocument||core.contentWindow.document}catch(_){return null}}
function workOrders(){try{return core.contentWindow&&core.contentWindow.WorkOrders||null}catch(_){return null}}
function pendingOrders(w){return (Array.isArray(w?.orders)?w.orders:[]).filter(o=>o&&o.status==='pending'&&!o.cancellationPendingV1&&String(o.cancellationRequestV1?.status||'')!=='pending')}
function structuredOrders(w){
  return pendingOrders(w).slice().sort((a,b)=>(Number(a.priority)||9999)-(Number(b.priority)||9999)).slice(0,60).map(o=>({
    id:txt(o.id),referencia:txt(o.reference),empresa:txt(o.companyName),cantidad:Number(o.quantity)||0,prioridad:Number(o.priority)||0,
    entrada:txt(o.entryDate),entrega:txt(o.deliveryDate),descripcion:txt(o.description),material:txt(o.material),
    hierro:txt(o.ironType),imprimacion:!!o.primer,ral:txt(o.ral),estado:txt(o.workflowStateV2||o.workflowState||o.status),
    aviso:txt(o.operationalNoticeV1)
  }));
}
function snapshot(){
  const d=firstDoc();
  if(!d)return {scope:'direccion_enlace_ot',programa:'Enlace OT Direccion',error:'Interfaz principal aun no disponible'};
  const dept=d.querySelector('#ldhDepartmentSelect,#ldhSimpleDepartmentSelect,select[data-department]');
  const department=txt(dept?.selectedOptions?.[0]?.textContent||dept?.value||'Los del Hierros');
  const pc=Number(txt(d.getElementById('woPendingCount')?.textContent||d.getElementById('ldhSimplePendingCount')?.textContent||'0'))||0;
  const hc=Number(txt(d.getElementById('woHistoryCount')?.textContent||d.getElementById('ldhSimpleHistoryCount')?.textContent||'0'))||0;
  const rows=[];const seen=new Set();
  for(const id of ['woOrdersBody','ldhSimplePendingBody']){
    const body=d.getElementById(id); if(!body)continue;
    for(const tr of Array.from(body.querySelectorAll('tr')).slice(0,40)){
      const s=txt(tr.textContent).slice(0,800);
      if(!s||/todav.a no hay/i.test(s)||seen.has(s))continue;seen.add(s);rows.push(s);
    }
  }
  const stock=[];
  for(const card of Array.from(d.querySelectorAll('.matCard')).slice(0,30)){
    const s=txt(card.textContent).slice(0,500); if(s)stock.push(s);
  }
  const w=workOrders();
  const companies=(Array.isArray(w?.companies)?w.companies:[]).map(c=>({id:txt(c.id),nombre:txt(c.name)})).filter(c=>c.id||c.nombre);
  return {
    scope:'direccion_enlace_ot',programa:'Enlace OT Direccion',timestamp:new Date().toISOString(),fechaLocalHoy:localDateISO(0),departamentoActivo:department,
    resumen:{pendientes:pc,historico:hc},trabajosPendientesVisibles:rows,ordenesPendientes:structuredOrders(w),empresasDisponibles:companies,
    stockVisible:stock,
    borradorCreacionPendiente:pendingCreateDraft?{company:pendingCreateDraft.companyName,deliveryDate:pendingCreateDraft.deliveryDate,quantity:pendingCreateDraft.quantity,priority:pendingCreateDraft.priority,description:pendingCreateDraft.description,material:pendingCreateDraft.material,ironType:pendingCreateDraft.ironType,primer:pendingCreateDraft.primer,ral:pendingCreateDraft.ral}:null,
    capacidadesIA:['open_new_order','create_order','update_create_draft','show_create_draft','cancel_create_draft','open_edit_order','edit_order','change_priority','request_cancellation','view_order','archive_order'],
    limites:'Solo datos y acciones del propio Enlace OT Direccion. Sin acceso directo a otros modulos ni cambio manual de estados de taller.'
  };
}
function findOrder(w,reference,{allowHistory=false}={}){
  const key=norm(reference);
  if(!key)return {error:'Falta la referencia de la orden.'};
  let rows=(Array.isArray(w?.orders)?w.orders:[]).filter(o=>o&&txt(o.reference));
  if(!allowHistory) rows=rows.filter(o=>o.status==='pending');
  const exact=rows.filter(o=>norm(o.reference)===key);
  if(exact.length===1)return {order:exact[0]};
  const partial=rows.filter(o=>norm(o.reference).includes(key)||key.includes(norm(o.reference)));
  if(partial.length===1)return {order:partial[0]};
  if(exact.length>1||partial.length>1)return {error:'La referencia no es univoca. Coinciden: '+(exact.length?exact:partial).slice(0,6).map(o=>o.reference).join(', ')};
  return {error:'No encuentro la orden '+txt(reference)+' en Enlace OT.'};
}
function findCompany(w,value){
  const key=companySearchKey(value);const rows=Array.isArray(w?.companies)?w.companies:[];
  if(!key)return {error:'Falta la empresa.'};
  const exact=rows.filter(c=>norm(c.id)===key||norm(c.name)===key);
  if(exact.length===1)return {company:exact[0]};
  const partial=rows.filter(c=>norm(c.name).includes(key)||key.includes(norm(c.name)));
  if(partial.length===1)return {company:partial[0]};
  if(exact.length>1||partial.length>1)return {error:'La empresa no es univoca.'};
  return {error:'Empresa no encontrada. Disponibles: '+rows.map(c=>c.name).filter(Boolean).join(', ')};
}
function setValue(d,id,value){const el=d.getElementById(id);if(!el)return;el.value=value==null?'':String(value);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
function setChecked(d,id,value){const el=d.getElementById(id);if(!el)return;el.checked=!!value;el.dispatchEvent(new Event('change',{bubbles:true}));}
function formatFinish(p){const out=[];if(hasOwn(p,'ironType'))out.push(norm(p.ironType).includes('galv')?'Galvanizado':'Hierro negro');if(hasOwn(p,'primer'))out.push(p.primer?'con imprimacion':'sin imprimacion');if(hasOwn(p,'ral'))out.push(txt(p.ral)||'sin RAL');return out.join(' · ')}
function cleanPriority(w,v,forNew){const max=Math.max(1,pendingOrders(w).length+(forNew?1:0));const n=Math.round(Number(v)||max);return Math.max(1,Math.min(max,n));}
function draftLines(p){const out=[['Empresa',p.companyName],['Entrega',p.deliveryDate],['Cantidad',p.quantity],['Prioridad',p.priority],['Descripción',p.description]];if(txt(p.material))out.push(['Material',p.material]);const finish=formatFinish(p);if(finish)out.push(['Acabado',finish]);return out}
function draftText(p){return draftLines(p).map(x=>x[0]+': '+txt(x[1])).join('\n')}
function renderCreateDraft(){if(!pendingCreateDraft||!draftLayer||!draftSummary)return;draftSummary.innerHTML='';for(const [label,value] of draftLines(pendingCreateDraft)){const row=document.createElement('div');row.className='ldh-draft-row'+(label==='Descripción'||label==='Material'||label==='Acabado'?' wide':'');const l=document.createElement('span');l.className='ldh-draft-label';l.textContent=label;const v=document.createElement('span');v.className='ldh-draft-value';v.textContent=txt(value);row.append(l,v);draftSummary.appendChild(row)}draftLayer.classList.add('open');draftLayer.setAttribute('aria-hidden','false')}
function hideCreateDraft(){draftLayer?.classList.remove('open');draftLayer?.setAttribute('aria-hidden','true')}
function notifyAi(message,opts={}){try{ai.contentWindow.postMessage({type:'LDH_ENLACE_OT_AI_EXTERNAL_RESULT',ok:opts.ok!==false,cancelled:!!opts.cancelled,message:txt(message)},location.origin)}catch(_){}}
function buildCreateDraft(w,p){
  const missing=[];if(!txt(p.deliveryDate))missing.push('fecha de entrega');if(!txt(p.company))missing.push('empresa');if(!(Number(p.quantity)>0))missing.push('cantidad');if(!txt(p.description))missing.push('descripcion');
  if(missing.length)return {error:'Faltan datos obligatorios para crear la orden: '+missing.join(', ')+'.'};
  const deliveryDate=resolveDeliveryDate(p.deliveryDate);if(!deliveryDate)return {error:'No entiendo la fecha de entrega "'+txt(p.deliveryDate)+'". Puedes usar hoy, manana, pasado manana, dentro de N dias, DD/MM/AAAA o YYYY-MM-DD.'};
  const fc=findCompany(w,p.company);if(fc.error)return {error:fc.error};
  return {draft:{companyId:txt(fc.company.id),companyName:txt(fc.company.name),deliveryDate,quantity:Math.max(1,Math.round(Number(p.quantity)||1)),priority:cleanPriority(w,p.priority,true),description:txt(p.description),material:txt(p.material),ironType:norm(p.ironType).includes('galv')?'galvanizado':'negro',primer:!!p.primer,ral:txt(p.ral)}};
}
function updateCreateDraft(w,changes){
  if(!pendingCreateDraft)return {error:'No hay ningún borrador de nueva orden pendiente.'};
  const next={...pendingCreateDraft};const c=(changes&&typeof changes==='object')?changes:{};
  if(hasOwn(c,'company')){const fc=findCompany(w,c.company);if(fc.error)return {error:fc.error};next.companyId=txt(fc.company.id);next.companyName=txt(fc.company.name)}
  if(hasOwn(c,'deliveryDate')){const resolved=resolveDeliveryDate(c.deliveryDate);if(!resolved)return {error:'No entiendo la fecha de entrega "'+txt(c.deliveryDate)+'".'};next.deliveryDate=resolved}
  if(hasOwn(c,'quantity')){const q=Math.round(Number(c.quantity)||0);if(q<1)return {error:'La cantidad debe ser mayor que cero.'};next.quantity=q}
  if(hasOwn(c,'priority'))next.priority=cleanPriority(w,c.priority,true);
  if(hasOwn(c,'description')){if(!txt(c.description))return {error:'La descripción no puede quedar vacía.'};next.description=txt(c.description)}
  if(hasOwn(c,'material'))next.material=txt(c.material);
  if(hasOwn(c,'ironType'))next.ironType=norm(c.ironType).includes('galv')?'galvanizado':'negro';
  if(hasOwn(c,'primer'))next.primer=!!c.primer;
  if(hasOwn(c,'ral'))next.ral=txt(c.ral);
  pendingCreateDraft=next;return {draft:next};
}
async function commitCreateDraft(){
  const w=workOrders(),d=firstDoc(),draft=pendingCreateDraft;if(!w||!d||!draft)return {ok:false,message:'No hay un borrador listo para crear.'};
  const fc=findCompany(w,draft.companyId||draft.companyName);if(fc.error)return {ok:false,message:fc.error};
  const before=new Set((w.orders||[]).map(o=>o.id));
  w.openNew();fillCreate(d,w,draft,fc.company);const probe=w.collectForm();const validation=w.validate(probe);if(validation){w.closeModal();return {ok:false,message:validation};}
  await w.saveWork();const created=(w.orders||[]).filter(o=>!before.has(o.id)).sort((a,b)=>(Number(b.updatedAtMs)||0)-(Number(a.updatedAtMs)||0))[0];
  if(!created)return {ok:false,message:'No se ha creado la orden. Comprueba que la sincronizacion muestre conectada y vuelve a intentarlo.'};
  pendingCreateDraft=null;hideCreateDraft();return {ok:true,message:'Orden creada correctamente: '+created.reference+' · '+created.companyName+' · '+created.quantity+' uds.'};
}
function openCreateDraftForEdit(){const w=workOrders(),d=firstDoc(),draft=pendingCreateDraft;if(!w||!d||!draft)return false;const fc=findCompany(w,draft.companyId||draft.companyName);if(fc.error)return false;hideCreateDraft();w.openNew();fillCreate(d,w,draft,fc.company);pendingCreateDraft=null;notifyAi('He abierto el formulario con el borrador ya rellenado. Puedes corregir lo necesario y guardarlo manualmente.');return true}
function fillCreate(d,w,p,company){
  setValue(d,'woDeliveryDate',p.deliveryDate);
  setValue(d,'woCompany',company.id);
  setValue(d,'woQuantity',Math.max(1,Math.round(Number(p.quantity)||1)));
  setValue(d,'woPriority',cleanPriority(w,p.priority,true));
  setValue(d,'woMaterial',txt(p.material));
  setValue(d,'woDescription',txt(p.description));
  setValue(d,'woIronType',norm(p.ironType).includes('galv')?'galvanizado':'negro');
  setChecked(d,'woPrimer',!!p.primer);
  setValue(d,'woRal',txt(p.ral));
}
function fillEdit(d,w,p){
  if(hasOwn(p,'deliveryDate'))setValue(d,'woDeliveryDate',p.deliveryDate);
  if(hasOwn(p,'quantity'))setValue(d,'woQuantity',Math.max(1,Math.round(Number(p.quantity)||1)));
  if(hasOwn(p,'priority'))setValue(d,'woPriority',cleanPriority(w,p.priority,false));
  if(hasOwn(p,'material'))setValue(d,'woMaterial',txt(p.material));
  if(hasOwn(p,'description'))setValue(d,'woDescription',txt(p.description));
  if(hasOwn(p,'ironType'))setValue(d,'woIronType',norm(p.ironType).includes('galv')?'galvanizado':'negro');
  if(hasOwn(p,'primer'))setChecked(d,'woPrimer',!!p.primer);
  if(hasOwn(p,'ral'))setValue(d,'woRal',txt(p.ral));
}
async function executeAction(action){
  const w=workOrders(),d=firstDoc();
  if(!w||!d)return {ok:false,message:'Enlace OT aun no esta preparado. Espera unos segundos y vuelve a intentarlo.'};
  const name=txt(action?.name||action?.action).toLowerCase();
  const p=(action&&typeof action.params==='object'&&action.params)||{};
  try{
    if(name==='open_new_order'){
      w.openNew();
      return {ok:true,message:'He abierto el formulario de nueva orden de trabajo para que puedas completarlo o revisarlo.'};
    }
    if(name==='create_order'){
      const built=buildCreateDraft(w,p);if(built.error)return {ok:false,message:built.error};pendingCreateDraft=built.draft;renderCreateDraft();
      return {ok:true,draft:true,message:'He preparado el borrador de la nueva orden. Revísalo: puedes decirme una corrección, abrir Editar antes de guardar o pulsar Crear orden. Todavía no se ha guardado nada.'};
    }
    if(name==='update_create_draft'){
      const changes=(p.changes&&typeof p.changes==='object')?p.changes:p;const updated=updateCreateDraft(w,changes);if(updated.error)return {ok:false,message:updated.error};renderCreateDraft();
      return {ok:true,draft:true,message:'Borrador actualizado:\n'+draftText(updated.draft)+'\n\nTodavía no se ha guardado. Revisa el resumen y pulsa Crear orden cuando esté correcto.'};
    }
    if(name==='show_create_draft'){
      if(!pendingCreateDraft)return {ok:false,message:'No hay ningún borrador de nueva orden pendiente.'};renderCreateDraft();return {ok:true,draft:true,message:'Te muestro de nuevo el borrador. Comprueba el resumen y pulsa Crear orden para guardarlo.'};
    }
    if(name==='cancel_create_draft'){
      if(!pendingCreateDraft)return {ok:false,message:'No hay ningún borrador de nueva orden pendiente.'};pendingCreateDraft=null;hideCreateDraft();return {ok:true,cancelled:true,message:'Borrador cancelado. No se ha modificado ningún dato.'};
    }
    if(name==='open_edit_order'){
      const fo=findOrder(w,p.reference);if(fo.error)return {ok:false,message:fo.error};w.openEdit(fo.order.id);return {ok:true,message:'He abierto '+fo.order.reference+' en modo edicion.'};
    }
    if(name==='edit_order'){
      const fo=findOrder(w,p.reference);if(fo.error)return {ok:false,message:fo.error};
      const changes=(p.changes&&typeof p.changes==='object')?{...p.changes}:{...p};delete changes.reference;
      if(!Object.keys(changes).length)return {ok:false,message:'No has indicado ningun cambio para '+fo.order.reference+'.'};
      if(hasOwn(changes,'deliveryDate')){const resolved=resolveDeliveryDate(changes.deliveryDate);if(!resolved)return {ok:false,message:'No entiendo la fecha de entrega \"'+txt(changes.deliveryDate)+'\".'};changes.deliveryDate=resolved;}
      let company=null;if(hasOwn(changes,'company')){const fc=findCompany(w,changes.company);if(fc.error)return {ok:false,message:fc.error};company=fc.company;}
      const readable=Object.entries(changes).map(([k,v])=>k+': '+(typeof v==='boolean'?(v?'si':'no'):txt(v))).join('\n');
      if(!confirm('La IA va a editar '+fo.order.reference+':\n\n'+readable+'\n\n¿Guardar estos cambios?'))return {ok:false,cancelled:true,message:'Edicion cancelada. No se ha modificado ningun dato.'};
      const before=Number(fo.order.updatedAtMs)||0;w.openEdit(fo.order.id);if(company)setValue(d,'woCompany',company.id);fillEdit(d,w,changes);
      const probe=w.collectForm();const validation=w.validate(probe);if(validation){w.closeModal();return {ok:false,message:validation};}
      await w.saveWork();const updated=(w.orders||[]).find(o=>o.id===fo.order.id);
      if(!updated||((Number(updated.updatedAtMs)||0)<=before))return {ok:false,message:'No se han podido confirmar los cambios en '+fo.order.reference+'.'};
      return {ok:true,message:'Cambios guardados en '+updated.reference+'.'};
    }
    if(name==='change_priority'){
      const fo=findOrder(w,p.reference);if(fo.error)return {ok:false,message:fo.error};const priority=cleanPriority(w,p.priority,false);
      if(!confirm('Cambiar '+fo.order.reference+' a la prioridad '+priority+'?'))return {ok:false,cancelled:true,message:'Cambio de prioridad cancelado.'};
      await w.changePriority(fo.order.id,{value:String(priority)});const updated=(w.orders||[]).find(o=>o.id===fo.order.id);
      return {ok:true,message:(updated?.reference||fo.order.reference)+' queda en prioridad '+(updated?.priority||priority)+'.'};
    }
    if(name==='request_cancellation'){
      const fo=findOrder(w,p.reference);if(fo.error)return {ok:false,message:fo.error};
      if(fo.order.cancellationPendingV1||String(fo.order.cancellationRequestV1?.status||'')==='pending')return {ok:true,message:'La anulacion de '+fo.order.reference+' ya esta pendiente de aprobacion.'};
      await w.cancelOrder(fo.order.id);const updated=(w.orders||[]).find(o=>o.id===fo.order.id);
      if(updated?.cancellationPendingV1||String(updated?.cancellationRequestV1?.status||'')==='pending')return {ok:true,message:'Solicitud de anulacion enviada para '+fo.order.reference+'. Queda pendiente de aprobacion desde Agenda.'};
      return {ok:false,cancelled:true,message:'La anulacion no se ha enviado. No se ha modificado la orden.'};
    }
    if(name==='view_order'){
      const fo=findOrder(w,p.reference,{allowHistory:true});if(fo.error)return {ok:false,message:fo.error};w.viewOrder(fo.order.id);return {ok:true,message:'He abierto el detalle de '+fo.order.reference+'.'};
    }
    if(name==='archive_order'){
      const fo=findOrder(w,p.reference,{allowHistory:true});if(fo.error)return {ok:false,message:fo.error};const before=fo.order.status;await w.archiveOrder(fo.order.id);const updated=(w.orders||[]).find(o=>o.id===fo.order.id);
      if(updated?.status==='completed'&&before!=='completed')return {ok:true,message:fo.order.reference+' se ha archivado.'};
      return {ok:false,cancelled:true,message:'No se ha archivado '+fo.order.reference+'.'};
    }
    return {ok:false,message:'Accion no permitida en Enlace OT: '+name+'.'};
  }catch(error){console.error('[Enlace OT IA action]',error);return {ok:false,message:'No se ha podido completar la accion: '+txt(error?.message||error)};}
}
if(draftEdit)draftEdit.addEventListener('click',()=>{if(!openCreateDraftForEdit())notifyAi('No he podido abrir el borrador en el formulario.',{ok:false})});
if(draftCancel)draftCancel.addEventListener('click',()=>{if(!pendingCreateDraft)return;pendingCreateDraft=null;hideCreateDraft();notifyAi('Borrador cancelado. No se ha modificado ningún dato.',{cancelled:true})});
if(draftCreate)draftCreate.addEventListener('click',async()=>{if(!pendingCreateDraft)return;draftCreate.disabled=true;const old=draftCreate.textContent;draftCreate.textContent='Creando...';try{const result=await commitCreateDraft();notifyAi(result.message,{ok:!!result.ok});if(!result.ok)renderCreateDraft()}catch(error){notifyAi('No se ha podido crear la orden: '+txt(error?.message||error),{ok:false});renderCreateDraft()}finally{draftCreate.disabled=false;draftCreate.textContent=old}});
window.addEventListener('message',e=>{
  if(e.source!==ai.contentWindow)return;
  const m=e.data||{};
  if(m.type==='LDH_ENLACE_OT_AI_SNAPSHOT_REQUEST'){
    ai.contentWindow.postMessage({type:'LDH_ENLACE_OT_AI_SNAPSHOT_RESPONSE',requestId:m.requestId,data:snapshot()},location.origin);
    return;
  }
  if(m.type==='LDH_ENLACE_OT_AI_ACTION_REQUEST'){
    Promise.resolve(executeAction(m.action)).then(result=>{
      ai.contentWindow.postMessage({type:'LDH_ENLACE_OT_AI_ACTION_RESPONSE',requestId:m.requestId,result},location.origin);
    });
  }
});
})();
</script>
