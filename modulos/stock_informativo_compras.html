<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Stock Compras v3</title><style>body{margin:0;background:#07111f;color:#eaf2ff;font-family:system-ui,Segoe UI,Arial}header{background:#071827;border-bottom:1px solid #31415a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}button,input,select{font:inherit}button{border:1px solid #31415a;background:#12304d;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}button.ok{background:#0d5133}button.danger{background:#572033}input,select{background:#071827;color:#fff;border:1px solid #31415a;border-radius:10px;padding:9px}.wrap{padding:18px;max-width:1450px;margin:auto}.login{max-width:420px;margin:50px auto;background:#101d31;border:1px solid #31415a;border-radius:18px;padding:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:250px 1fr;gap:14px}.side,.main{background:#101d31;border:1px solid #31415a;border-radius:16px;padding:14px}.pill{border:1px solid #31415a;border-radius:999px;padding:6px 10px;color:#9fb1c8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab.active,.active{background:#1677e8}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{background:#14253b;border:1px solid #31415a;border-radius:14px;padding:12px}.kpi b{font-size:26px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.acc{border:1px solid #31415a;border-radius:14px;background:#0a1b2b;margin:10px 0;overflow:hidden}.acc summary{padding:12px;font-weight:900;cursor:pointer;display:flex;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 12px 12px}.card{background:#132a44;border:1px solid #31415a;border-radius:16px;padding:12px}.qty{font-size:32px;font-weight:950;color:#bbf7d0}.mut{color:#9fb1c8;font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#0c1729;border:1px solid #31415a;border-radius:18px;padding:16px;width:min(620px,94vw)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#9fb1c8;font-size:12px;margin-top:8px}.err{color:#fecaca;display:none}table{width:100%}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><header><div><h1>Stock informativo · Compras</h1><div class=sub>Solo lectura · Firebase Stock nuevo</div></div><div><span id=conn class=pill>Sin conectar</span> <span id=last class=pill>—</span> <button id=logout class=hidden>Salir</button></div></header><main><section id=login class=login><h2>Acceso consulta</h2><label>Email</label><input id=email value="taller.mantenimiento@sklum.com"><label>Contraseña</label><input id=password type=password><button id=loginBtn class=primary style="width:100%;margin-top:16px">Entrar</button><div id=err class=err></div></section><section id=app class=hidden><div class=bar><input id=q class=search placeholder="Buscar material..."><select id=tf><option value=all>Hierro y pintura</option><option value=hierro>Solo hierro</option><option value=pintura>Solo pintura</option></select><select id=sf><option value=positive>Solo con stock libre</option><option value=all>Mostrar también 0</option><option value=low>Bajo mínimo / 0</option></select><button id=refresh>Actualizar</button></div><div id=companies class=tabs></div><section class=main><div id=content class=empty>Cargando...</div></section><div class=foot>Solo lectura. No crea, no borra y no modifica material.</div></section></main><script type=module>const cfg={apiKey:"AIzaSyBxTFd-DpvcohDVNOx2UqIOY-4BjJ212RA",authDomain:"gestion-taller-stock.firebaseapp.com",projectId:"gestion-taller-stock",storageBucket:"gestion-taller-stock.firebasestorage.app",messagingSenderId:"164944519480",appId:"1:164944519480:web:bfa9173d22f88a3b56e1cd"};const{initializeApp,getApps,getApp}=await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js");const{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}=await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js");const{getFirestore,collection,doc,setDoc,onSnapshot,getDocs,serverTimestamp,writeBatch,addDoc}=await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js");const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const $=i=>document.getElementById(i),s=v=>String(v??"").trim(),n=v=>{let x=Number(v);return Number.isFinite(x)?x:0},esc=v=>s(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),slug=v=>s(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"item",fmt=v=>{let x=n(v);return Number.isInteger(x)?String(x):x.toLocaleString("es-ES",{maximumFractionDigits:2})};let companies=[],mats=[],activeCompany="",activeType="hierro",unC,unM;const colC=collection(db,"stock_companies"),colM=collection(db,"stock_materials"),colMov=collection(db,"stock_movements");function cname(id){return companies.find(c=>c.id===id)?.name||id||"-"}function status(t){$("conn").textContent=t}async function seed(){if(!(await getDocs(colC)).empty)return;let b=writeBatch(db);["PROCEED","SKLUM","REYNOLDS","WOODS","STOCK COMUN"].forEach((x,i)=>b.set(doc(db,"stock_companies",slug(x)),{name:x,order:i,active:true,updatedAt:serverTimestamp()}));await b.commit()}function rComps(){companies.sort((a,b)=>n(a.order)-n(b.order)||s(a.name).localeCompare(s(b.name),"es"));if(!activeCompany||!companies.some(c=>c.id===activeCompany))activeCompany=companies[0]?.id||"";if($("company"))$("company").innerHTML=companies.map(c=>`<option value="${esc(c.id)}" ${c.id===activeCompany?"selected":""}>${esc(c.name)}</option>`).join("");if($("companies"))$("companies").innerHTML=companies.map(c=>`<button class="tab ${c.id===activeCompany?"active":""}" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join(""),document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{activeCompany=b.dataset.id;render()})}function rows(){let q=($("q")?.value||"").toLowerCase(),tf=$("tf")?.value||activeType,sf=$("sf")?.value||"all";return mats.filter(m=>!m.deleted&&m.companyId===activeCompany&&(tf=="all"||m.type==tf)&&(!q||[m.name,m.family,m.location,m.unit].join(" ").toLowerCase().includes(q))).filter(m=>sf=="all"||(sf=="positive"?n(m.qty)>0:(n(m.qty)<=0||(n(m.min)>0&&n(m.qty)<=n(m.min))))).sort((a,b)=>n(a.familyOrder)-n(b.familyOrder)||s(a.family).localeCompare(s(b.family),"es")||n(a.order)-n(b.order)||s(a.name).localeCompare(s(b.name),"es"))}function groups(arr){let mp=new Map();arr.forEach(m=>{let f=s(m.family)||"Sin familia";if(!mp.has(f))mp.set(f,[]);mp.get(f).push(m)});return [...mp].map(([name,items])=>({name,items}))}function card(m,edit){return`<div class="card"><b>${esc(m.name)}</b><div class="mut">${esc(m.family||"Sin familia")} · ${esc(m.location||"Sin ubicación")}</div><div><span class="qty">${fmt(m.qty)}</span> <span class="mut">${esc(m.unit||"und")}</span></div><div class="mut">${n(m.min)>0?"mín. "+fmt(m.min):""}</div>${edit?`<p><button onclick="move('${m.id}','entrada')" class="ok">+ Entrada</button> <button onclick="move('${m.id}','salida')">Salida</button> <button onclick="edit('${m.id}')">Editar</button> <button class="danger" onclick="delMat('${m.id}')">Borrar</button></p>`:""}</div>`}function render(){rComps();let arr=rows();$("content").innerHTML=`<div class=section-title>${esc(cname(activeCompany))} <span style=float:right>${arr.length} materiales visibles</span></div>`+["hierro","pintura"].map(t=>{let a=arr.filter(m=>m.type==t),gs=groups(a);return`<details class=acc><summary><span>▸ ${t=="hierro"?"Hierro":"Pintura"}</span><span class=mut>${a.length} materiales · ${gs.length} familias</span></summary><div class=acc-body>${a.length?gs.map(g=>`<details class=acc><summary>▸ ${esc(g.name)} <span class=mut>${g.items.length}</span></summary><div class=cards>${g.items.map(m=>card(m,false)).join("")}</div></details>`).join(""):"<div class=empty>Sin materiales</div>"}</div></details>`}).join("");$("last").textContent="Última actualización: "+new Date().toLocaleTimeString("es-ES")}function start(){unC=onSnapshot(colC,sn=>{companies=sn.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false&&!c.deleted);render()},console.error);unM=onSnapshot(colM,sn=>{mats=sn.docs.map(d=>({id:d.id,...d.data()}));render()},console.error)}["q","tf","sf"].forEach(id=>$(id).oninput=render);$("refresh").onclick=render;$("loginBtn").onclick=()=>signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value).catch(e=>{$("err").textContent=e.code||e.message;$("err").style.display="block"});$("logout").onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");status("Conectado · solo lectura");start()}else{$("login").classList.remove("hidden");$("app").classList.add("hidden");status("Sin conectar")}});</script></body></html>
