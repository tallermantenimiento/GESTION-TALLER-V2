<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBxTFd-DpvcohDVNOx2UqIOY-4BjJ212RA",
  authDomain: "gestion-taller-stock.firebaseapp.com",
  projectId: "gestion-taller-stock",
  storageBucket: "gestion-taller-stock.firebasestorage.app",
  messagingSenderId: "164944519480",
  appId: "1:164944519480:web:bfa9173d22f88a3b56e1cd"
};
const {initializeApp,getApps,getApp} = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js');
const {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js');
const {getFirestore,doc,getDoc,onSnapshot,collection,getDocs} = await import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js');
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
console.log('✅ Compras OK: proyecto', firebaseConfig.projectId);

const $ = id => document.getElementById(id);
const s = v => String(v ?? '').trim();
const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const low = v => s(v).toLowerCase();
const esc = v => s(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => { const x=n(v); return Number.isInteger(x) ? String(x) : x.toLocaleString('es-ES',{maximumFractionDigits:2}); };
const dateShort = () => new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

const STOCK_META = ['taller_data','stock'];
const STOCK_KEY = 'ldh_v2_company_stock_v1';

let companies = [];
let rows = [];
let activeCompany = '';
let unsubMeta = null;
let unsubMaterials = null;
let lastSource = '';
let sourceStats = {package:null,materials:null,direct:null};

let openAccState = new Set();

function accKeyFromDetails(d){
  const summary = d ? d.querySelector('summary') : null;
  return d?.dataset?.accKey || (summary ? summary.textContent.trim() : '');
}
function rememberOpenAccordions(){
  try{
    openAccState = new Set(
      Array.from(document.querySelectorAll('#content details.acc[open]'))
        .map(accKeyFromDetails)
        .filter(Boolean)
    );
  }catch(e){}
}
function isAccOpen(key){
  return openAccState.has(key);
}
function setAccListeners(){
  try{
    document.querySelectorAll('#content details.acc').forEach(d=>{
      d.addEventListener('toggle', ()=>{
        const k = accKeyFromDetails(d);
        if(!k) return;
        if(d.open) openAccState.add(k);
        else openAccState.delete(k);
      });
    });
  }catch(e){}
}
let loadTimer = null;
function scheduleLoadAll(){
  clearTimeout(loadTimer);
  loadTimer = setTimeout(loadAll, 180);
}


function setStatus(txt, ok){
  $('conn').textContent = txt;
  $('conn').className = 'pill ' + (ok ? 'ok' : 'warn');
}

function companyId(c){ return s(c.id || c.code || c.name || c.nombre).toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function companyDisplayName(c,id){
  return s((c && (c.name || c.nombre || c.code || c.label)) || id || '').trim().toUpperCase();
}
function companyKeyName(name){
  return s(name).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function companyName(id){ return (companies.find(c=>c.id===id)||{}).name || id || '-'; }

function classify(mat,row){
  const fam = low(mat.family || mat.familia || mat.grp || row.family || row.grp || '');
  const name = low([mat.name,mat.nombre,row.name,row.materialName].join(' '));
  const explicitType = low(mat.type || mat.tipo || mat.stockType || row.type || row.tipo || row.stockType || '');
  const txt = fam + ' ' + name;

  // Si Stock editable ha guardado el tipo explícito, manda ese tipo.
  if(explicitType.includes('hierro')) return 'hierro';
  if(explicitType.includes('pint')) return 'pintura';

  // Familias/materiales que SIEMPRE son hierro.
  if(
    fam.includes('perf') || fam.includes('pletina') || fam.includes('pds') ||
    fam.includes('estructural') || fam.includes('macizo') || fam.includes('pds') ||
    fam.includes('varilla') || fam.includes('tubo') || fam.includes('chapa') ||
    txt.includes('perfiler') || txt.includes('varilla') || txt.includes('pletina') ||
    txt.includes('tubo') || txt.includes('chapa') || txt.includes('macizo') ||
    txt.includes('estructural') || txt.includes('pds') || txt.includes('p d s')
  ) return 'hierro';

  // Pintura solo cuando se indica claramente.
  if(
    fam.includes('pint') ||
    name.includes('pintura') || name.includes('antrac') ||
    name.includes('ral') || name.includes('blanco') || name.includes('bote')
  ) return 'pintura';

  return 'otro';
}

function qtyFromStockRow(row){
  return n(row.physicalQty ?? row.qtyPhysical ?? row.fisico ?? row.realQty ?? row.stockFisico ?? row.stockReal ?? row.stockActual ?? row.existencias ?? row.actualQty ?? row.qty ?? row.cantidad ?? row.quantity ?? 0);
}

function normalizePackage(db0){
  db0 = db0 && typeof db0 === 'object' ? db0 : {};
  const compArr = Array.isArray(db0.companies) ? db0.companies : [];
  const matArr = Array.isArray(db0.materials) ? db0.materials : [];
  const stockArr = Array.isArray(db0.stock) ? db0.stock : [];

  // Importante: Stock puede tener empresas duplicadas con IDs distintos pero mismo nombre.
  // Compras debe mostrar una sola pestaña por nombre y agrupar todas las líneas bajo esa empresa.
  const compMap = new Map();       // canonicalId -> company visible
  const idAlias = new Map();       // rawId -> canonicalId
  const nameAlias = new Map();     // normalizedName -> canonicalId

  function registerCompany(c,i){
    c = c || {};
    const rawId = companyId(c) || ('empresa_'+i);
    const visibleName = companyDisplayName(c, rawId) || rawId.toUpperCase();
    const nameKey = companyKeyName(visibleName);
    let canonical = nameAlias.get(nameKey);
    if(!canonical){
      canonical = rawId;
      nameAlias.set(nameKey, canonical);
      compMap.set(canonical, {id:canonical, name:visibleName, order:n(c.order ?? i)});
    }else{
      const ex = compMap.get(canonical);
      if(ex) ex.order = Math.min(n(ex.order), n(c.order ?? i));
    }
    idAlias.set(rawId, canonical);
    return canonical;
  }

  compArr.forEach(registerCompany);

  function canonicalCompanyFromRow(r){
    r = r || {};
    const raw = companyId({id:r.companyId || r.empresaId || r.company || r.empresa || r.companyName || r.nombre});
    if(raw && idAlias.has(raw)) return idAlias.get(raw);

    const visibleName = companyDisplayName({name:r.companyName || r.empresa || r.company || r.companyId}, raw || 'stock_comun');
    const key = companyKeyName(visibleName);
    if(key && nameAlias.has(key)) return nameAlias.get(key);

    const fallbackId = raw || companyId({name:visibleName}) || 'stock_comun';
    const canonical = registerCompany({id:fallbackId, name:visibleName, order:9999}, 9999);
    return canonical;
  }

  const matMap = new Map(matArr.map(m=>[s(m.id),m]));

  // Orden real de Stock:
  // - familyOrder = primera aparición de la familia dentro de empresa+tipo.
  // - order = posición de la línea dentro de esa familia.
  const familyPos = new Map();
  const itemPos = new Map();
  let globalVisibleIndex = 0;

  const out = [];
  stockArr.forEach((r,i)=>{
    const mat = matMap.get(s(r.materialId)) || {};
    const cid = canonicalCompanyFromRow(r);
    const typ = classify(mat,r);
    if(typ !== 'hierro' && typ !== 'pintura') return;

    const fam = s(mat.family || mat.familia || mat.grp || r.family || r.grp || 'Sin familia') || 'Sin familia';
    const familyKey = cid + '|' + typ + '|' + fam.toLowerCase();
    if(!familyPos.has(familyKey)) familyPos.set(familyKey, globalVisibleIndex++);

    const itemKey = cid + '|' + typ + '|' + fam.toLowerCase();
    const itemIndex = itemPos.get(itemKey) || 0;
    itemPos.set(itemKey, itemIndex + 1);

    out.push({
      id: s(r.id || cid + '_' + (r.materialId || i)),
      companyId: cid,
      type: typ,
      name: s(mat.name || mat.nombre || r.name || r.materialName || 'Material'),
      family: fam,
      unit: s(r.unit || r.unidad || mat.unit || mat.unidad || 'und'),
      location: s(r.location || r.ubicacion || ''),
      min: n(r.min ?? mat.min ?? mat.minimo ?? 0),
      qty: qtyFromStockRow(r),
      order: n(r.order ?? mat.order ?? itemIndex),
      familyOrder: n(r.familyOrder ?? mat.familyOrder ?? familyPos.get(familyKey)),
      sourceOrder: i
    });
  });
  companies = Array.from(compMap.values()).sort((a,b)=>a.order-b.order || a.name.localeCompare(b.name,'es'));
  return out;
}

function normalizeMaterialCollection(docs){
  // Parte desde las empresas ya normalizadas por normalizePackage.
  const compMap = new Map(companies.map(c=>[c.id,c]));
  const nameAlias = new Map(companies.map(c=>[companyKeyName(c.name), c.id]));

  function registerVisibleCompany(rawId, visibleName, order=9999){
    visibleName = companyDisplayName({name:visibleName}, rawId);
    const key = companyKeyName(visibleName);
    if(nameAlias.has(key)) return nameAlias.get(key);
    const cid = rawId || companyId({name:visibleName}) || ('empresa_'+compMap.size);
    nameAlias.set(key, cid);
    compMap.set(cid, {id:cid, name:visibleName, order});
    return cid;
  }

  const out = [];
  docs.forEach((m,i)=>{
    if(m.deleted) return;
    const rawId = companyId({id:m.companyId || m.companyName || 'stock_comun'});
    const cid = registerVisibleCompany(rawId, m.companyName || m.companyId || rawId, 9999);
    const typ = classify(m,m);
    if(typ !== 'hierro' && typ !== 'pintura') return;
    out.push({
      id:s(m.id || docs.id || cid+'_'+i),
      companyId:cid,
      type:typ,
      name:s(m.name || 'Material'),
      family:s(m.family || 'Sin familia'),
      unit:s(m.unit || 'und'),
      location:s(m.location || ''),
      min:n(m.min),
      qty:n(m.qty),
      order:n(m.order ?? i),
      familyOrder:n(m.familyOrder ?? 999999),
      sourceOrder:n(m.sourceOrder ?? i)
    });
  });
  companies = Array.from(compMap.values()).sort((a,b)=>a.order-b.order || a.name.localeCompare(b.name,'es'));
  return out;
}

async function readChunkPackage(){
  sourceStats.package = null;
  const metaSnap = await getDoc(doc(db,...STOCK_META));
  if(!metaSnap.exists()){
    sourceStats.package = {exists:false, totalChunks:0, rawCompanies:0, rawMaterials:0, rawStock:0, rows:0};
    return [];
  }
  const meta = metaSnap.data() || {};
  const total = n(meta.totalChunks);
  if(!total){
    sourceStats.package = {exists:true, totalChunks:0, rawCompanies:0, rawMaterials:0, rawStock:0, rows:0};
    return [];
  }
  let json = '';
  for(let i=0;i<total;i++){
    const cs = await getDoc(doc(db,...STOCK_META,'chunks',String(i)));
    if(cs.exists()) json += cs.data().part || cs.data().data || cs.data().text || '';
  }
  const all = JSON.parse(json || '{}');
  const raw = all[STOCK_KEY];
  if(!raw){
    sourceStats.package = {exists:true, totalChunks:total, rawCompanies:0, rawMaterials:0, rawStock:0, rows:0};
    return [];
  }
  const parsed = JSON.parse(raw);
  const normalized = normalizePackage(parsed);
  sourceStats.package = {
    exists:true,
    totalChunks:total,
    rawCompanies:Array.isArray(parsed.companies) ? parsed.companies.length : 0,
    rawMaterials:Array.isArray(parsed.materials) ? parsed.materials.length : 0,
    rawStock:Array.isArray(parsed.stock) ? parsed.stock.length : 0,
    rows:normalized.length,
    updatedAt: parsed.updatedAt || meta.updatedAt || meta.savedAt || ''
  };
  return normalized;
}

async function readMaterialCollection(){
  sourceStats.materials = null;
  const snap = await getDocs(collection(db,'stock_materials'));
  const docs = snap.docs.map(d=>({id:d.id,...d.data()}));
  const normalized = normalizeMaterialCollection(docs);
  sourceStats.materials = {docs:docs.length, rows:normalized.length};
  return normalized;
}

async function readDirectStockDoc(){
  sourceStats.direct = null;
  try{
    const snap = await getDoc(doc(db,...STOCK_META));
    if(!snap.exists()){
      sourceStats.direct = {exists:false, rows:0};
      return [];
    }
    const d = snap.data() || {};
    const candidates = [
      d[STOCK_KEY],
      d.payload,
      d.data,
      d.json,
      d.stock,
      d.db,
      d.state
    ].filter(Boolean);

    for(const val of candidates){
      let parsed = val;
      if(typeof parsed === 'string'){
        try{ parsed = JSON.parse(parsed); }catch(e){ continue; }
      }
      if(parsed && parsed[STOCK_KEY] && typeof parsed[STOCK_KEY] === 'string'){
        try{ parsed = JSON.parse(parsed[STOCK_KEY]); }catch(e){}
      }
      if(parsed && typeof parsed === 'object' && (Array.isArray(parsed.stock) || Array.isArray(parsed.materials))){
        const normalized = normalizePackage(parsed);
        sourceStats.direct = {
          exists:true,
          rawCompanies:Array.isArray(parsed.companies) ? parsed.companies.length : 0,
          rawMaterials:Array.isArray(parsed.materials) ? parsed.materials.length : 0,
          rawStock:Array.isArray(parsed.stock) ? parsed.stock.length : 0,
          rows:normalized.length
        };
        return normalized;
      }
    }
    sourceStats.direct = {exists:true, rows:0};
    return [];
  }catch(e){
    sourceStats.direct = {error:String(e && (e.code || e.message || e)), rows:0};
    return [];
  }
}


function mergeRowsPreferPackage(fromPackage, fromDocs){
  const out = [];
  const seen = new Set();
  const keyOf = r => [
    s(r.companyId).toLowerCase(),
    s(r.type).toLowerCase(),
    s(r.family).toLowerCase(),
    s(r.name).toLowerCase(),
    s(r.unit).toLowerCase()
  ].join('|');

  (fromPackage || []).forEach(r=>{
    const k = keyOf(r);
    if(!k || seen.has(k)) return;
    seen.add(k);
    out.push(r);
  });

  (fromDocs || []).forEach(r=>{
    const k = keyOf(r);
    if(!k || seen.has(k)) return;
    seen.add(k);
    out.push(r);
  });

  return out;
}


async function loadAll(){
  try{
    const fromPackage = await readChunkPackage();
    let fromDocs = [];
    let fromDirect = [];
    try { fromDocs = await readMaterialCollection(); } catch(e) { console.warn('stock_materials no disponible o vacio', e); sourceStats.materials = {error:String(e && (e.code || e.message || e)), docs:0, rows:0}; }
    try { fromDirect = await readDirectStockDoc(); } catch(e) { console.warn('lectura directa no disponible', e); }
    // Unimos todas las fuentes legibles de Firestore sin duplicar.
    rows = mergeRowsPreferPackage(mergeRowsPreferPackage(fromPackage, fromDirect), fromDocs);
    lastSource = [
      fromPackage.length ? 'paquete taller_data/stock' : '',
      fromDirect.length ? 'doc directo' : '',
      fromDocs.length ? 'stock_materials' : ''
    ].filter(Boolean).join(' + ') || 'sin datos';
    if(!activeCompany || !companies.some(c=>c.id===activeCompany)) activeCompany = companies[0]?.id || '';
    render();
    $('last').textContent = 'Última actualización: ' + dateShort();
    const p = sourceStats.package || {};
    const d = sourceStats.direct || {};
    const sm = sourceStats.materials || {};
    $('debug').textContent =
      'Fuente: ' + lastSource +
      ' · empresas: ' + companies.length +
      ' · visibles normalizados: ' + rows.length +
      ' · paquete raw stock: ' + (p.rawStock ?? 0) +
      ' / raw materiales: ' + (p.rawMaterials ?? 0) +
      ' / chunks: ' + (p.totalChunks ?? 0) +
      ' · directo raw stock: ' + (d.rawStock ?? 0) +
      ' · stock_materials docs: ' + (sm.docs ?? 0);
  }catch(e){
    console.error(e);
    $('content').innerHTML = '<div class="empty">No se pudo leer el stock. Revisa consola, login o reglas.</div>';
    $('debug').textContent = String(e && (e.code || e.message || e));
  }
}

function renderCompanies(){
  // Seguridad visual: nunca pintar pestañas duplicadas por nombre.
  const seen = new Set();
  const visible = [];
  companies.forEach(c=>{
    const k = companyKeyName(c.name || c.id);
    if(seen.has(k)) return;
    seen.add(k);
    visible.push(c);
  });
  companies = visible;
  if(activeCompany && !companies.some(c=>c.id===activeCompany)){
    activeCompany = companies[0]?.id || '';
  }
  $('companies').innerHTML = companies.map(c=>`<button class="${c.id===activeCompany?'active':''}" data-company="${esc(c.id)}">${esc(c.name)}</button>`).join('');
  document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>{ activeCompany=b.dataset.company; openAccState.clear(); render(); });
}

function filteredRows(){
  const q = low($('search').value);
  const tf = $('typeFilter').value;
  const sf = $('stockFilter').value;
  return rows.filter(r=>r.companyId===activeCompany)
    .filter(r=>tf==='all' || r.type===tf)
    .filter(r=>!q || low([r.name,r.family,r.location,r.unit].join(' ')).includes(q))
    .filter(r=>sf==='all' || (sf==='positive' ? n(r.qty)>0 : (n(r.qty)<=0 || (n(r.min)>0 && n(r.qty)<=n(r.min)))))
    .sort((a,b)=>
      n(a.familyOrder)-n(b.familyOrder) ||
      n(a.order)-n(b.order) ||
      n(a.sourceOrder)-n(b.sourceOrder) ||
      s(a.family).localeCompare(s(b.family),'es') ||
      s(a.name).localeCompare(s(b.name),'es')
    );
}

function groupBy(arr, fn){
  const map = new Map();
  arr.forEach(x=>{ const k=fn(x); if(!map.has(k)) map.set(k,[]); map.get(k).push(x); });
  return Array.from(map.entries()).map(([name,items])=>({
    name,
    items:items.sort((a,b)=>n(a.order)-n(b.order) || n(a.sourceOrder)-n(b.sourceOrder) || s(a.name).localeCompare(s(b.name),'es')),
    familyOrder: Math.min(...items.map(x=>n(x.familyOrder)))
  })).sort((a,b)=>n(a.familyOrder)-n(b.familyOrder) || s(a.name).localeCompare(s(b.name),'es'));
}

function render(){
  rememberOpenAccordions();
  renderCompanies();
  const all = filteredRows();
  let html = `<div class="sectionTitle"><span>${esc(companyName(activeCompany))}</span><span>${all.length} materiales visibles</span></div>`;
  html += typeHTML('Hierro', all.filter(x=>x.type==='hierro'));
  html += typeHTML('Pintura', all.filter(x=>x.type==='pintura'));
  $('content').innerHTML = html;
  setAccListeners();
}

function typeHTML(title, arr){
  const fams = groupBy(arr, x=>s(x.family)||'Sin familia');
  const key = 'type:' + title;
  const open = isAccOpen(key) ? ' open' : '';
  return `<details class="acc" data-acc-key="${esc(key)}"${open}><summary><span class="typeName">▸ ${title}</span><span class="materialCount">${arr.length} materiales · ${fams.length} familias</span></summary><div class="accBody">${arr.length ? fams.map(familyHTML).join('') : '<div class="empty">Sin materiales</div>'}</div></details>`;
}

function familyHTML(f){
  const key = 'family:' + activeCompany + ':' + s(f.name);
  const open = isAccOpen(key) ? ' open' : '';
  return `<details class="acc" data-acc-key="${esc(key)}"${open}><summary><span class="familyName">▸ ${esc(f.name)}</span><span class="materialCount">${f.items.length} materiales</span></summary><div class="accBody"><div class="grid">${f.items.map(cardHTML).join('')}</div></div></details>`;
}

function cardHTML(m){
  const zero = n(m.qty)<=0;
  const lowc = n(m.qty)>0 && n(m.min)>0 && n(m.qty)<=n(m.min);
  return `<article class="matCard ${zero?'zero':lowc?'low':''}"><div class="name">${esc(m.name)}</div><div class="mut">${esc(m.family)} · ${esc(m.location||'Sin ubicación')}</div><div><span class="qty">${fmt(m.qty)}</span><span class="unit">${esc(m.unit)}</span></div><div class="mut">${n(m.min)>0?'mín. '+fmt(m.min):''}</div></article>`;
}

function startWatch(){
  if(unsubMeta) unsubMeta();
  if(unsubMaterials) unsubMaterials();
  unsubMeta = onSnapshot(doc(db,...STOCK_META), ()=>scheduleLoadAll(), err=>console.error('meta stock',err));
  unsubMaterials = onSnapshot(collection(db,'stock_materials'), ()=>scheduleLoadAll(), err=>console.warn('stock_materials listener',err));
}

['search','typeFilter','stockFilter'].forEach(id=>$(id).addEventListener('input',render));
$('refresh').onclick = loadAll;
$('loginBtn').onclick = async ()=>{
  try{
    $('loginErr').style.display='none';
    await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);
  }catch(e){
    $('loginErr').textContent='No se ha podido iniciar sesión: '+(e.code||e.message);
    $('loginErr').style.display='block';
  }
};
$('logout').onclick = ()=>signOut(auth);
onAuthStateChanged(auth, user=>{
  if(user){
    $('loginBox').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    setStatus('Conectado · solo lectura',true);
    startWatch();
    loadAll();
  }else{
    $('loginBox').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('logout').classList.add('hidden');
    setStatus('Sin conectar',false);
    if(unsubMeta) unsubMeta();
    if(unsubMaterials) unsubMaterials();
  }
});
</script>
</body>
</html>
